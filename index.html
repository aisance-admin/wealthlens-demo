/* ---------- file parsing ---------- */
const HEADER_MAP = {
  broker:["broker","брокер","custodian","bank","банк"],
  name:["name","instrument","security","описание","наименование","название","инструмент","ценная бумага"],
  cls:["class","asset class","assetclass","type","класс","класс актива","тип"],
  ccy:["currency","ccy","валюта","cur"],
  value:["value","market value","amount","стоимость","сумма","рыночная стоимость","mv"],
  quantity:["quantity","qty","количество","кол-во"],
  price:["price","цена","last","курс"],
  feeProduct:["fee","ter","expense","комиссия","комис","fee product","product fee"],
  ticker:["ticker","symbol","тикер","символ","bbg","bloomberg ticker"],
  isin:["isin","изин"],
  sector:["sector","сектор","industry","отрасль"],
  coupon:["coupon","купон"],
  // barrierDist объявлен ДО barrier: колонка «До барьера» содержит подстроку
  // «барьер», и без этого порядка барьер ноты читался бы как расстояние до него.
  barrierDist:["barrier distance","distance to barrier","до барьера","расстояние до барьера","buffer"],
  barrier:["barrier","барьер"],
  maturity:["maturity","погашение","maturity date"],
  underlying:["underlying","базовый","базовый актив"], notional:["notional","номинал"],
  capProt:["capital protection","защита капитала","защита","protection"],
  entry:["entry fee","входная комиссия","входная","upfront"],
  tenorYears:["tenor","срок при выпуске","срок, лет","term years"],
  expiry:["expiry","экспирация","expiration"],
  dtype:["derivative type","тип деривати ва"]
};
// Признаки, которые надо проверять РАНЬШЕ общего словаря.
// Порядок здесь — не стиль, а исправление дефекта: ключ "note" в списке
// структурных нот перехватывал "US Treasury Note 1.5% 2030" и уводил
// казначейку США в структурные продукты, а оттуда — в неликвид.
const NOTE_HINTS = ["autocall","phoenix","structured","reverse convertible","barrier note",
                    "нота","ноты","структурн","автоколл","барьерн"];
const BOND_HINTS = ["treasury","t-bill","t-note","bund","bobl","schatz","gilt","btp","oat",
                    "офз","ofz","евробонд","eurobond","муниципальн","debenture"];
// «1.5% 2030» в названии — устойчивый признак долговой бумаги
const BOND_PATTERN = /\d[.,]?\d*\s*%\s*(?:19|20)\d\d/;
// Альтернативы проверяются РАНЬШЕ фондов: иначе "Hedge Fund" ловится словом "fund"
const ALT_HINTS = ["hedge","private equity","venture","real estate fund","хедж","прямых инвестиц"];
const DERIV_HINTS = ["option","опцион","put","call ","warrant","future","фьючерс","swap","forward"];
const ETF_HINTS = ["ishares","spdr","vanguard","xtrackers","lyxor","amundi","invesco","etf","бпиф"];
// Юридические формы — надёжный признак акции. Со границами слова, чтобы
// "sa" не срабатывало внутри других слов.
const EQUITY_PATTERN = /\b(inc|corp|corporation|co|ltd|limited|plc|ag|sa|nv|bv|ab|asa|oyj|oy|gmbh|kgaa|sas|srl|spa|pjsc|aps|holdings?|group|company)\b\.?|\ba\/s\b/;
// Кириллические формы отдельно: \b в JS работает по ASCII и на «ао» не срабатывает
const EQUITY_PATTERN_RU = /(^|[\s(])(ао|ап|пао|оао|зао)([\s).,]|$)/;

const CLASS_MAP = {
  equity:["equity","equities","stock","акц","акция","акции"],
  bond:["bond","bonds","fixed income","облиг","бонд"],
  fund_etf:["fund","etf","mutual","фонд","etf"],
  structured_note:NOTE_HINTS,
  derivative:["derivative","option","future","swap","дериватив","опцион","фьючерс"],
  cash:["cash","кэш","деньги","money market","нал"],
  alternative:["alternative","hedge","private equity","альтернатив","хедж","pe"]
};
function normClass(s){
  const x=String(s||"").toLowerCase();
  if(!x.trim()) return "unknown";
  // Ноты — по явным признакам, а не по слову "note"
  if(NOTE_HINTS.some(w=>x.includes(w))) return "structured_note";
  if(BOND_HINTS.some(w=>x.includes(w))) return "bond";
  if(BOND_PATTERN.test(x)) return "bond";
  if(DERIV_HINTS.some(w=>x.includes(w))) return "derivative";
  if(ALT_HINTS.some(w=>x.includes(w))) return "alternative";
  if(ETF_HINTS.some(w=>x.includes(w))) return "fund_etf";
  for(const [k,list] of Object.entries(CLASS_MAP)) if(list.some(w=>x.includes(w))) return k;
  if(EQUITY_PATTERN.test(x) || EQUITY_PATTERN_RU.test(x)) return "equity";
  // Раньше здесь стоял тихий откат в "equity": нераспознанная бумага молча
  // становилась акцией и искажала аллокацию, диверсификацию, ликвидность и скор.
  return "unknown";
}
function mapHeaders(headers){
  const lower=headers.map(h=>String(h||"").trim().toLowerCase());
  const map={}, taken=new Set();
  const claim=(f,i)=>{ map[f]=i; taken.add(i); };
  // Сначала ТОЧНЫЕ совпадения заголовка, потом вхождение подстроки, и одна
  // колонка достаётся только одному полю. Иначе «Barrier %» и «До барьера %»
  // конкурируют за одно поле, а лишняя колонка достаётся кому попало.
  for(const [f,syn] of Object.entries(HEADER_MAP)){
    const i=lower.findIndex((h,ix)=>!taken.has(ix) && syn.some(x=>h===x));
    if(i>=0) claim(f,i);
  }
  for(const [f,syn] of Object.entries(HEADER_MAP)){
    if(map[f]!=null) continue;
    const i=lower.findIndex((h,ix)=>!taken.has(ix) && syn.some(x=>h.includes(x)));
    if(i>=0) claim(f,i);
  }
  return map;
}
function rowsToPositions(matrix){
  if(!matrix.length) return [];
  const headers=matrix[0]; const map=mapHeaders(headers);
  if(map.name==null && map.value==null && map.quantity==null) return []; // not recognizable
  const out=[];
  // Итоговая строка выписки — не позиция. Если её импортировать, портфель
  // удвоится: сумма всех бумаг войдёт в него ещё раз отдельной строкой.
  // Запоминаем её отдельно и потом сверяем с суммой распознанного.
  // \b в JS опирается на латиницу: после «итого» границы слова НЕ возникает,
  // и строка итога проскакивала в портфель, удваивая его. Границу задаём явно.
  const TOTAL_RE=/^\s*(итого|всего|итоговая|сумма|total|subtotal|sub-?total|grand\s*total|summe|gesamt|totaal)(\s|:|$|[^\wА-Яа-яЁё])/i;
  const statedTotals=[];
  for(let i=1;i<matrix.length;i++){
    const r=matrix[i]; if(!r || !r.length || r.every(c=>c===""||c==null)) continue;
    const g=f=> map[f]!=null? r[map[f]] : undefined;
    let value=parseNum(g("value"));
    if(!value && g("quantity")!=null && g("price")!=null) value=parseNum(g("quantity"))*parseNum(g("price"));
    const label=String(g("name")||r.find(c=>String(c||"").trim())||"").trim();
    if(TOTAL_RE.test(label)){
      // Итогов может быть несколько — по одному на валюту, как в настоящей
      // выписке. Запоминаем все с их валютой: сверка пойдёт по каждой отдельно,
      // так ошибка разбора локализуется до конкретного блока.
      if(value>0){
        const c=(String(g("ccy")||"").toUpperCase().match(/[A-Z]{3}/)||[null])[0]
             || (String(label).toUpperCase().match(/\b([A-Z]{3})\b/)||[null])[0];
        statedTotals.push({ccy:c, value});
      }
      continue;
    }
    if(!value) continue;
    const p={
      broker: (g("broker")||"—").toString().trim(),
      name: (g("name")||("Position "+i)).toString().trim(),
      // Класс берём из колонки, а если её нет или ячейка пуста — из названия.
      // Брокеры сплошь и рядом не проставляют класс, но «US Treasury Bond 2.1%
      // 2031» распознаётся по имени, и объявлять такую бумагу нераспознанной,
      // имея достаточно данных, — та же неправда, что и выдумывать за неё класс.
      cls: (()=>{ const byCol=normClass(g("cls"));
        return byCol!=="unknown" ? byCol
             : normClass([g("name"), g("ticker"), g("sector")].filter(Boolean).join(" ")); })(),
      // Валюта НЕ подставляется. Если колонки нет или код не распознан, позиция
      // уходит тем же путём, что и валюта без курса: видна, помечена, но в суммы
      // не входит. Раньше здесь молча появлялся USD — и 5 млн рублей считались
      // пятью миллионами долларов.
      ccy: (String(g("ccy")||"").toUpperCase().match(/[A-Z]{3}/)||["?"])[0],
      value, feeProduct: parseNum(g("feeProduct"))||0, sector:(g("sector")||"").toString()
    };
    // Числовые поля разбираем тем же парсером, что и суммы: в европейской
    // выписке купон приходит как «2,1», а `+"2,1"` — это NaN, после которого
    // строка доезжала до pct() и роняла вкладку.
    ["coupon","barrier","barrierDist","notional","capProt","entry","tenorYears"].forEach(f=>{
      const v=g(f); if(v==null||v==="") return;
      const n=parseNum(v); if(n||n===0) p[f]=n;
    });
    ["maturity","underlying","expiry"].forEach(f=>{ const v=g(f); if(v!=null&&v!=="") p[f]=v; });
    const tk=g("ticker"); if(tk) p.ticker=String(tk).trim().toUpperCase();
    const isin=g("isin"); if(isin) p.isin=String(isin).trim().toUpperCase();
    const qn=parseNum(g("quantity")); if(qn) p.qty=qn;
    // Раньше здесь незнакомая валюта молча становилась USD: миллион шведских
    // крон превращался в миллион долларов, и об этом никто не узнавал. Валюту
    // оставляем как есть — курса нет, значит сумма в базовой валюте неизвестна.
    out.push(p);
  }
  out._statedTotals = statedTotals;
  return out;
}
function parseNum(v){   // handles US (1,234.56), EU (1.234,56) and Swiss (1'234.56) number formats
  if(v==null) return 0;
  let t=String(v).replace(/[\s'’ ]/g,"").replace(/[^\d.,\-]/g,"");
  const hasC=t.indexOf(",")>-1, hasD=t.indexOf(".")>-1;
  if(hasC && hasD){ if(t.lastIndexOf(",")>t.lastIndexOf(".")) t=t.replace(/\./g,"").replace(/,/g,"."); else t=t.replace(/,/g,""); }
  else if(hasC){ if(/^-?\d+,\d{1,2}$/.test(t)) t=t.replace(",","."); else t=t.replace(/,/g,""); }
  else if(hasD && (t.match(/\./g)||[]).length>1){ t=t.replace(/\./g,""); }
  const n=parseFloat(t); return isNaN(n)?0:n;
}

// Accepts MULTIPLE files (CSV / Excel / PDF) and ACCUMULATES them into one consolidated portfolio.
async function handleFiles(fileList){
  const files=Array.from(fileList||[]); if(!files.length) return;
  STATE.importNote=null;
  let added=0; const failed=[]; let pdfHeur=false, pdfText=""; let skipped=0;
  // Итог, заявленный в самой выписке. Сверка с ним ловит ошибки разбора так,
  // как это сделал бы бухгалтер: сумма позиций обязана сойтись с итогом.
  let stated=null, statedSum=0, checkTotal=null;
  for(const file of files){
    try{
      let positions=[];
      if(/\.pdf$/i.test(file.name)){
        const r=await parsePdfFile(file); positions=r.positions; pdfHeur=true;
        skipped += (positions._skipped||[]).length;
        if(!positions.length) pdfText=r.text;
      } else if(/\.csv$/i.test(file.name)){
        positions=rowsToPositions(parseCSV(await file.text()));
        stated=positions._statedTotals;
      } else {
        if(!window.XLSX) throw 0;
        // cellDates: даты приходят объектами Date, а не серийниками — конвертировать нечего
        const wb=XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:"array",cellDates:true});
        positions=rowsToPositions(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""}));
        stated=positions._statedTotals;
      }
      if(!positions.length){ failed.push(file.name); continue; }
      const fname=file.name.replace(/\.[^.]+$/,"");
      positions.forEach(p=>{ if(!p.broker || p.broker==="—" || p.broker==="PDF") p.broker=fname; });   // tag by file/bank
      if(stated && stated.length){
        // Сверка отвечает на один вопрос: «прочитали ли мы все строки и числа».
        // Сравниваем в тех же единицах, в каких дан итог: если он помечен
        // валютой — только с позициями в этой валюте.
        const lines=stated.map(tot=>{
          const src = tot.ccy ? positions.filter(q=>q.ccy===tot.ccy) : positions;
          const sum = src.reduce((x,q)=>x+(+q.value||0),0);
          return {ccy:tot.ccy, stated:tot.value, sum,
                  diff: tot.value ? Math.abs(sum-tot.value)/tot.value : 0};
        });
        const ccys=[...new Set(positions.map(q=>q.ccy).filter(Boolean))];
        checkTotal={lines, ccys, mixed:ccys.length>1,
                    ok: lines.every(l=>l.diff<=0.005)};
        stated=null;
      }
      added+=addPositions(positions, file.name);
    }catch(e){ failed.push(file.name); }
  }
  // Итог импорта живёт в состоянии, а не в узле DOM. Раньше он писался в
  // #landErr, который render() к этому моменту уже уничтожил: предупреждение
  // «PDF разбирается эвристически» не показывалось ни секунды, а полный провал
  // импорта на дашборде проходил вообще молча — пользователь видел прежние
  // цифры и считал их разбором своего файла.
  STATE.importNote={added, failed, pdfHeur, skipped, checkTotal, files:files.map(f=>f.name),
                    duplicate:STATE.duplicateWarning};
  STATE.duplicateWarning=null;
  if(!added && pdfText) console.log("[WealthLens] extracted PDF text:\n"+pdfText);
  if(!added) toast(STATE.lang==="ru"
    ? (STATE.importNote.duplicate ? "Эта выписка уже загружена — портфель не изменился."
                                  : "Не удалось распознать ни одной позиции — данные на экране не изменились.")
    : (STATE.importNote.duplicate ? "This statement is already loaded — the portfolio is unchanged."
                                  : "No positions could be parsed — nothing on screen has changed."), true);
  render();
}

function csvDelimiter(text){
  // Разделитель определяется ОДИН раз по строке заголовка. Раньше резали сразу
  // и по запятой, и по точке с запятой: европейская выписка (разделитель «;»,
  // десятичная запятая внутри чисел) рассыпалась по колонкам — позиция на
  // 1 473 000 EUR попадала в портфель со стоимостью 50, и никакой ошибки.
  const head=(String(text||"").split(/\r?\n/)[0]||"");
  const countOutsideQuotes=ch=>{
    let n=0,q=false;
    for(let i=0;i<head.length;i++){ const c=head[i];
      if(c==='"'){ if(q && head[i+1]==='"') i++; else q=!q; }
      else if(!q && c===ch) n++;
    }
    return n;
  };
  const cand=[[";",countOutsideQuotes(";")],["\t",countOutsideQuotes("\t")],[",",countOutsideQuotes(",")]];
  cand.sort((a,b)=>b[1]-a[1]);
  return cand[0][1]>0 ? cand[0][0] : ",";
}
function parseCSV(text){
  const DELIM=csvDelimiter(text);
  const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"') q=true; else if(c===DELIM){ row.push(cur);cur=""; }
      else if(c==="\n"){ row.push(cur);rows.push(row);row=[];cur=""; }
      else if(c==="\r"){} else cur+=c; }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.length>1 || (r.length===1&&r[0]!==""));
}

// Extract text from a PDF and return {positions, text}. Best-effort — CSV/Excel is the reliable path.
const PDF_CELL="\u0001";   // граница колонки, восстановленная по разрывам в строке
async function parsePdfFile(file){
  if(!window.pdfjsLib) return {positions:[], text:""};
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const lines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); const tc=await page.getTextContent();
    const byY={};
    tc.items.forEach(it=>{ const y=Math.round(it.transform[5]); (byY[y]=byY[y]||[]).push(it); });
    Object.keys(byY).sort((a,b)=>b-a).forEach(y=>{
      // Границы колонок восстанавливаем по горизонтальным разрывам. Раньше всё
      // склеивалось пробелом, и «1 473 000,00» было не отличить от двух соседних
      // колонок: число рвалось на куски, а стоимостью позиции становился обрывок.
      const items=byY[y].sort((a,b)=>a.transform[4]-b.transform[4]);
      let txt="", prevEnd=null;
      items.forEach(it=>{
        const x=it.transform[4], w=it.width||0, h=Math.abs(it.height||8);
        if(prevEnd!=null){
          const gap=x-prevEnd;
          txt += gap > Math.max(5, h*0.55) ? PDF_CELL : (gap > 0.6 ? " " : "");
        }
        txt += it.str;
        prevEnd = x + w;
      });
      txt=txt.replace(/[ \t]+/g," ").replace(new RegExp(PDF_CELL+"+","g"),PDF_CELL).trim();
      if(txt) lines.push(txt);
    });
  }
  return {positions:pdfLinesToPositions(lines), text:lines.join("\n")};
}
// Heuristic row detection: a line with a name + amounts (+ optional ISIN/currency). Best-effort.
function pdfLinesToPositions(lines){
  const out=[], skipped=[];
  const ccyRe=/\b(USD|EUR|CHF|GBP|JPY|CAD|AUD|SEK|NOK|DKK|HKD|SGD|CNY|PLN|CZK|RUB)\b/;
  const isinRe=/\b([A-Z]{2}[A-Z0-9]{9}\d)\b/;
  const skipRe=/\b(total|subtotal|sub-total|page|statement|portfolio|valuation|balance|summary|as of|account|grand|итого|всего|страниц|выписк|оценк|баланс|сч[её]т|дата)\b/i;
  // Ячейка считается числовой, только если ВСЯ она — число: так «1 473 000,00»
  // остаётся одним значением, а не тремя обрывками.
  const numCellRe=/^[-+(]?[\d][\d.,'’\s\u00a0\u202f]*\)?%?$/;
  lines.forEach(raw=>{
    const cells=String(raw).split(PDF_CELL).map(c=>c.replace(/\s+/g," ").trim()).filter(Boolean);
    const flat=cells.join(" ");
    if(flat.length<4 || skipRe.test(flat)) return;
    const isin=(flat.match(isinRe)||[])[1];
    const vals=[];
    cells.forEach(c=>{
      if(isin && c.indexOf(isin)>=0) return;
      if(!numCellRe.test(c) || !/\d/.test(c)) return;
      if(/%$/.test(c)) return;                    // проценты — не сумма позиции
      const neg=/^\(.*\)$/.test(c);              // (1 200) — отрицательное
      const n=parseNum(c);
      if(n>0) vals.push(neg?-n:n);
    });
    if(!vals.length){ skipped.push(flat.slice(0,60)); return; }
    const val=Math.max.apply(null, vals.map(Math.abs));
    if(val<100){ skipped.push(flat.slice(0,60)); return; }
    const ccy=(flat.match(ccyRe)||[null])[0];      // не подставляем USD — см. rowsToPositions
    const nameCells=cells.filter(c=>!numCellRe.test(c));
    let name=(nameCells.join(" ")||flat).replace(isinRe," ").replace(ccyRe," ")
      .replace(/-?\d[\d.,'’%]*/g," ").replace(/\s+/g," ").trim();
    if(name.length<2){ skipped.push(flat.slice(0,60)); return; }
    const p={broker:"PDF", name:name.slice(0,60), cls:normClass(name), value:val, feeProduct:0, sector:""};
    if(ccy) p.ccy=ccy;
    if(isin) p.isin=isin;
    out.push(p);
  });
  out._skipped = skipped;
  return out.slice(0,100);
}

async function downloadTemplate(){
  const headers=["broker","name","asset_class","currency","value","quantity","ticker","fee_product","sector","coupon","barrier","maturity","underlying","notional"];

}

function bindView(a){
  // Тариф брокера живёт во вкладке «Комиссии»: пустое поле стирает значение,
  // а не записывает ноль.
  document.querySelectorAll("[data-tariff]").forEach(el=>{
    el.onchange=()=>{
      const b=el.dataset.broker, k=el.dataset.tariff, v=el.value.trim();
      STATE.brokerFees[b]=STATE.brokerFees[b]||{};
      if(v==="") delete STATE.brokerFees[b][k]; else STATE.brokerFees[b][k]=+v;
      if(STATE.brokerFees[b].advisory==null && STATE.brokerFees[b].custody==null) delete STATE.brokerFees[b];
      // Профиль НЕ перезаписывается по побочному действию: если после загрузки
      // выписки нового клиента ввести тариф, старый профиль молча заместился бы
      // объединённым портфелем двух семей. Сохранение — только явной кнопкой.
      render();
    };
  });
  if(STATE.view==="structured"){
    // Рабочее место для нот: поле заполнено -> подпись ноты изменилась ->
    // ensureNotesPriced() сам отправит её в движок при ближайшем рендере.
    document.querySelectorAll("[data-nb]").forEach(el=>{
      el.onchange=()=>{
        const n=(STATE.positions||[]).find(x=>x._id===+el.dataset.id); if(!n) return;
        const k=el.dataset.nb, v=el.value.trim();
        if(v===""){ delete n[k]; render(); return; }
        if(k==="underlying"||k==="maturity"){ n[k]=v; }
        else {
          const lim={coupon:[0,100],barrier:[1,100],capProt:[0,100],tenorYears:[0.25,30]}[k];
          const x=parseNum(v);
          if(!isFinite(x) || (lim && (x<lim[0] || x>lim[1]))){ delete n[k]; }
          else n[k]=x;
        }
        render();
      };
    });
    document.querySelectorAll("[data-nbguess]").forEach(b=>{
      b.onclick=()=>{
        const n=(STATE.positions||[]).find(x=>x._id===+b.dataset.nbguess); if(!n) return;
        const g=guessNoteParams(n);
        Object.keys(g).forEach(k=>{ if(g[k]!=null && (n[k]==null||n[k]==="")) n[k]=g[k]; });
        toast(STATE.lang==="ru"
          ? "Параметры подставлены из названия — сверьте с проспектом ноты."
          : "Parameters taken from the instrument name — verify against the term sheet.");
        render();
      };
    });
    document.querySelectorAll("[data-noteedit]").forEach(b=>{
      b.onclick=()=>{ STATE.editId=+b.dataset.noteedit; STATE.view="holdings"; STATE.holdFilter="all"; render(); };
    });
    document.querySelectorAll("[data-priceNote]").forEach(b=>{
      b.onclick=()=>{ const n=(STATE.positions||[]).find(x=>x._id===+b.dataset.pricenote);
        if(n){ STATE.engineDown=null; priceNoteViaEngine(n); } };
    });
    // Меняется допущение — меняется подпись ноты, и оценка пересчитывается сама.
    document.querySelectorAll("[data-assum]").forEach(el=>{
      const pos=()=>(STATE.positions||[]).find(x=>x._id===+el.dataset.note);
      if(el.dataset.assum==="clear"){
        el.onclick=()=>{ const n=pos(); if(!n) return; delete n.volOverride; delete n.rateOverride; render(); };
        return;
      }
      el.onchange=()=>{ const n=pos(); if(!n) return;
        const v=el.value.trim();
        const key=el.dataset.assum==="vol"?"volOverride":"rateOverride";
        const x=+v, lo=el.dataset.assum==="vol"?1:0, hi=el.dataset.assum==="vol"?150:30;
        if(v==="" || !isFinite(x) || x<lo || x>hi) delete n[key]; else n[key]=x;
        render();
      };
    });
  }
  if(STATE.view==="holdings"){
    document.querySelectorAll("th[data-sort]").forEach(th=> th.onclick=()=>{
      const k=th.dataset.sort;
      if(STATE.holdSort.k===k) STATE.holdSort.dir*=-1; else STATE.holdSort={k,dir:-1};
      render();
    });
    document.querySelectorAll(".chip[data-f]").forEach(c=> c.onclick=()=>{ STATE.holdFilter=c.dataset.f; render(); });
    document.querySelectorAll("[data-hedit]").forEach(b=> b.onclick=()=>{ STATE.editId=+b.dataset.hedit; render(); });
    document.querySelectorAll("[data-hdel]").forEach(b=> b.onclick=()=>{ delPosition(+b.dataset.hdel); });
    if(STATE.editId!=null){
      const sv=$("#e_save"); if(sv) sv.onclick=()=>{ const p=(STATE.positions||[]).find(x=>x._id===STATE.editId);
        if(p){ p.broker=($("#e_broker").value||"").trim()||"—"; p.name=($("#e_name").value||"").trim()||p.name; p.cls=$("#e_cls").value; p.ccy=$("#e_ccy").value; p.value=+$("#e_value").value||p.value; p.feeProduct=+$("#e_fee").value||0;
          // Значение вне диапазона — это не «введено», а мусор: оно не должно
          // попасть в расчёт (отрицательный срок давал отрицательную комиссию).
          const num=(id,lo,hi)=>{ const el=$(id); if(!el) return undefined;
            const v=el.value.trim(); if(v==="") return null;
            const x=+v; return (!isFinite(x) || x<lo || x>hi) ? null : x; };
          const str=id=>{ const el=$(id); if(!el) return undefined; return el.value.trim(); };
          const setF=(key,v)=>{ if(v===undefined) return; if(v===null||v==="") delete p[key]; else p[key]=v; };
          setF("underlying",str("#e_underlying")); setF("coupon",num("#e_coupon",0,100));
          setF("barrier",num("#e_barrier",1,100)); setF("capProt",num("#e_capprot",0,100));
          setF("maturity",str("#e_maturity"));     setF("tenorYears",num("#e_tenor",0.25,30));
        }
        STATE.editId=null; render(); };
      const cn=$("#e_cancel"); if(cn) cn.onclick=()=>{ STATE.editId=null; render(); };
      const dl=$("#e_del"); if(dl) dl.onclick=()=>{ delPosition(STATE.editId); };
    }
  }
}
