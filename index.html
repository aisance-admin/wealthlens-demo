  const h=location.hostname;
  if(h==="localhost"||h==="127.0.0.1") return location.origin;   // local `python3 server/...` one-URL mode
  return DEFAULT_BACKEND;                                          // GitHub Pages / file:// -> hosted API
}
async function postJSON(url, body, ms=120000){
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(), ms);
  try{
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctl.signal});
    const j=await r.json().catch(()=>({error:"HTTP "+r.status}));
    if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
    return j;
  } finally{ clearTimeout(to); }
}
async function fetchJSON(url, ms=7000){
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(), ms);
  try{ const r=await fetch(url,{signal:ctl.signal}); if(!r.ok) throw new Error("HTTP "+r.status); return await r.json(); }
  finally{ clearTimeout(to); }
}
function applyFxRates(rates, date, source){
  // Берём ВСЕ валюты, что прислал источник, а не заранее выбранную четвёрку:
  // у семейного офиса в портфеле легко окажется SEK, HKD или CAD, и раньше
  // такая позиция оставалась без курса просто потому, что её здесь не ждали.
  // Источник даёт единиц валюты за 1 USD, у нас FX — доллары за единицу.
  const f={USD:1};
  Object.keys(rates||{}).forEach(k=>{
    const code=String(k).toUpperCase(); if(code==="USD") return;
    const v=+rates[k]; if(v>0) f[code]=1/v;
  });
  // Вшитые курсы — только как запасной вариант для валют, которых не было в ответе.
  Object.keys(FX_EMBED).forEach(k=>{ if(f[k]==null) f[k]=FX_EMBED[k]; });
  FX=f; DATA.fx={status:"live", asOf:(date||"").toString().slice(0,10), source};
}
function cacheFx(){ try{ localStorage.setItem("wl_fx", JSON.stringify({fx:FX, meta:DATA.fx, ts:Date.now()})); }catch(e){} }
function loadFxCache(){ try{ const c=JSON.parse(localStorage.getItem("wl_fx")||"null"); if(!c||!c.fx) return false;
  FX=c.fx; DATA.fx=Object.assign({}, c.meta, {status:"stale"}); return true; }catch(e){ return false; } }

async function refreshFX(){
  const base=backendBase();
  if(base){ try{ const j=await fetchJSON(base+"/fx?base=USD"); applyFxRates(j.rates||j, j.date, j.source?("backend · "+j.source):"backend"); cacheFx(); return; }catch(e){} }
  try{ const j=await fetchJSON("https://api.frankfurter.dev/v1/latest?base=USD"); applyFxRates(j.rates, j.date, "Frankfurter · ECB"); cacheFx(); return; }catch(e){}
  try{ const j=await fetchJSON("https://open.er-api.com/v6/latest/USD"); if(j.result==="success"){ applyFxRates(j.rates, (j.time_last_update_utc||"").slice(0,16), "open.er-api"); cacheFx(); return; } }catch(e){}
  try{ const j=await fetchJSON("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json"); const u=j.usd||{}; const up={}; Object.keys(u).forEach(k=>{ up[k.toUpperCase()]=u[k]; }); applyFxRates(up, j.date, "currency-api"); cacheFx(); return; }catch(e){}
  if(!loadFxCache()){ FX=Object.assign({},FX_EMBED); DATA.fx={status:"embedded", asOf:FX_DATE_EMBED, source:"embedded"}; }
}
async function refreshPrices(){
  if(!STATE.positions) return {updated:0,total:0};
  const targets=STATE.positions.filter(p=>p.ticker && p.qty>0);
  let updated=0; const base=backendBase();
  if(base){
    const ids=targets.map(p=>p.ticker).join(",");
    let prov="";
    for(let attempt=0; attempt<2; attempt++){              // retry once on a transient empty response (cold isolate / throttle)
      try{
        const j=await fetchJSON(base+"/quote?symbols="+encodeURIComponent(ids), 45000);   // live scraping is slow; allow up to 45s
        prov=j._provider||""; updated=0;
        targets.forEach(p=>{ const raw=j[p.ticker]; const q=+(raw&&raw.price!=null?raw.price:raw); if(q>0){ p.value=p.qty*q; updated++; } });
        if(updated>0 || attempt===1){ DATA.prices={status:"live", source:"backend · "+prov, updated, total:targets.length}; return {updated,total:targets.length}; }
      }catch(e){ if(attempt===1){ DATA.prices={status:"embedded", source:"embedded", updated:0, total:targets.length}; return {updated:0,total:targets.length}; } }
    }
  }
  if(DATA.cfg.finnhubKey){
    for(const p of targets){ try{
      const j=await fetchJSON("https://finnhub.io/api/v1/quote?symbol="+encodeURIComponent(p.ticker)+"&token="+encodeURIComponent(DATA.cfg.finnhubKey));
      if(j && +j.c>0){ p.value=p.qty*(+j.c); updated++; }   // c===0 && t===0 => no quote; keep embedded
    }catch(e){} }
    DATA.prices={status: updated?"live":"embedded", source:"Finnhub", updated, total:targets.length}; return {updated,total:targets.length};
  }
  DATA.prices={status:"embedded", source:"embedded", updated:0, total:targets.length}; return {updated:0,total:targets.length};
}

/* ---- structured-note pricing via the vendored EvidenceInvest engine ---- */
/* На каком сроке считается нота — и, значит, ЧТО именно означает результат.
   Движок стартует со спота 100%, как на выпуске. Если известен исходный срок,
   получается настоящая маржа при выпуске — величина, зафиксированная навсегда.
   Если известна только дата погашения, честно считается остаточный срок, и
   тогда это НЕ маржа при выпуске: результат зависит от сегодняшней даты и
   называть его историческим утверждением о банке нельзя. Раньше подпись всегда
   гласила «при выпуске», а срок при этом брался остаточный — число таяло с
   календарём: 15.79% сегодня, ~5% через три года по той же ноте. */
function noteBasis(n){ return n.tenorYears>0 ? "issue" : "remaining"; }
function noteYears(n){
  if(n.tenorYears>0) return +n.tenorYears;
  const dt=parseDate(n.maturity);
  return dt ? Math.max(+(daysBetween(TODAY,dt)/365).toFixed(2), 0.5) : 3;
}
function basisLabel(n){
  const ru=STATE.lang==="ru";
  return noteBasis(n)==="issue"
    ? (ru?"при выпуске":"at issue")
    : (ru?"на остаточном сроке":"on remaining life");
}
function noteToEnginePayload(n){
  const nm=(n.name||"").toLowerCase();
  const prot=+n.capProt>0;
  // Защищённая нота с купоном — это "ios" (купонная нога + защищённое погашение).
  // Тип "capital_protected" в движке выбрасывает купон целиком и подставляет
  // 100% участия в росте: купон от 0 до 25% давал одну и ту же стоимость.
  // Автоколл "ios" поддерживает, поэтому имя продукта на выбор типа не влияет.
  const type = prot ? "ios"
             : nm.includes("phoenix") ? "phoenix"
             : nm.includes("autocall") ? "autocall"
             : "barrier_note";
  return {
    product_type:type,
    underlying:n.underlying||"",
    coupon:+n.coupon||0,
    barrier:+n.barrier||65,
    capital_protection:+n.capProt||0,
    currency:n.ccy||"USD",
    maturity_years:noteYears(n),
    nominal:+n.value||0,
    coupon_type: nm.includes("phoenix")?"memory":"conditional",
    autocall: prot ? (nm.includes("autocall")||nm.includes("phoenix")) : undefined,
    purchase_price:100,
    fair_coupon:true,
    // Допущения советника перекрывают справочник: утверждение о банке должно
    // строиться на числах, за которые готов отвечать тот, кто его делает.
    ...(n.volOverride!==""&&n.volOverride!=null ? {volatility:+n.volOverride/100} : {}),
    ...(n.rateOverride!==""&&n.rateOverride!=null ? {risk_free_rate:+n.rateOverride/100} : {})
  };
}
/* Чего не хватает, чтобы оценка ноты была утверждением, а не выдумкой.
   Дефолты payload'а (барьер 65%, срок 3 года, купон 0) молча превращали
   выписку, где есть только название и сумма, в обвинение банка в недоплате
   6.93 п.п. Пока этих полей нет, ноту не оцениваем вообще. */
const NOTE_REQUIRED = {
  coupon:     {ru:"купон",         en:"coupon"},
  barrier:    {ru:"барьер",        en:"barrier"},
  maturity:   {ru:"срок",          en:"maturity"},
  underlying: {ru:"базовый актив", en:"underlying"}
};
function noteMissing(n){
  const m=[];
  if(!(+n.coupon>0)) m.push("coupon");
  // У ноты с защитой капитала барьера нет по конструкции — требовать его
  // значило бы заставлять советника выдумывать несуществующий параметр.
  if(!(+n.capProt>0) && !(+n.barrier>0)) m.push("barrier");
  if(!n.tenorYears && !parseDate(n.maturity)) m.push("maturity");
  if(!String(n.underlying||"").trim()) m.push("underlying");
  return m;
}
function noteMissingLabel(m){
  const L=STATE.lang==="ru"?"ru":"en";
  return m.map(k=>NOTE_REQUIRED[k][L]).join(", ");
}

/* Утверждение о конкретном банке строится на НАШИХ допущениях волатильности и
   ставки. Формулировка обязана это называть — иначе это обвинение, а не оценка. */
const ENGINE_CAVEAT = {
  ru:"Оценка при указанных допущениях волатильности, ставки и кредитного спреда эмитента; не утверждение о нарушении.",
  en:"Valued under the stated volatility, rate and issuer credit-spread assumptions; not an assertion of misconduct."
};
/* Когда срок известен только по дате погашения, результат зависит от сегодняшней
   даты и историческим утверждением о банке не является. Это надо писать рядом. */
const BASIS_CAVEAT = {
  ru:"Исходный срок ноты в данных не указан, поэтому расчёт сделан на остаточном сроке: это текущая переоценка, а не маржа, зафиксированная при выпуске. Укажите срок при выпуске, чтобы получить историческую величину.",
  en:"The note's original tenor is absent from the data, so the calculation uses the remaining life: this is a current revaluation, not the margin fixed at issue. Enter the original tenor to obtain the historical figure."
};

/* Барьерный риск ноты. Порядок источников важен: вероятность пробоя из
   Монте-Карло — настоящий ответ; расстояние до барьера из файла — грубая
   замена; если нет ни того, ни другого, риск НЕ ОЦЕНЁН, и говорить
   «всё в порядке» инструмент не имеет права. */
function barrierRisk(n){
  const e=engineFor(n);
  const prob=e && e.probabilities ? e.probabilities.barrier_hit : null;
  if(prob!=null) return {prob, dist:n.barrierDist??null, src:"engine"};
  if(n.barrierDist!=null) return {prob:null, dist:n.barrierDist, src:"input"};
  return {prob:null, dist:null, src:null};
}
/* Два РАЗНЫХ сигнала, и ни один не заменяет другой:
   • prob — вероятность пробоя, посчитанная ОТ ДАТЫ ВЫПУСКА за весь срок (движок
     запускается со спота 100% и исходного тенора — иначе не посчитать маржу);
   • dist — насколько базовый актив выше барьера СЕЙЧАС.
   Нота может быть безопасной на выпуске и опасной сегодня. Берём худший из двух:
   вытеснить расстояние вероятностью значило бы промолчать ровно там, где риск
   реализовался. */
function barrierLevel(br){
  const rank={high:2, medium:1};
  const byProb = br.prob!=null ? (br.prob>=25?"high" : br.prob>=12?"medium" : null) : null;
  const byDist = br.dist!=null ? (br.dist<13?"high" : br.dist<20?"medium" : null) : null;
  const top=Math.max(rank[byProb]||0, rank[byDist]||0);
  return top===2?"high" : top===1?"medium" : null;
}

/* Подпись ноты — всё, что меняет оценку. Пока подпись та же, результат
   движка действителен; изменил советник купон или барьер — оценка
   автоматически считается заново, а не показывает вчерашнее число. */
function noteSig(n){
  const pl=noteToEnginePayload(n);
  return JSON.stringify([pl.product_type,pl.underlying,pl.coupon,pl.barrier,
    pl.capital_protection,pl.currency,pl.maturity_years,pl.nominal,pl.coupon_type,
    n.volOverride??null, n.rateOverride??null]);
}
/* Бэкенд без движка отвечает 200 на любой путь. Поэтому «пришёл ответ» и
   «пришла оценка» — разные вещи: принимаем только то, что структурно является
   оценкой. Без этой проверки чужой 200 доходил до enginePanel и валил render. */
function isEngineResult(r){
  return !!r && typeof r==="object" && !r.error
      && r.valuation && r.bank_margin && r.probabilities && r.assumptions;
}

/* Результат движка для позиции — только если он посчитан ИМЕННО для текущих
   параметров. Иначе null, и расчёт честно откатывается на данные из файла. */
function engineFor(p){
  if(p.cls==="structured_note" && noteMissing(p).length) return null;
  const e=STATE.notePrice[p._id];
  return (isEngineResult(e) && e.sig===noteSig(p)) ? e : null;
}
/* Оценка запускается сама при анализе портфеля, а не по кнопке: числа движка
   участвуют в комиссиях, скоре и резолюциях, поэтому не могут быть опцией. */
async function ensureNotesPriced(){
  const base=backendBase(); if(!base || STATE.engineDown) return;
  const todo=(STATE.positions||[]).filter(p=>p.cls==="structured_note")
    .filter(p=>!noteMissing(p).length)
    .filter(p=>{ const sig=noteSig(p);
      return !STATE.notePricing[p._id] && (STATE.notePrice[p._id]||{}).sig!==sig; });
  if(!todo.length) return;
  todo.forEach(p=>STATE.notePricing[p._id]=true);
  render();
  const sigs=new Map(todo.map(p=>[String(p._id), noteSig(p)]));
  try{
    const body={notes: todo.map(p=>Object.assign(noteToEnginePayload(p),{id:String(p._id)}))};
    const res=await postJSON(base+"/notes/price", body);
    // Бэкенд без движка (например, хостинг только для котировок) отвечает 200 на
    // любой путь. Отсутствие `results` — это «движка здесь нет», а не ошибка по
    // каждой ноте: продукт должен честно откатиться на данные из файла.
    if(!res || typeof res.results!=="object" || res.results===null){
      const e=new Error(STATE.lang==="ru"?"движок оценки нот на этом бэкенде недоступен"
                                         :"note pricing engine unavailable on this backend");
      e.permanent=true;   // дело в бэкенде, а не в связи — повторять бессмысленно
      throw e;
    }
    const got=res.results;
    Object.entries(got).forEach(([id,r])=>{
      STATE.notePrice[id]=((r&&r.error)||isEngineResult(r))
        ? Object.assign({}, r, {sig:sigs.get(id)})
        : {error:STATE.lang==="ru"?"ответ не является оценкой":"response is not a valuation", sig:sigs.get(id)};
    });
    // Нота, по которой сервер не прислал ничего, должна получить отметку —
    // иначе следующий render() запросит её снова, и так до бесконечности.
    sigs.forEach((sig,id)=>{ if(!(id in got)) STATE.notePrice[id]={error:"нет ответа по этой ноте", sig}; });
  }catch(e){
    const msg=String(e.message||e);
    // Отсутствие движка на бэкенде залипает: повторять нечего. Сбой связи или
    // таймаут — нет: отмечаем только эти ноты, следующая попытка возможна.
    if(e.permanent) STATE.engineDown=msg;
    todo.forEach(p=>{ STATE.notePrice[p._id]={error:msg, sig:sigs.get(String(p._id)), transient:!e.permanent}; });
  }finally{
    todo.forEach(p=>delete STATE.notePricing[p._id]);
    render();
  }
}

async function priceNoteViaEngine(n){
  const base=backendBase(); if(!base) return;
  const id=n._id;
  STATE.notePricing[id]=true; render();
  try{
    const sig=noteSig(n);
    const j=await postJSON(base+"/note/price", noteToEnginePayload(n));
    if(!isEngineResult(j)) throw new Error(STATE.lang==="ru"
      ? "движок оценки нот на этом бэкенде недоступен" : "note pricing engine unavailable on this backend");
    STATE.notePrice[id]=Object.assign({}, j, {sig});
  }catch(e){
    STATE.notePrice[id]={error:String(e.message||e), sig:noteSig(n)};
  }finally{
    delete STATE.notePricing[id]; render();
  }
}
function enginePanel(n){
  const ru=STATE.lang==="ru";
  const busy=STATE.notePricing[n._id];
  const r=STATE.notePrice[n._id];
  const btn=`<button class="btn ghost" data-priceNote="${n._id}" style="padding:4px 10px;font-size:11.5px"${busy?" disabled":""}>${busy?(ru?"Считаю…":"Pricing…"):(ru?"⚙ Пересчитать":"⚙ Re-price")}</button>`;
  const miss=noteMissing(n);
  if(miss.length) return `<div style="margin-top:9px;border-top:1px solid var(--line);padding-top:9px">
    <div style="color:var(--watch);font-size:12.5px"><b>${ru?"Оценка невозможна":"Cannot be valued"}</b></div>
    <div class="muted" style="font-size:11.5px;line-height:1.55;margin-top:4px">${ru
      ? `В выписке нет: <b>${noteMissingLabel(miss)}</b>. Без них движок считал бы по подставленным значениям, а вывод о марже банка и купоне был бы выдуман. Допишите параметры — оценка появится сама.`
      : `The statement lacks: <b>${noteMissingLabel(miss)}</b>. Without them the engine would run on invented inputs and any conclusion about issuer margin or coupon would be fabricated. Fill them in and the valuation appears.`}</div>
    <button class="btn ghost" data-noteedit="${n._id}" style="padding:4px 10px;font-size:11.5px;margin-top:7px">${ru?"Дописать параметры":"Complete the note"}</button>
  </div>`;
  if(!backendBase()) return "";
  if(!r || r.sig!==noteSig(n)) return `<div style="margin-top:9px;border-top:1px solid var(--line);padding-top:9px">
    <div class="muted" style="font-size:11.5px">${busy?(ru?"Монте-Карло считает ноту…":"Monte-Carlo pricing…"):(ru?"Оценка движком считается вместе с анализом портфеля.":"Engine valuation runs with the portfolio analysis.")}</div></div>`;
  if(r.error || !isEngineResult(r)) return `<div style="margin-top:9px;border-top:1px solid var(--line);padding-top:9px">${btn}
    <div class="err" style="font-size:12px;margin-top:6px">${esc(r.error||(ru?"ответ бэкенда не является оценкой":"backend response is not a valuation"))}</div></div>`;
  const v=r.valuation, b=r.bank_margin, pr=r.probabilities, a=r.assumptions, f=r.fair_coupon||{};
  const c=b.components||{};
  const mcol=b.total_pct>3.5?"var(--risk)":b.total_pct>0?"var(--watch)":"var(--good)";
  const bar=(lbl,val)=>{ const w=b.total_pct>0?Math.max(0,val/b.total_pct*100):0;
    return `<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;margin-top:3px">
      <span class="muted" style="flex:0 0 92px">${lbl}</span>
      <span style="flex:1;height:6px;background:var(--navy);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:${w}%;background:var(--note)"></i></span>
      <b style="flex:0 0 40px;text-align:right">${pct(val,2)}</b></div>`; };
  return `<div style="margin-top:9px;border-top:1px solid var(--line);padding-top:9px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.3px">${ru?"Оценка движком":"Engine valuation"}</span>${btn}
    </div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin:9px 0 4px;font-size:13px">
      <span>${ru?"Справедливая":"Fair value"}: <b>${pct(v.fair_value_pct,2)}</b></span>
      ${n.entry?`<span class="muted">${ru?"в файле было":"file said"} ${pct(((n.entry||0)+(n.tenorYears||3)*(n.feeProduct||0)),1)}</span>`:""}
      <span>${ru?"Зашито":"Embedded"} ${basisLabel(n)}: <b style="color:${mcol}">${pct(b.total_pct,2)}</b>
        <span class="muted">(${fmtMoney(Math.abs(b.total_abs)*(FX[a.currency]||1)/(FX[STATE.base]||1))})</span></span>
    </div>
    ${b.total_pct>0?bar(ru?"структурир.":"structuring",c.structuring_fee||0)+bar(ru?"хеджир.":"hedging",c.hedging_cost||0)+bar(ru?"кред. риск":"credit",c.credit_risk_premium||0)+bar(ru?"дистриб.":"distribution",c.distribution_fee||0):""}
    ${f.fair_coupon_pct!=null?`<div style="margin-top:9px;padding:8px 10px;background:var(--navy);border-radius:7px;font-size:12.5px">
      ${ru?"Справедливый купон":"Fair coupon"}: <b>${pct(f.fair_coupon_pct,2)}</b> ${ru?"против предложенных":"vs offered"} <b>${pct(f.offered_coupon_pct,2)}</b>
      ${f.shortfall_pp>0.05?`<span style="color:var(--risk)"> · ${ru?"недоплата":"shortfall"} ${f.shortfall_pp.toFixed(2)} ${ru?"п.п./год":"pp p.a."}</span>`:""}
    </div>`:""}
    <div class="note-meta" style="font-size:11.5px;margin-top:8px">
      ${ru?"Автоколл":"Autocall"} <b>${pct(pr.autocall||0,1)}</b> · ${ru?"пробой барьера":"barrier hit"} <b>${pct(pr.barrier_hit||0,1)}</b> · ${ru?"полный возврат":"full return"} <b>${pct(pr.full_return||0,1)}</b>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:9px;font-size:11.5px">
      <span class="muted">${ru?"Свои допущения:":"Your assumptions:"}</span>
      <label style="display:flex;align-items:center;gap:4px">${ru?"вол.":"vol"}
        <input data-assum="vol" data-note="${n._id}" type="number" step="0.5" min="1" max="150"
          placeholder="${((a.volatility||0)*100).toFixed(0)}" value="${n.volOverride??""}"
          style="width:58px;padding:3px 5px;font-size:11.5px"/>%</label>
      <label style="display:flex;align-items:center;gap:4px">${ru?"ставка":"rate"}
        <input data-assum="rate" data-note="${n._id}" type="number" step="0.1" min="0" max="30"
          placeholder="${((a.risk_free_rate||0)*100).toFixed(2)}" value="${n.rateOverride??""}"
          style="width:58px;padding:3px 5px;font-size:11.5px"/>%</label>
      ${(n.volOverride||n.rateOverride)?`<button class="btn ghost" data-assum="clear" data-note="${n._id}" style="padding:3px 8px;font-size:11px">${ru?"сбросить":"reset"}</button>`:""}
      ${btn}
    </div>
    <div class="footnote" style="margin-top:6px;color:var(--watch)">${ENGINE_CAVEAT[ru?"ru":"en"]}</div>
    <div class="footnote" style="margin-top:4px">${ru?("Оценка "+basisLabel(n)+", срок"):("Priced "+basisLabel(n)+", tenor")} <b>${a.maturity_years} ${ru?"г.":"y"}</b> · vol ${pct((a.volatility||0)*100,0)} (${esc(a.volatility_source||"")}), div ${pct((a.dividend_yield||0)*100,1)}, ${ru?"ставка":"rate"} ${pct((a.risk_free_rate||0)*100,2)} · ${r.engine.n_paths.toLocaleString()} ${ru?"путей":"paths"}</div>
  </div>`;
}

/* ---- settings panel + freshness badges ---- */
function badgePill(label, status, extra){
  const map={live:["var(--good)",t("bLive")], stale:["var(--watch)",t("bStale")], embedded:["var(--muted)",t("bOff")], loading:["var(--gold2)",t("refreshing")]};
  const m=map[status]||map.embedded;
  return `<span class="pill" style="background:${m[0]}22;color:${m[0]};font-size:10.5px">${label} · ${m[1]}${extra?` ${extra}`:""}</span>`;
}
function dataBadges(){
  const fx=DATA.fx, pr=DATA.prices;
  const fxExtra=fx.asOf?`${t("asof")} ${fx.asOf}`:"";
  const prExtra=pr.total?`${pr.updated}/${pr.total}`:"";
  return `<span style="display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle">${badgePill(t("fxLbl"),fx.status,fxExtra)}${badgePill(t("pricesLbl"),pr.status,prExtra)}</span>`;
}
function settingsPanel(){
  const c=DATA.cfg; const ru=STATE.lang==="ru";
  const profiles=getProfiles(); const pnames=Object.keys(profiles);
  const profRows = pnames.length ? pnames.map(n=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px"><span>${esc(n)} <span class="muted" style="font-size:11.5px">${esc(profiles[n].savedAt||"")}</span></span><span><button class="chip" data-loadprof="${esc(n)}">${ru?"Загрузить":"Load"}</button> <button class="chip" data-delprof="${esc(n)}">✕</button></span></div>`).join("") : `<div class="muted" style="font-size:12.5px">${ru?"нет сохранённых профилей":"no saved profiles"}</div>`;
  const srcRows = (STATE.positions&&STATE.sources.length) ? STATE.sources.map(s=>{ const cnt=STATE.positions.filter(p=>(p._src||"—")===s).length; return `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px"><span>${esc(s)} <span class="muted">(${cnt})</span></span><button class="chip" data-rmsrc="${esc(s)}">✕ ${ru?"убрать":"remove"}</button></div>`; }).join("") : "";
  return `<div class="panel" id="settingsPanel">
    <h3>⚙︎ ${t("cfgTitle")}</h3>
    <div class="cfg-grid">
      <div><label>${t("cfgBackend")}</label><input id="cfg_backend" placeholder="${esc(backendBase()||"https://your-server/api")}" value="${esc(c.backendUrl||"")}"/>
        <div class="footnote">${t("cfgBackendHint")}</div></div>
      <div><label>${t("cfgFinnhub")}</label><input id="cfg_finnhub" type="password" placeholder="finnhub api key" value="${esc(c.finnhubKey||"")}"/>
        <div class="footnote">${t("cfgFinnhubHint")}</div></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center">
      <button class="btn" id="cfg_save">${t("cfgSave")}</button>
      <button class="btn ghost" id="cfg_fx">↻ FX</button>
      <button class="btn ghost" id="cfg_prices">↻ ${t("cfgPrices")}</button>
      <button class="btn ghost" id="cfg_clear">${t("cfgClear")}</button>
      <span class="muted" id="cfg_status" style="font-size:12.5px"></span>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <h3 style="font-size:14px;margin-bottom:10px">${ru?"Профили клиентов":"Client profiles"}</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div style="flex:1;min-width:180px"><label style="font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px">${ru?"Имя клиента / профиля":"Client / profile name"}</label><input id="cfg_client" placeholder="${ru?'напр. Семья Ивановых':'e.g. Smith Family'}" value="${esc(STATE.client||"")}"/></div>
      <button class="btn" id="cfg_saveprof" ${STATE.positions?"":"disabled"}>${ru?"Сохранить профиль":"Save profile"}</button>
    </div>
    <div style="margin-top:10px">${profRows}</div>
    ${(STATE.positions&&STATE.sources.length)?`<hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <h3 style="font-size:14px;margin-bottom:8px">${ru?"Загруженные выписки":"Loaded statements"}</h3>
    <div>${srcRows}</div>`:""}
    <div class="footnote" style="margin-top:12px">🔒 ${t("cfgSec")}</div>
  </div>`;
}
function bindSettings(){
  const st=$("#cfg_status"); const say=m=>{ if(st) st.textContent=m; };
  const readCfg=()=>{ const b=$("#cfg_backend"), f=$("#cfg_finnhub");
    const was=DATA.cfg.backendUrl;
    if(b) DATA.cfg.backendUrl=b.value.trim(); if(f) DATA.cfg.finnhubKey=f.value.trim(); saveCfg();
    // Сменили адрес бэкенда — прежний вывод «движка нет» к нему не относится.
    if(DATA.cfg.backendUrl!==was){ STATE.engineDown=null; STATE.notePrice={}; }
  };
  const sv=$("#cfg_save"); if(sv) sv.onclick=()=>{ readCfg(); say(t("cfgSaved")); };
  const fx=$("#cfg_fx"); if(fx) fx.onclick=async()=>{ readCfg(); say(t("refreshing")); await refreshFX(); render(); };
  const pr=$("#cfg_prices"); if(pr) pr.onclick=async()=>{ readCfg(); say(t("refreshing")); await refreshPrices(); render(); };
  const cl=$("#cfg_clear"); if(cl) cl.onclick=()=>{ DATA.cfg.finnhubKey=""; saveCfg(); const i=$("#cfg_finnhub"); if(i) i.value=""; say(t("cfgSaved")); };
  const ru=STATE.lang==="ru";
  const cc=$("#cfg_client"); if(cc) cc.onchange=()=>{ STATE.client=cc.value.trim(); saveAutosave(); };
  const spf=$("#cfg_saveprof"); if(spf) spf.onclick=()=>{ if(cc) STATE.client=cc.value.trim(); const nm=STATE.client||("Profile "+(Object.keys(getProfiles()).length+1)); saveProfile(nm); say(ru?"Профиль сохранён":"Profile saved"); render(); };
  document.querySelectorAll("[data-loadprof]").forEach(b=> b.onclick=()=> loadProfile(b.dataset.loadprof));
  document.querySelectorAll("[data-delprof]").forEach(b=> b.onclick=()=>{ deleteProfile(b.dataset.delprof); render(); });
  document.querySelectorAll("[data-rmsrc]").forEach(b=> b.onclick=()=> removeSource(b.dataset.rmsrc));
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  document.documentElement.lang = STATE.lang;
  $("#tagline").textContent = t("tagline");
  // currency seg
  $("#curSeg").innerHTML = ["USD","EUR","CHF"].map(c=>`<button data-cur="${c}" class="${STATE.base===c?'on':''}">${c}</button>`).join("");
  // lang seg
  [...$("#langSeg").children].forEach(b=> b.classList.toggle("on", b.dataset.lang===STATE.lang));
  // reset btn
  const rb=$("#resetBtn"); rb.textContent=t("reset"); rb.style.display = STATE.positions? "inline-block":"none";

  saveAutosave();   // persist current portfolio so a reload restores it
  const app=$("#app");
  const head = STATE.settingsOpen ? settingsPanel() : "";
  if(STATE.showClients){ app.innerHTML=head+clientsView(); bindClients(); if(STATE.settingsOpen) bindSettings(); return; }
  if(!STATE.positions){ app.innerHTML=head+importBanner()+landing(); bindLanding();
    const ic0=$("#importNoteClose"); if(ic0) ic0.onclick=()=>{ STATE.importNote=null; render(); };
    if(STATE.settingsOpen) bindSettings(); return; }

  const a = analyze(STATE.positions);
  // Базовый срез фиксируем только когда ноты уже оценены движком, иначе первый
  // же результат оценки покажется «изменением портфеля», которого не было.
  if(!STATE.baseline && !a.enginePending)
    STATE.baseline={score:a.score, fee:a.blendedFee, top1:a.top1, illiquid:a.illiquidPct, aum:a.aum};
  app.innerHTML = head + tabsBar() + importBanner() + fxUnknownBanner(a) + unclassifiedBanner() + viewBody(a);
  bindTabs(); bindView(a); if(STATE.settingsOpen) bindSettings();
  const rbb=$("#rebaseBtn"); if(rbb) rbb.onclick=()=>{ STATE.baseline={score:a.score, fee:a.blendedFee, top1:a.top1, illiquid:a.illiquidPct, aum:a.aum}; render(); };
  ensureNotesPriced();   // сам себя останавливает, когда всё оценено
}

function tabsBar(){
  const tabs=[["overview","tOverview"],["holdings","tHoldings"],["structured","tStruct"],["fees","tFees"],["health","tHealth"]];
  return `<div class="toolbar">
      <nav class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${STATE.view===k?'on':''}">${t(l)}</button>`).join("")}</nav>
      <div class="src-indicator" title="${esc((STATE.sources||[]).join(', '))}">${t("source")}: <b>${esc(STATE.source)}</b> · ${STATE.positions.length} ${t("loaded")} ${dataBadges()} <button class="btn ghost" id="addStmtBtn" style="margin-left:8px;padding:5px 11px;font-size:12px">+ ${STATE.lang==="ru"?"Выписка":"Statement"}</button>${backendBase()?` <button class="btn ghost" id="livePricesBtn" style="margin-left:8px;padding:5px 11px;font-size:12px">↻ ${STATE.lang==="ru"?"Цены (live)":"Prices (live)"}</button>`:""} <button class="btn ghost" id="reportBtn" style="margin-left:8px;padding:5px 11px;font-size:12px">🖨 ${STATE.lang==="ru"?"Отчёт":"Report"}</button> <button class="btn ghost" id="csvBtn" style="margin-left:8px;padding:5px 11px;font-size:12px">⬇ CSV</button></div>
    </div>`;
}

function viewBody(a){
  switch(STATE.view){
    case "overview": return vOverview(a);
    case "holdings": return vHoldings(a);
    case "structured": return vStructured(a);
    case "fees": return vFees(a);
    case "health": return vHealth(a);
  }
}

/* Итог последней загрузки файла — постоянной плашкой, пока её не закроют.
   Показывает и успех, и то, чего разбор НЕ смог: иначе дашборд выглядит
   разбором вашей выписки независимо от того, что из неё удалось прочитать. */
function importBanner(){
  const n=STATE.importNote; if(!n) return "";
  const ru=STATE.lang==="ru";
  const bad=!n.added;
  const parts=[];
  if(n.added) parts.push(ru?`Добавлено позиций: <b>${n.added}</b>`:`Added <b>${n.added}</b> positions`);
  if(n.failed.length) parts.push(ru?`не распознаны файлы: <b>${n.failed.map(esc).join(", ")}</b>`
                                   :`files not parsed: <b>${n.failed.map(esc).join(", ")}</b>`);
  if(n.skipped) parts.push(ru?`пропущено строк без суммы: <b>${n.skipped}</b>`
                             :`rows skipped without a value: <b>${n.skipped}</b>`);
  if(n.duplicate) parts.push(ru
    ? `<b>эта выписка уже загружена</b> (как «${esc(n.duplicate.prev)}») — повторно не добавлена, портфель не изменился`
    : `<b>this statement is already loaded</b> (as "${esc(n.duplicate.prev)}") — not added again, the portfolio is unchanged`);
  if(!n.added && !n.duplicate) parts.push(ru?"<b>ни одной позиции прочитать не удалось — на экране прежние данные</b>"
                            :"<b>no positions could be read — the screen still shows the previous data</b>");
  return `<div class="panel" style="display:flex;align-items:flex-start;gap:13px;flex-wrap:wrap;
      padding:12px 16px;border-color:${bad?"var(--risk)":"var(--watch)"};background:var(--navy)">
    <span style="color:${bad?"var(--risk)":"var(--watch)"};font-size:16px;line-height:1.2">${bad?"▲":"i"}</span>
    <div style="flex:1;min-width:220px;font-size:13px;line-height:1.55">
      ${parts.join(" · ")}
      ${n.checkTotal?(()=>{ const c=n.checkTotal;
        const num=v=>v.toLocaleString(ru?"ru-RU":"en-US",{maximumFractionDigits:0});
        const rows=c.lines.map(l=>{ const ok=l.diff<=0.005;
          return `<div style="color:${ok?"var(--good)":"var(--risk)"}">${l.ccy?esc(l.ccy)+": ":""}${ru?"заявлено":"stated"} <b>${num(l.stated)}</b>, ${ru?"распознано":"parsed"} <b>${num(l.sum)}</b> — ${ok?(ru?"сходится":"matches"):`<b>${ru?"расхождение":"gap"} ${(l.diff*100).toFixed(1)}%</b>`}</div>`;
        }).join("");
        const note = (c.mixed && c.lines.some(l=>!l.ccy))
          ? `<div class="muted" style="margin-top:3px">${ru
              ? `Итог дан без валюты, а позиции в разных (${c.ccys.join(", ")}) — сравнение идёт по сумме колонки, не по активам.`
              : `The total carries no currency while positions span several (${c.ccys.join(", ")}) — the comparison is on the raw column sum, not on assets.`}</div>` : "";
        return `<div style="font-size:12.5px;margin-top:5px;line-height:1.5">
          <span class="muted">${ru?"Сверка с итогами выписки":"Reconciliation with statement totals"}:</span>
          ${rows}${note}</div>`; })():""}
      ${n.pdfHeur?`<div class="muted" style="font-size:12.5px;margin-top:4px">${ru
        ? "PDF разбирается эвристически: колонки восстанавливаются по расположению текста. <b>Сверьте суммы и количество позиций с выпиской</b> прежде чем делать выводы — надёжнее CSV/Excel-экспорт из брокера."
        : "The PDF is parsed heuristically: columns are inferred from text layout. <b>Check the amounts and the number of positions against the statement</b> before drawing conclusions — a CSV/Excel export is the reliable path."}</div>`:""}
    </div>
    <button class="btn ghost" id="importNoteClose" style="padding:4px 10px;font-size:11.5px">${ru?"Понятно":"Got it"}</button>
  </div>`;
}

function fxUnknownBanner(a){
  if(!a || !a.fxUnknown.length) return "";
  const ru=STATE.lang==="ru";
  const byCcy=a.fxUnknownCcy.map(c=>{
    const v=a.fxUnknown.filter(r=>r.ccy===c).reduce((s,r)=>s+r.value,0);
    return `${v.toLocaleString(ru?"ru-RU":"en-US",{maximumFractionDigits:0})} ${esc(c)}`;
  }).join(" · ");
  return `<div class="panel" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;
      padding:12px 16px;border-color:var(--risk);background:var(--navy)">
    <span style="color:var(--risk);font-size:16px">▲</span>
    <div style="flex:1;min-width:220px">
      <b style="font-size:13.5px">${a.fxUnknown.length} ${ru?"позиц"+(a.fxUnknown.length===1?"ия":"ий")+" в валюте без курса":"position(s) in a currency with no rate"}: ${byCcy}</b>
      <div class="muted" style="font-size:12.5px;line-height:1.5;margin-top:2px">${ru
        ? "Курс этих валют получить не удалось, поэтому суммы в базовой валюте неизвестны — эти позиции <b>не входят</b> в активы под анализом, распределение и комиссии. Приложение не переводит их по курсу 1:1."
        : "No rate was available for these currencies, so their base-currency value is unknown — they are <b>excluded</b> from assets under analysis, allocation and fees. The app does not convert them at 1:1."}</div>
    </div>
  </div>`;
}

function unclassifiedBanner(){
  if(!STATE.positions) return "";
  const n=STATE.positions.filter(p=>p.cls==="unknown").length;
  if(!n) return "";
  const ru=STATE.lang==="ru";
  const word = ru ? (n===1?"позиция не распознана":(n<5?"позиции не распознаны":"позиций не распознано"))
                  : (n===1?"position is unclassified":"positions are unclassified");
  return `<div class="panel" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;
      padding:12px 16px;border-color:var(--watch);background:var(--navy)">
    <span style="color:var(--watch);font-size:16px">▲</span>
    <div style="flex:1;min-width:220px">
      <b style="font-size:13.5px">${n} ${word}</b>
      <div class="muted" style="font-size:12.5px;line-height:1.5;margin-top:2px">${ru

function whatIfStrip(a){

/* Всё, что принадлежит КЛИЕНТУ, а не приложению. Когда портфель убран целиком,

   нот и базовый срез перетекут между людьми. */
function clearClientState(){

}
function delPosition(id){

}
function buildReport(a){
  const ru=STATE.lang==="ru";
  const L=(r,e)=>ru?r:e;
  const today=new Date().toLocaleDateString(ru?"ru-RU":"en-GB",{day:"2-digit",month:"long",year:"numeric"});
  const B=STATE.base;
  const money=v=>fmtFull(v);
  const shareRow=(k,v,extra="")=>`<tr><td>${esc(k)}</td>${extra}
    <td class="num">${money(v)}</td><td class="num" style="width:58px">${pct(a.aum?v/a.aum*100:0)}</td></tr>`;

  /* ---------- 1. сводка ---------- */
  const subLabels={diversification:"cDiversification",cost:"cCost",currency:"cCurrency",
                   liquidity:"cLiquidity",quality:"cQuality",cash:"cCash"};
  const subRows=Object.keys(a.W).map(k=>{
    const v=a.sub[k];
    return `<div class="rep-sub-row">
      <span class="lbl">${t(subLabels[k])} <span class="muted">${Math.round(a.W[k]*100)}%</span></span>
      <span class="track">${v==null?"":`<i class="fill" style="width:${v}%;background:${ratingColor(v)}"></i>`}</span>
      <span class="val" style="color:${v==null?"#999":ratingColor(v)}">${v==null?L("н/д","n/a"):Math.round(v)}</span>
    </div>`;
  }).join("");

  /* ---------- оговорки: всё, чего инструмент НЕ знает ---------- */
  const caveats=[];
  if(!a.feeComplete) caveats.push(L(
    `<b>Тарифы брокеров не заведены</b> по ${a.brokersMissing.map(esc).join(", ")} (${money(a.missingVal)} активов). Комиссия ${pct(a.blendedFee,2)}/год посчитана только по TER из выписки и марже нот; консультационная и кастоди в неё не входят — <b>фактические издержки выше</b>. Подоценка «издержки» помечена «н/д», её вес перераспределён между остальными.`,
    `<b>Broker tariffs not entered</b> for ${a.brokersMissing.map(esc).join(", ")} (${money(a.missingVal)} of assets). The ${pct(a.blendedFee,2)} p.a. figure covers only statement TERs and note margins; advisory and custody are excluded — <b>actual costs are higher</b>. The cost sub-score is marked n/a and its weight redistributed.`));
  const unk=a.rows.filter(r=>r.cls==="unknown");
  if(unk.length) caveats.push(L(
    `<b>${unk.length} позиц. не классифицированы</b> (${money(unk.reduce((s,r)=>s+r.baseValue,0))}): ${unk.slice(0,5).map(r=>esc(r.name)).join(", ")}${unk.length>5?" и др.":""}. Они искажают распределение, диверсификацию и оценку ликвидности.`,
    `<b>${unk.length} position(s) unclassified</b> (${money(unk.reduce((s,r)=>s+r.baseValue,0))}): ${unk.slice(0,5).map(r=>esc(r.name)).join(", ")}${unk.length>5?" and others":""}. They distort allocation, diversification and liquidity.`));
  if(a.fxUnknown.length) caveats.push(L(
    `<b>${a.fxUnknown.length} позиц. в валютах без курса</b> (${a.fxUnknownCcy.map(esc).join(", ")}) — их стоимость в ${B} неизвестна, и они <b>не входят</b> ни в активы, ни в распределение, ни в издержки.`,
    `<b>${a.fxUnknown.length} position(s) in currencies with no rate</b> (${a.fxUnknownCcy.map(esc).join(", ")}) — their ${B} value is unknown and they are <b>excluded</b> from assets, allocation and costs.`));
  const noteGaps=a.notes.filter(n=>noteMissing(n).length);
  if(noteGaps.length) caveats.push(L(
    `<b>${noteGaps.length} нот${noteGaps.length===1?"а не оценена":" не оценены"}</b> (${money(noteGaps.reduce((s,n)=>s+n.baseValue,0))}): ${noteGaps.map(n=>`${esc(n.name)} — нет ${noteMissingLabel(noteMissing(n))}`).join("; ")}. Ни маржа эмитента, ни вероятность пробоя барьера по ним не считались.`,
    `<b>${noteGaps.length} note(s) not valued</b> (${money(noteGaps.reduce((s,n)=>s+n.baseValue,0))}): ${noteGaps.map(n=>`${esc(n.name)} — missing ${noteMissingLabel(noteMissing(n))}`).join("; ")}. Neither issuer margin nor barrier probability was computed.`));
  if(a.durMissing.length) caveats.push(L(
    `<b>Дюрация не посчитана</b> по ${a.durMissing.length} облигац. (${a.durMissing.map(b=>esc(b.name)).join(", ")}) — нет купона или даты погашения. Показатель ${a.portDuration!=null?`${a.portDuration.toFixed(2)} охватывает ${pct(a.durCoverage*100,0)} номинала`:"не рассчитан"}.`,
    `<b>Duration not computed</b> for ${a.durMissing.length} bond(s) (${a.durMissing.map(b=>esc(b.name)).join(", ")}) — coupon or maturity missing. The figure ${a.portDuration!=null?`${a.portDuration.toFixed(2)} covers ${pct(a.durCoverage*100,0)} of nominal`:"could not be computed"}.`));
  if(a.techShare==null) caveats.push(L(
    "<b>Сектор не указан</b> ни в одной строке выписки — концентрация по секторам не оценивалась и в скор не входит.",
    "<b>Sector is absent</b> from every statement row — sector concentration was not assessed and is excluded from the score."));
  const ck=(STATE.importNote||{}).checkTotal;
  if(ck) caveats.push((()=>{
    const num=v=>v.toLocaleString(ru?"ru-RU":"en-US",{maximumFractionDigits:0});
    const bad=ck.lines.filter(l=>l.diff>0.005);
    const head = bad.length
      ? L(`<b>Расхождение с итогами выписки</b> (${bad.map(l=>l.ccy||"итог").join(", ")}) — часть позиций прочитана неверно, <b>выводы делать рано</b>: `,
          `<b>Gap versus the statement totals</b> (${bad.map(l=>l.ccy||"total").join(", ")}) — some positions were misread, <b>conclusions are premature</b>: `)
      : L("<b>Все строки выписки прочитаны</b>, итоги сошлись: ",
          "<b>Every statement row was read</b>, totals match: ");
    const body = ck.lines.map(l=>`${l.ccy?l.ccy+" ":""}${num(l.stated)} → ${num(l.sum)}`).join("; ");
    const tail = (ck.mixed && ck.lines.some(l=>!l.ccy))
      ? L(` Итог в выписке дан без валюты, а позиции в разных (${ck.ccys.join(", ")}), поэтому сверка идёт по сумме колонки и активами не является: активы ${money(a.aum)} в ${B}.`,
          ` The statement total carries no currency while positions span several (${ck.ccys.join(", ")}), so the check runs on the raw column sum and is not the asset total: assets are ${money(a.aum)} in ${B}.`)
      : "";
    return head+body+"."+tail;
  })());

  const caveatBox = caveats.length ? `<div class="rep-note${ck&&!ck.ok?" alert":""}">
    <b>${L("Что учтено не полностью","Known gaps")}</b>
    <ul>${caveats.map(c=>`<li>${c}</li>`).join("")}</ul></div>` : "";

  /* ---------- 2. структура ---------- */
  const cls=Object.entries(a.byClass).sort((x,y)=>y[1]-x[1])
    .map(([k,v])=>shareRow(t(CLASSES[k]?CLASSES[k].k:k),v)).join("");
  const brk=Object.entries(a.byBroker).sort((x,y)=>y[1]-x[1]).map(([k,v])=>shareRow(k,v)).join("");
  const ccy=Object.entries(a.byCcy).sort((x,y)=>y[1]-x[1]).map(([k,v])=>shareRow(k,v)).join("");
  const top10=a.sorted.slice(0,10).map((r,i)=>`<tr>
    <td class="num muted" style="width:18px">${i+1}</td><td>${esc(r.name)}</td>
    <td class="muted">${esc(r.broker)}</td>
    <td class="num">${money(r.baseValue)}</td><td class="num">${pct(r.weight)}</td></tr>`).join("");

  /* ---------- 3. издержки ---------- */
  const comp=a.feeComponents;
  const feeRows=[["advisory",comp.advisory],["custody",comp.custody],["product",comp.product],["entryAmort",comp.entryAmort]]
    .filter(([,v])=>v>0)
    .map(([k,v])=>`<tr><td>${t(k)}</td><td class="num">${money(v)}</td>
      <td class="num">${pct(a.aum?v/a.aum*100:0,2)}</td></tr>`).join("");
  const tariffRows=a.brokersAll.map(b=>{
    const f=(STATE.brokerFees||{})[b]||{}, st=brokerTariffState(b);
    return `<tr><td>${esc(b)}</td>
      <td class="num">${f.advisory!=null?pct(f.advisory,2):"—"}</td>
      <td class="num">${f.custody!=null?pct(f.custody,2):"—"}</td>
      <td class="${st==="full"?"good":"warn"}">${st==="full"?L("учтён","counted"):st==="partial"?L("заполнено наполовину","half-filled"):L("не заведён","not entered")}</td></tr>`;
  }).join("");

  /* ---------- 4. ноты ---------- */
  const noteRows=a.notes.map(n=>{
    const miss=noteMissing(n);
    if(miss.length) return `<tr><td>${esc(n.name)}</td><td class="muted">${esc(n.broker)}</td>
      <td class="num">${money(n.baseValue)}</td><td colspan="5" class="warn">${L("не оценена — нет: ","not valued — missing: ")}${noteMissingLabel(miss)}</td></tr>`;
    const e=n.eng, f=e.fair_coupon||{}, br=barrierRisk(n);
    const short=f.shortfall_pp>0.05;
    return `<tr><td>${esc(n.name)}</td><td class="muted">${esc(n.broker)}</td>
      <td class="num">${money(n.baseValue)}</td>
      <td class="num">${pct(f.offered_coupon_pct||n.coupon||0,2)}</td>
      <td class="num">${f.fair_coupon_pct!=null?pct(f.fair_coupon_pct,2):"—"}</td>
      <td class="num ${short?"bad":"good"}">${f.shortfall_pp!=null?(f.shortfall_pp>0?"+":"")+f.shortfall_pp.toFixed(2):"—"}</td>
      <td class="num">${pct(e.bank_margin.total_pct,2)}</td>
      <td class="num">${br.prob!=null?pct(br.prob,1):"—"}</td></tr>`;
  }).join("");
  // Совокупно — сумма ПРИВЕДЁННЫХ величин (они же зашитые маржи), а не
  // недоборов, умноженных на срок: последнее завышает разрыв в разы.
  const shortfallMoney=a.notes.reduce((s,n)=>{
    const f=(n.eng||{}).fair_coupon||{};
    const m=(n.eng||{}).bank_margin||{};
    return s + (f.shortfall_pp>0 && m.total_pct>0 ? n.baseValue*m.total_pct/100 : 0);
  },0);

  /* ---------- 5. облигации и деривативы ---------- */
  const bondRows=a.bonds.map(b=>`<tr><td>${esc(b.name)}</td><td class="muted">${esc(b.broker)}</td>
    <td class="num">${money(b.baseValue)}</td><td class="num">${b.coupon?pct(b.coupon,2):"—"}</td>
    <td class="num">${fmtDate(b.maturity)}</td>
    <td class="num">${b._dur!=null?b._dur.toFixed(1):`<span class="warn">—</span>`}</td>
    <td class="num ${b._dur!=null?"bad":"muted"}">${b._dur!=null?"−"+b._dur.toFixed(1)+"%":"—"}</td></tr>`).join("");
  const derivRows=a.derivs.map(d=>`<tr><td>${esc(d.name)}</td><td class="muted">${esc(d.broker)}</td>
    <td class="num">${money(d.baseValue)}</td>
    <td class="num">${d.notional?money(d.notional*(FX[d.ccy]||1)/(FX[B]||1)):"—"}</td>
    <td class="num">${fmtDate(d.expiry||d.maturity)}</td></tr>`).join("");

  /* ---------- 6. полный список ---------- */
  const allRows=a.sorted.map(r=>`<tr>
    <td>${esc(r.name)}</td>
    <td class="muted">${esc(r.broker)}</td>
    <td class="muted">${t(CLASSES[r.cls]?CLASSES[r.cls].k:r.cls)}</td>
    <td class="num">${esc(r.ccy)}</td>
    <td class="num">${r.fxOk?money(r.baseValue):`<span class="warn">${(r.value||0).toLocaleString(ru?"ru-RU":"en-US",{maximumFractionDigits:0})} ${esc(r.ccy)}</span>`}</td>
    <td class="num">${r.fxOk?pct(r.weight):"—"}</td>
    <td class="num">${r.feePct?pct(r.feePct,2):"—"}</td></tr>`).join("");

  /* ---------- 7. резолюции ---------- */
  const R=resolutions(a);
  const lvName={high:L("высокий","high"),medium:L("средний","medium"),low:L("к сведению","info")};
  const resList=R.map(r=>`<li class="${r.level}"><b>${esc(r.title)}</b><span class="lv">${lvName[r.level]}</span><br/>${esc(r.body)}
    ${r.impact?`<span class="imp">${t("impact")}: ${esc(r.impact)}</span>`:""}</li>`).join("");

  const sources=(STATE.sources&&STATE.sources.length)?STATE.sources.map(esc).join(", "):esc(STATE.source||"—");

  return `<div class="rep">
    <div class="rep-h">
      <div>
        <div class="rep-title">${L("Отчёт о состоянии портфеля","Portfolio Health Report")}</div>
        <div class="rep-sub">${esc(STATE.client||L("Портфель клиента","Client portfolio"))} · ${today}
          · ${L("базовая валюта","base currency")} ${B}<br/>
          ${L("Источник данных","Data source")}: ${sources} · ${L("курсы","FX")} ${esc((DATA.fx||{}).asOf||"—")} (${esc((DATA.fx||{}).source||"—")})</div>
      </div>
      <div class="rep-score" style="color:${ratingColor(a.score)}">${a.score}<span>/100 · ${ratingLabel(a.score)}</span></div>
    </div>

    <div class="rep-sec">
      <div class="rep-kpi">
        <div><span>${L("Активы","Assets")}</span><b>${money(a.aum)}</b></div>
        <div><span>${L("Позиций","Positions")}</span><b>${a.rows.length}</b></div>
        <div><span>${L("Брокеров","Brokers")}</span><b>${Object.keys(a.byBroker).length}</b></div>
        <div><span>${L("Комиссия/год","Fee p.a.")}</span><b>${pct(a.blendedFee,2)}${a.feeComplete?"":"*"}</b></div>
        <div><span>Fee-drag</span><b>${money(a.dragAbs)}</b></div>
        <div><span>${L("Дюрация","Duration")}</span><b>${a.portDuration!=null?a.portDuration.toFixed(1):L("н/д","n/a")}</b></div>
      </div>
      <h4>${L("Составляющие оценки","Score components")}</h4>
      ${subRows}
      ${caveatBox}
    </div>

    <div class="rep-sec rep-break">
      <h3>${L("Структура портфеля","Portfolio structure")}</h3>
      <div class="rep-cols">
        <div>
          <h4>${L("По классам активов","By asset class")}</h4>
          <div style="text-align:center;margin:4px 0 8px">${donut(Object.entries(a.byClass).map(([k,v])=>({label:k,value:v,color:CLASSES[k]?CLASSES[k].c:"#888"})).sort((x,y)=>y.value-x.value),132)}</div>
          <table>${cls}</table>
        </div>
        <div>
          <h4>${L("По брокерам","By broker")}</h4><table>${brk}</table>
          <h4>${L("Валютная экспозиция","Currency exposure")}</h4><table>${ccy}</table>
        </div>
      </div>
    </div>

    <div class="rep-sec">
      <h4>${L("Крупнейшие позиции","Largest positions")} <span class="muted">— top-1 ${pct(a.top1)} · top-5 ${pct(a.top5)} · HHI ${Math.round(a.hhi)}${a.techShare!=null?` · ${L("технологии","technology")} ${pct(a.techShare)}`:""}</span></h4>
      <table><thead><tr><th></th><th>${t("instrument")}</th><th>${t("broker")}</th>
        <th class="num">${L("Стоимость","Value")}</th><th class="num">${L("Доля","Weight")}</th></tr></thead>
        <tbody>${top10}</tbody></table>
    </div>

    <div class="rep-sec rep-break">
      <h3>${L("Издержки","Costs")}</h3>
      <div class="rep-cols">
        <div>
          <h4>${L("Компоненты, в год","Components, p.a.")}</h4>
          <table><thead><tr><th>${L("Статья","Item")}</th><th class="num">${B}</th><th class="num">%</th></tr></thead>
            <tbody>${feeRows||`<tr><td colspan="3" class="muted">${L("нет подтверждённых издержек","no confirmed costs")}</td></tr>`}
              <tr><td><b>${L("Итого","Total")}</b></td><td class="num"><b>${money(a.feeAbs)}</b></td>
                <td class="num"><b>${pct(a.blendedFee,2)}</b></td></tr></tbody></table>
          <p class="rep-note" style="margin-top:8px">${L(
            `Бенчмарк — индексный портфель ${pct(BENCH,2)}/год. Разница (fee-drag) ${money(a.dragAbs)} в год. За 10 лет: ${money(a.proj10)} против ${money(a.aum*BENCH/100*10)} — из них регулярных ${money(a.recurringAbs*10)}${a.noteOneOff?` и разовой маржи нот ${money(a.noteOneOff)}, уплаченной один раз при покупке, а не ежегодно`:""}.`,
            `Benchmark — an indexed portfolio at ${pct(BENCH,2)} p.a. The fee drag is ${money(a.dragAbs)} per year. Over ten years: ${money(a.proj10)} versus ${money(a.aum*BENCH/100*10)} — of which ${money(a.recurringAbs*10)} recurring${a.noteOneOff?` and ${money(a.noteOneOff)} of one-off note margin, paid once at purchase rather than annually`:""}.`)}</p>
        </div>
        <div>
          <h4>${L("Тарифы брокеров","Broker tariffs")}</h4>
          <table><thead><tr><th>${t("broker")}</th><th class="num">${t("advisory")}</th>
            <th class="num">${t("custody")}</th><th>${L("Статус","Status")}</th></tr></thead>
            <tbody>${tariffRows}</tbody></table>
        </div>
      </div>
    </div>

    ${a.notes.length?`<div class="rep-sec rep-break">
      <h3>${L("Структурные ноты","Structured notes")}</h3>
      <table><thead><tr><th>${t("instrument")}</th><th>${t("broker")}</th><th class="num">${L("Стоимость","Value")}</th>
        <th class="num">${L("Купон","Coupon")}</th><th class="num">${L("Справедливый","Fair")}</th>
        <th class="num">${L("Δ п.п.","Δ pp")}</th><th class="num">${L("Маржа","Margin")}</th>
        <th class="num">${L("Пробой","Breach")}</th></tr></thead><tbody>${noteRows}</tbody></table>
      <p class="rep-note">${L(
        `<b>Как читать.</b> «Справедливый» — купон, при котором нота стоила бы номинал на дату выпуска при указанных допущениях волатильности и ставки. «Δ» — насколько предложенный купон ниже (со знаком «+») справедливого. «Маржа» — доля номинала, зашитая эмитентом при выпуске: структурирование, хеджирование, кредитный риск, дистрибуция. «Пробой» — вероятность пробоя барьера за весь срок, посчитанная от даты выпуска; это не остаточный риск на сегодня.${shortfallMoney>0?` <b>Совокупно зашито ≈ ${money(shortfallMoney)} приведённой стоимости.</b>`:""} Оценка не является утверждением о нарушении.`,
        `<b>How to read.</b> "Fair" is the coupon at which the note would be worth par at issue under the stated volatility and rate assumptions. "Δ" is how far the offered coupon falls short. "Margin" is the share of nominal embedded by the issuer at launch: structuring, hedging, credit risk, distribution. "Breach" is the probability of breaching the barrier over the full term, measured from issue — not the remaining risk today.${shortfallMoney>0?` <b>Aggregate embedded ≈ ${money(shortfallMoney)} in present value.</b>`:""} This is not an assertion of misconduct.`)}</p>
    </div>`:""}

    ${(a.bonds.length||a.derivs.length)?`<div class="rep-sec">
      ${a.bonds.length?`<h4>${L("Облигации","Bonds")}${a.portDuration!=null?` <span class="muted">— ${L("дюрация","duration")} ${a.portDuration.toFixed(2)} ${L("по","covering")} ${pct(a.durCoverage*100,0)} ${L("номинала","of nominal")}</span>`:""}</h4>
        <table><thead><tr><th>${t("instrument")}</th><th>${t("broker")}</th><th class="num">${L("Стоимость","Value")}</th>
          <th class="num">${L("Купон","Coupon")}</th><th class="num">${L("Погашение","Maturity")}</th>
          <th class="num">${L("Дюрация","Duration")}</th><th class="num">${L("+1% ставок","+1% rates")}</th></tr></thead>
          <tbody>${bondRows}</tbody></table>`:""}
      ${a.derivs.length?`<h4>${L("Деривативы","Derivatives")} <span class="muted">— ${L("условный номинал","notional")} ${money(a.notionalAbs)} = ${a.leverage.toFixed(2)}× ${L("капитала","of equity")}</span></h4>
        <table><thead><tr><th>${t("instrument")}</th><th>${t("broker")}</th><th class="num">${L("Стоимость","Value")}</th>
          <th class="num">${L("Номинал","Notional")}</th><th class="num">${L("Экспирация","Expiry")}</th></tr></thead>
          <tbody>${derivRows}</tbody></table>`:""}
    </div>`:""}

    <div class="rep-sec rep-break">
      <h3>${L("Резолюции и рекомендации","Resolutions & recommendations")} <span class="muted">${R.length}</span></h3>
      <ol class="rep-res">${resList||`<li class="low">${L("Существенных замечаний нет.","No material issues.")}</li>`}</ol>
    </div>

    <div class="rep-sec rep-break">
      <h3>${L("Полный список позиций","Full holdings")} <span class="muted">${a.rows.length}</span></h3>
      <table><thead><tr><th>${t("instrument")}</th><th>${t("broker")}</th><th>${t("fClass")}</th>
        <th class="num">${L("Вал.","Ccy")}</th><th class="num">${L("Стоимость","Value")} (${B})</th>
        <th class="num">${L("Доля","Weight")}</th><th class="num">${L("Комис./год","Fee p.a.")}</th></tr></thead>
        <tbody>${allRows}</tbody></table>
      <p class="rep-note">${L(
        "Стоимости приведены в базовой валюте по курсам на дату отчёта. Комиссия по позиции — сумма подтверждённых составляющих: тариф брокера (если заведён), TER продукта и зашитая маржа ноты по оценке движка.",
        "Values are stated in the base currency at the report-date rates. The per-position fee is the sum of confirmed components: broker tariff (where entered), product TER and the engine-priced embedded note margin.")}</p>
    </div>

    <div class="rep-foot">
      <span>WealthLens · ${L("сформировано","generated")} ${today}</span>
      <span>${L("Оценка носит информационный характер и не является инвестиционной рекомендацией.","For information only; not investment advice.")}</span>
    </div>
  </div>`;
}

function openReport(){ if(!STATE.positions) return; const ra=$("#reportArea"); if(ra) ra.innerHTML=buildReport(analyze(STATE.positions)); window.print(); }
/* ---------- сохранение файла ------------------------------------------
   На обычном хосте файл отдаёт ссылка с download. В просмотрщике артефакта
   страница отдавать файлы напрямую не может: там сохранение идёт штатным
   механизмом с подтверждением от пользователя. Поддерживаем оба пути —
   иначе на одном из хостов кнопка молча не делает ничего.               */
const HOSTED_FRAME = typeof window.claude==="object" && window.claude!==null
                  && typeof window.claude.use==="function";
let _dlCap;        // undefined — ещё не спрашивали; null — недоступно
async function downloadsCap(){
  if(!HOSTED_FRAME) return null;
  if(_dlCap===undefined){ try{ _dlCap=await window.claude.use("downloads"); }catch(e){ _dlCap=null; } }
  return _dlCap;
}
function toast(msg, bad){
  const el=document.createElement("div");
  el.className="toast"+(bad?" bad":"");
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; setTimeout(()=>el.remove(),400); }, bad?5200:2800);
}
async function saveFile(filename, text, mime){
  const ru=STATE.lang==="ru";
  const cap=await downloadsCap();
  if(cap){
    const attempt=name=>cap.save({filename:name, data:text});
    try{ await attempt(filename); return true; }
    catch(e){
      const c=e&&e.code;
      if(c==="declined") return false;                       // отказ — не ошибка
      // csv входит в расширенный набор расширений и может быть не разрешён.
      // Тот же текст уходит как .txt: Excel и Numbers открывают его так же.
      if(c==="extension_not_enabled" && /\.csv$/i.test(filename)){
        try{ await attempt(filename.replace(/\.csv$/i,".txt")); return true; }
        catch(e2){ if(e2&&e2.code==="declined") return false; }
      }
      if(c==="rate_limited"){
        toast(ru?"Уже открыт запрос на сохранение — подтвердите его.":"A save prompt is already open — confirm it.");
        return false;
      }
      toast((ru?"Не удалось сохранить файл: ":"Could not save the file: ")+((e&&e.message)||c||"?"), true);
      return false;
    }
  }
  if(HOSTED_FRAME){
    toast(ru?"Сохранение файлов в этом окне недоступно.":"Saving files is unavailable in this view.", true);
    return false;
  }
  const url=URL.createObjectURL(new Blob([text],{type:mime||"text/plain;charset=utf-8"}));
  const a=document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  return true;
}

async function exportCSV(){
  if(!STATE.positions) return;
  const cols=["broker","name","asset_class","currency","value","quantity","ticker","isin","fee_product","coupon","barrier","maturity","underlying","notional"];
  const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;

  STATE.positions.forEach(p=>{ lines.push([p.broker,p.name,p.cls,p.ccy,p.value,p.qty||"",p.ticker||"",p.isin||"",p.feeProduct||0,p.coupon||"",p.barrier||"",p.maturity||"",p.underlying||"",p.notional||""].map(q).join(",")); });

/* ---------- Structured & derivatives ---------- */
/* Что удаётся вычитать из НАЗВАНИЯ ноты. Брокеры часто кодируют параметры
   прямо в наименовании инструмента: «Autocall Note S&P 500 8% 2028». Это
   подсказки, а не значения: подставляются только по явному действию советника,
   иначе получилась бы ровно та выдумка, от которой мы весь день уходим. */
const UNDERLYING_HINTS = [
  [/s&?\s?p\s?500|spx\b/i,"S&P 500"], [/euro\s?stoxx\s?50|sx5e\b/i,"EuroStoxx 50"],
  [/nasdaq|ndx\b/i,"Nasdaq 100"], [/\bdax\b/i,"DAX"], [/ftse\s?100/i,"FTSE 100"],
  [/nikkei|nky\b/i,"Nikkei 225"], [/smi\b/i,"SMI"], [/hang\s?seng|hsi\b/i,"Hang Seng"],
  [/msci\s+world/i,"MSCI World"], [/russell\s?2000/i,"Russell 2000"], [/\bcac\s?40/i,"CAC 40"]
];
function guessNoteParams(n){
  const nm=String(n.name||"");
  const g={};
  for(const [re,name] of UNDERLYING_HINTS) if(re.test(nm)){ g.underlying=name; break; }
  const pcts=[...nm.matchAll(/(\d{1,2}(?:[.,]\d{1,2})?)\s*%/g)].map(m=>parseNum(m[1]));
  if(pcts.length) g.coupon=pcts[0];                       // первый процент — обычно купон
  if(pcts.length>1) g.barrier=pcts.find(v=>v>=40 && v<=100);
  const ymd=nm.match(/\b(20\d\d)[-.\/](\d{1,2})[-.\/](\d{1,2})\b/);
  const year=nm.match(/\b(20[2-9]\d)\b/);
  if(ymd) g.maturity=`${ymd[1]}-${String(ymd[2]).padStart(2,"0")}-${String(ymd[3]).padStart(2,"0")}`;
  else if(year) g.maturity=`${year[1]}-12-31`;
  return g;
}

/* Рабочее место для нот: все, что движок не может оценить, — одним списком с
   полями. Пока эти поля пусты, главные числа продукта (справедливый купон,
   маржа эмитента, вероятность пробоя) не появляются вовсе. */

  const rows=pend.map(n=>{
    const g=guessNoteParams(n), miss=noteMissing(n);
    const hasGuess=Object.keys(g).some(k=>g[k]!=null && (n[k]==null||n[k]===""));
    return `<tr>
      <td style="min-width:150px"><b style="font-size:12.5px">${esc(n.name)}</b>
        <div class="muted" style="font-size:11px">${esc(n.broker)} · ${fmtFull(n.baseValue)}</div>
        <div style="color:var(--watch);font-size:11px;margin-top:2px">${ru?"нет: ":"missing: "}${noteMissingLabel(miss)}</div></td>
      <td style="width:120px">${fld(n,"underlying",g.underlying||"S&P 500")}</td>
      <td style="width:72px">${fld(n,"coupon",g.coupon!=null?String(g.coupon):"8.0",'type="number" step="0.1" min="0" max="100"')}</td>
      <td style="width:72px">${fld(n,"barrier",g.barrier!=null?String(g.barrier):"65",'type="number" step="1" min="1" max="100"')}</td>
      <td style="width:80px">${fld(n,"capProt","0",'type="number" step="1" min="0" max="100"')}</td>
      <td style="width:132px">${fld(n,"maturity",g.maturity||"",'type="date"')}</td>
      <td style="width:74px">${fld(n,"tenorYears","",'type="number" step="0.5" min="0.25" max="30"')}</td>
      <td style="width:96px">${hasGuess?`<button class="btn ghost" data-nbguess="${n._id}" style="padding:4px 8px;font-size:11px">${ru?"из названия":"from name"}</button>`:""}</td>
    </tr>`;
  }).join("");
  return `<div class="panel" style="border-color:var(--watch)">
    <h3>${ru?"Ноты ждут параметров":"Notes awaiting parameters"} <span class="hint">${pend.length}</span></h3>
    <div class="footnote" style="margin-bottom:10px">${ru
      ? `На ${fmtFull(val)} движок не может посчитать ни справедливый купон, ни маржу эмитента, ни вероятность пробоя барьера — в выписке нет нужных полей. Заполните их здесь: расчёт запустится сам, как только по ноте появятся все четыре. Кнопка «из названия» подставляет то, что удалось вычитать из наименования бумаги — <b>проверьте по проспекту</b>, инструмент не выдумывает эти числа за вас.`
      : `For ${fmtFull(val)} the engine cannot compute the fair coupon, the issuer margin or the barrier probability — the statement lacks the fields. Enter them here and pricing starts as soon as a note has all four. "From name" fills in what could be read from the instrument name — <b>verify against the term sheet</b>; the tool does not invent these numbers for you.`}</div>
    ${noEngine?`<div class="footnote" style="color:var(--risk);margin-bottom:10px">${ru
      ? `<b>Движок сейчас недоступен</b> (${esc(STATE.engineDown||"бэкенд не настроен")}). Даже заполненные параметры не дадут оценки: нужен локальный сервер с расчётным ядром — <code>http://127.0.0.1:8787/</code>.`
      : `<b>The engine is unavailable</b> (${esc(STATE.engineDown||"no backend configured")}). Filling the fields will not produce a valuation: the local server with the pricing core is required.`}</div>`:""}
    <div style="overflow-x:auto"><table><thead><tr>
      <th>${ru?"Нота":"Note"}</th><th>${ru?"Базовый актив":"Underlying"}</th>
      <th>${ru?"Купон %":"Coupon %"}</th><th>${ru?"Барьер %":"Barrier %"}</th>
      <th>${ru?"Защита %":"Protection %"}</th><th>${ru?"Погашение":"Maturity"}</th>
      <th>${ru?"Срок, лет":"Tenor, y"}</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </div>`;
}

  let html=notesWorkbench(a);
  // notes
  html+=`<div class="panel"><h3>${t("structTitle")} <span class="hint">${a.notes.length}</span></h3>`;
  if(!a.notes.length) html+=`<div class="empty">${t("noNotes")}</div>`;
  else html+=`<div class="row" style="grid-template-columns:1fr 1fr">${a.notes.map(n=>noteCard(n)).join("")}</div>`;
  html+=`</div>`;
  // derivatives
  html+=`<div class="panel"><h3>${t("derivTitle")} <span class="hint">${a.derivs.length}</span></h3>`;
  if(!a.derivs.length) html+=`<div class="empty">${t("noDeriv")}</div>`;
  else html+=`<div class="kbar" style="margin-bottom:12px">
      <span>${t("notional")}: <b style="color:var(--ink)">${fmtFull(a.notionalAbs)}</b></span>

  html+=`<div class="panel"><h3>${ru?"Облигации":"Bonds"} <span class="hint">${a.bonds.length}${a.bonds.length?` · ${ru?"дюрация":"duration"} ${a.portDuration!=null?`≈ ${a.portDuration.toFixed(1)}${a.durCoverage<0.999?` (${ru?"по":"of"} ${pct(a.durCoverage*100,0)} ${ru?"номинала":"nominal"})`:""}`:(ru?"н/д":"n/a")}`:""}</span></h3>`;
  if(!a.bonds.length) html+=`<div class="empty">${ru?"Облигаций не обнаружено.":"No bonds found."}</div>`;
  else html+=`<table><thead><tr><th>${t("instrument")}</th><th>${t("broker")}</th><th class="num">${t("coupon")}</th><th class="num">${t("maturity")}</th><th class="num">${ru?"Дюрация":"Duration"}</th><th class="num">+1% ${ru?"ставок":"rates"}</th></tr></thead><tbody>${a.bonds.map(b=>`<tr><td>${esc(b.name)}</td><td class="muted">${esc(b.broker)}</td><td class="num">${b.coupon?pct(b.coupon,1):"—"}</td><td class="num">${fmtDate(b.maturity)}</td><td class="num">${b._dur!=null?b._dur.toFixed(1):`<span class="muted" title="${ru?"не хватает: ":"missing: "}${(b._durMissing||[]).join(", ")}">—</span>`}</td><td class="num" style="color:${b._dur!=null?"var(--risk)":"var(--muted)"}">${b._dur!=null?`−${b._dur.toFixed(1)}%`:"—"}</td></tr>`).join("")}</tbody></table>
    <div class="footnote">${ru?"Дюрация и чувствительность — приблизительная оценка по купону и сроку (точную даёт Bloomberg).":"Duration and sensitivity are rough estimates from coupon and maturity (Bloomberg gives exact figures)."}</div>`;
  html+=`</div>`;
  return html;
}
function noteCard(n){
  const dt=parseDate(n.maturity); const dl=dt?daysBetween(TODAY,dt):null;
  const emb=((n.entry||0)+(n.tenorYears||3)*(n.product||0)).toFixed(1);
  const br=barrierRisk(n), bd=br.dist;
  // Цвет — по худшему из двух сигналов (сегодняшнее расстояние и вероятность
  // от выпуска); серый только когда не известно ни одного.
  const blvl = barrierLevel(br);
  const bcol = blvl==="high" ? "var(--risk)" : blvl==="medium" ? "var(--watch)"
             : (br.prob!=null || bd!=null) ? "var(--good)" : "var(--muted)";
  return `<div style="border:1px solid var(--line);border-radius:11px;padding:15px;background:var(--navy)">
    <div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(n.name)}</b><span class="muted">${esc(n.broker)}</span></div>
    <div style="margin:6px 0 10px;font-size:13px">${fmtFull(n.baseValue)} · ${pct(n.weight)} ${t("weightLbl")}</div>
    <div class="note-meta">
      ${t("underlying")}: <b>${esc(n.underlying||"—")}</b><br/>
      ${t("coupon")}: <b>${n.coupon?pct(n.coupon,1):"—"}</b> · ${t("capProt")}: <b>${n.capProt?pct(n.capProt,0):(n.barrier?"0%":"—")}</b><br/>
      ${t("barrier")}: <b>${n.barrier?n.barrier+"%":"—"}</b> · ${t("barrierDist")}: <b style="color:${bcol}">${bd!=null?pct(bd,0):"—"}</b>${
        br.prob!=null?`<br/><span class="muted">${STATE.lang==="ru"?"вероятность пробоя от выпуска за весь срок":"breach probability from issue, full term"}: <b style="color:${bcol}">${pct(br.prob,1)}</b></span>`:""}<br/>
      ${t("maturity")}: <b>${fmtDate(n.maturity)}</b>${dl!=null?` <span class="muted">(${dl} ${t("daysLeft")})</span>`:""}<br/>
      ${n.embSrc==="engine"
        ? `${t("embedded")}: <b style="color:var(--watch)">${pct(n.eng.bank_margin.total_pct,2)}</b> <span class="muted">${basisLabel(n)}, ${STATE.lang==="ru"?"по движку":"per engine"}</span>`
        : (n.entry||n.product)
          ? `${t("embedded")}: <b style="color:var(--watch)">≈ ${emb}%</b> <span class="muted">(${pct(n.entry||0,1)} + ${pct(n.product||0,1)}/${STATE.lang==="ru"?"г":"y"}×${n.tenorYears||3})</span>`
          : `${t("embedded")}: <b class="muted">—</b>`}
    </div>
    ${(!n.coupon && !n.barrier) ? "" : `<div style="margin-top:9px;border-top:1px solid var(--line);padding-top:8px">
      <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px">${STATE.lang==="ru"?"Сценарии на погашении":"Payoff at maturity"}</div>
      <div class="note-meta" style="font-size:12px">
        <span style="color:var(--good)">▲</span> ${STATE.lang==="ru"?`Базовый ≥ старта — купон ${pct(n.coupon||0,1)}, капитал 100%.`:`Underlying ≥ start — coupon ${pct(n.coupon||0,1)}, capital 100%.`}<br/>
        <span style="color:var(--watch)">◆</span> ${STATE.lang==="ru"?"Между барьером и стартом — купон, капитал 100%.":"Between barrier and start — coupon, capital 100%."}<br/>
        <span style="color:var(--risk)">▼</span> ${STATE.lang==="ru"?(n.capProt?`Ниже барьера — защита капитала ${pct(n.capProt,0)}.`:"Ниже барьера — защиты нет, убыток повторяет падение базового актива."):(n.capProt?`Below barrier — ${pct(n.capProt,0)} capital protection.`:"Below barrier — no protection, loss tracks the underlying.")}
      </div>
    </div>`}
    ${enginePanel(n)}
  </div>`;
}
function derivCard(d){
  const dt=parseDate(d.expiry); const dl=dt?daysBetween(TODAY,dt):null;
  return `<div style="border:1px solid var(--line);border-radius:11px;padding:15px;background:var(--navy);margin-bottom:11px">
    <div style="display:flex;justify-content:space-between"><b>${esc(d.name)}</b><span class="muted">${esc(d.broker)}</span></div>
    <div class="kbar" style="margin-top:9px">

      <span>${t("notional")}: <b style="color:var(--ink)">${d.notional?fmtFull(d.notional*(FX[d.ccy]||1)/(FX[STATE.base]||1)):"—"}</b></span>

/* ---------- Fees ---------- */
/* Договорная сетка вводится советником. Пустое поле — это «не знаем», и оно
   не превращается в число: подсказка серым показывает отраслевой диапазон,
   а не значение, попадающее в расчёт. */
function tariffPanel(a){
  const ru=STATE.lang==="ru";
  if(!a.brokersAll.length) return "";
  const rows=a.brokersAll.map(b=>{
    const f=(STATE.brokerFees||{})[b]||{};
    const val=a.rows.filter(r=>r.broker===b).reduce((s,r)=>s+r.baseValue,0);
    const st=brokerTariffState(b);
    const known=st==="full";
    const fld=(k,lbl)=>`<label style="display:flex;flex-direction:column;gap:3px;font-size:11px" class="muted">${lbl}, %
      <input data-tariff="${k}" data-broker="${esc(b)}" type="number" step="0.05" min="0" max="5"
        placeholder="${TARIFF_HINT[k]}" value="${f[k]??""}"
        style="width:88px;padding:5px 7px;font-size:12.5px"/></label>`;
    return `<div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;
        padding:11px 0;border-top:1px solid var(--line)">
      <div style="flex:1 1 150px;min-width:0">
        <b style="font-size:13px">${esc(b)}</b>
        <div class="muted" style="font-size:11.5px">${fmtMoney(val)}</div>
      </div>
      ${fld("advisory",t("advisory"))}

        ${known?(ru?"учтён":"counted"):st==="partial"?(ru?"заполнено наполовину — не учитывается":"half-filled — not counted"):(ru?"не заведён":"not entered")}</span>
    </div>`;
  }).join("");
  return `<div class="panel"><h3>${ru?"Тарифы брокеров":"Broker tariffs"}</h3>
    <div class="footnote" style="margin-bottom:4px">${ru
      ? "Мы не подставляем чужую тарифную сетку за вас: договорные условия знает только советник. Заполните один раз — сохранится в профиле клиента. Серым показан отраслевой диапазон, он в расчёт не идёт."
      : "We do not guess your negotiated grid: only the advisor knows it. Enter it once — it is stored with the client profile. Grey shows an industry range and never enters the calculation."}</div>
    ${rows}
  </div>`;
}

function vFees(a){
  const comp=a.feeComponents;
  const compRows=[["advisory",comp.advisory],["custody",comp.custody],["product",comp.product],["entryAmort",comp.entryAmort]];
  const compMax=Math.max(...compRows.map(c=>c[1]))||1;
  const exp=[...a.rows].filter(r=>r.feeAbs>0).sort((x,y)=>y.feeAbs-x.feeAbs).slice(0,8);
  const expMax=exp[0]?exp[0].feeAbs:1;
  const proj10=a.proj10, projBench=a.aum*BENCH/100*10;

  const ruL=STATE.lang==="ru";
  return `${a.feeComplete?"":`<div class="panel" style="border-color:var(--watch);background:var(--navy);padding:12px 16px">
      <b style="font-size:13.5px">${ruL?"Показано только подтверждённое":"Confirmed data only"}</b>
      <div class="muted" style="font-size:12.5px;line-height:1.55;margin-top:3px">${ruL
        ? `${pct(a.blendedFee,2)}/год посчитано по TER из файла и марже нот из движка. Консультационная и кастоди по ${a.brokersMissing.length} брокер${a.brokersMissing.length===1?"у":"ам"} (${a.brokersMissing.map(esc).join(", ")}, ${fmtMoney(a.missingVal)} активов) не заведены и в цифру не входят — реальные издержки выше.`
        : `${pct(a.blendedFee,2)} p.a. is computed from file TERs and engine-priced note margins. Advisory and custody for ${a.brokersMissing.length} broker(s) (${a.brokersMissing.map(esc).join(", ")}, ${fmtMoney(a.missingVal)} of assets) are not entered and are excluded — the true cost is higher.`}</div>
    </div>`}
    <div class="cards">
      ${card(t("kFee"),pct(a.blendedFee,2),a.feeComplete?t("perYear"):(ruL?"в год · подтверждённое":"p.a. · confirmed only"))}
      ${card(STATE.lang==="ru"?"Издержки в год":"Annual cost",fmtMoney(a.feeAbs),STATE.base)}
      ${card(t("kDrag"),fmtMoney(a.dragAbs),`vs ${pct(BENCH,2)} bench`)}

        <div><div class="li"><span class="lbl">${t(k)}</span><span>${fmtMoney(v)} · <b>${pct(a.aum?v/a.aum*100:0,2)}</b></span></div>

        <div class="footnote">${STATE.lang==="ru"?"Бенчмарк — индексный портфель ~0.20%/год. Разница = fee-drag.":"Benchmark — indexed portfolio ~0.20% p.a. The gap = fee drag."}</div>
      </div>
      <div class="panel"><h3>${t("feeVsBench")}</h3>
        ${barCompare(t("yourPort"),a.blendedFee, t("benchPort"),BENCH, Math.max(a.blendedFee,BENCH))}
        <div class="panel" style="margin-top:14px;background:var(--navy)"><h3 style="margin-bottom:8px">${t("proj")}</h3>
          ${barCompare(t("yourPort"),proj10, t("benchPort"),projBench, Math.max(proj10,projBench),true)}
          <div class="footnote">${t("projNote")}</div>

    </div>
    <div class="panel"><h3>${t("mostExp")}</h3>
      <table><thead><tr><th>${t("instrument")}</th><th>${t("broker")}</th><th class="num">${t("feeY")}</th><th class="num">${STATE.base}/${t("perYear")}</th><th></th></tr></thead>
      <tbody>${exp.map(r=>`<tr><td>${esc(r.name)}</td><td class="muted">${esc(r.broker)}</td>

        <td style="width:30%"><div class="bar"><i style="width:${r.feeAbs/expMax*100}%;background:var(--note)"></i></div></td></tr>`).join("")}</tbody></table>

function barCompare(l1,v1,l2,v2,max,money){
  const f=money?fmtMoney:(x)=>pct(x,2);
  return `<div><div class="li"><span class="lbl">${l1}</span><b>${f(v1)}</b></div>

let PID=0;
function tagPositions(arr, src){ arr.forEach(p=>{ if(p._id==null) p._id=++PID; p._src=src; }); }
function recalcSource(){
  if(!STATE.positions || !STATE.positions.length){ STATE.sources=[]; STATE.source=""; return; }
  const seen=[]; STATE.positions.forEach(p=>{ const s=p._src||"—"; if(!seen.includes(s)) seen.push(s); });
  STATE.sources=seen;
  STATE.source = seen.length<=1 ? (seen[0]||"") : (STATE.lang==="ru"? seen.length+" выписок" : seen.length+" statements");
}
function setPrices0(){ DATA.prices={status:"embedded", source:"embedded", updated:0, total:(STATE.positions||[]).filter(p=>p.ticker&&p.qty>0).length}; }

function loadPositions(arr, source){   // REPLACE the whole portfolio (demo / single source)
  if(!arr || !arr.length){ const le=$("#landErr"); if(le){le.textContent=t("needRows");le.className="err";} return; }
  arr=arr.slice(); tagPositions(arr, source);
  STATE.positions=arr; STATE.editId=null; STATE.baseline=null;
  STATE.loadedFp={[statementFingerprint(arr)]:source}; STATE.duplicateWarning=null;
  recalcSource(); STATE.view="overview";
  setPrices0(); render();
}
/* Отпечаток выписки: брокер + бумага + сумма по каждой строке. Повторная
   загрузка того же файла раньше молча удваивала портфель — на экране просто
   становилось вдвое больше активов, и заметить это было нечем. */
function statementFingerprint(arr){
  return arr.map(p=>`${p.broker}|${p.name}|${Math.round(+p.value||0)}|${p.ccy}`).sort().join("~");
}
function addPositions(arr, source){    // APPEND a statement to the consolidated portfolio (multi-broker)
  if(!arr || !arr.length) return 0;
  const fp=statementFingerprint(arr);
  const dup=(STATE.loadedFp||{})[fp];
  if(dup){
    STATE.duplicateWarning={source, prev:dup, count:arr.length};
    return 0;                       // не добавляем: удвоение хуже, чем отказ
  }
  STATE.loadedFp=Object.assign({}, STATE.loadedFp, {[fp]:source});
  arr=arr.slice(); tagPositions(arr, source);
  if(!STATE.positions) STATE.positions=[];
  STATE.positions=STATE.positions.concat(arr);
  recalcSource(); STATE.view="overview";
  setPrices0(); render();
  return arr.length;
}
function removeSource(src){            // remove a single loaded statement
  if(!STATE.positions) return;
  STATE.positions=STATE.positions.filter(p=>(p._src||"—")!==src);
  if(!STATE.positions.length) clearClientState();
  else recalcSource();
  render();
}
