<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E %3Cdefs%3E %3ClinearGradient id=%22fl%22 x1=%2224%22 y1=%2217%22 x2=%2240%22 y2=%2247%22 gradientUnits=%22userSpaceOnUse%22%3E%3Cstop offset=%220%22 stop-color=%22%23FFF3D1%22/%3E%3Cstop offset=%22.48%22 stop-color=%22%23F3BD58%22/%3E%3Cstop offset=%221%22 stop-color=%22%23B27A26%22/%3E%3C/linearGradient%3E %3ClinearGradient id=%22fr%22 x1=%224%22 y1=%2210%22 x2=%2260%22 y2=%2254%22 gradientUnits=%22userSpaceOnUse%22%3E%3Cstop offset=%220%22 stop-color=%22%23FFE2A3%22/%3E%3Cstop offset=%221%22 stop-color=%22%23C8913A%22/%3E%3C/linearGradient%3E %3C/defs%3E %3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230B111A%22/%3E %3Ccircle cx=%2223.5%22 cy=%2232%22 r=%2214.5%22 fill=%22none%22 stroke=%22url(%23fr)%22 stroke-width=%224%22/%3E %3Ccircle cx=%2240.5%22 cy=%2232%22 r=%2214.5%22 fill=%22none%22 stroke=%22url(%23fr)%22 stroke-width=%224%22/%3E %3Cpath d=%22M32 20.25A14.5 14.5 0 0 1 32 43.75A14.5 14.5 0 0 1 32 20.25Z%22 fill=%22url(%23fl)%22/%3E %3C/svg%3E">
<title>Портфель клиента · WealthLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Onest:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  /* Фирменная тёмная палитра сайта wealth.euroaff.eu: чернила, золото, бирюза для «сошлось» */
  --ground:#06090E; --surface:#0E141D; --surface-2:#121A25; --ink:#EEF2F7; --ink-2:#A9B4C3; --muted:#6D7989;
  --line:rgba(226,236,255,.08); --line-2:rgba(226,236,255,.15); --accent:#F3BD58; --accent-soft:rgba(243,189,88,.12);
  --risk:#FF7B6C; --risk-soft:rgba(255,123,108,.13); --watch:#F3BD58; --watch-soft:rgba(243,189,88,.13);
  --good:#45D8B6; --good-soft:rgba(69,216,182,.12); --info:#82B5FF; --info-soft:rgba(130,181,255,.12);
  --series-1:#EEF2F7; --series-2:#F3BD58;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 18px 44px -26px rgba(0,0,0,.85);
  --radius:16px;
  --sans:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --logo:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E %3Cdefs%3E %3ClinearGradient id=%22wl-lens%22 x1=%2224%22 y1=%2217%22 x2=%2240%22 y2=%2247%22 gradientUnits=%22userSpaceOnUse%22%3E %3Cstop offset=%220%22 stop-color=%22%23FFF3D1%22/%3E%3Cstop offset=%22.48%22 stop-color=%22%23F3BD58%22/%3E%3Cstop offset=%221%22 stop-color=%22%23B27A26%22/%3E %3C/linearGradient%3E %3ClinearGradient id=%22wl-ring%22 x1=%224%22 y1=%2210%22 x2=%2260%22 y2=%2254%22 gradientUnits=%22userSpaceOnUse%22%3E %3Cstop offset=%220%22 stop-color=%22%23FFE2A3%22/%3E%3Cstop offset=%221%22 stop-color=%22%23C8913A%22/%3E %3C/linearGradient%3E %3C/defs%3E %3Ccircle cx=%2223%22 cy=%2232%22 r=%2216.5%22 fill=%22none%22 stroke=%22url(%23wl-ring)%22 stroke-width=%223.2%22/%3E %3Ccircle cx=%2241%22 cy=%2232%22 r=%2216.5%22 fill=%22none%22 stroke=%22url(%23wl-ring)%22 stroke-width=%223.2%22/%3E %3Cpath d=%22M32 18.17A16.5 16.5 0 0 1 32 45.83A16.5 16.5 0 0 1 32 18.17Z%22 fill=%22url(%23wl-lens)%22/%3E %3C/svg%3E");
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground) radial-gradient(1100px 520px at 72% -160px, rgba(243,189,88,.11), transparent 70%) no-repeat; color:var(--ink); font:14.5px/1.5 var(--sans); -webkit-font-smoothing:antialiased; min-height:100vh}
body::before{content:""; position:fixed; left:0; right:0; top:0; height:720px; z-index:-1; pointer-events:none; opacity:.55;
  background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 0%, #000 10%, transparent 72%); mask-image:radial-gradient(ellipse 70% 60% at 50% 0%, #000 10%, transparent 72%)}
::selection{background:rgba(243,189,88,.35)}
.num,td,.value,.v{font-variant-numeric:tabular-nums}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.wrap{max-width:1240px; margin:0 auto; padding:0 24px}

/* Верхняя панель */
.bar{position:sticky; top:0; z-index:20; background:rgba(6,9,14,.78); -webkit-backdrop-filter:blur(16px) saturate(1.3); backdrop-filter:blur(16px) saturate(1.3); border-bottom:1px solid var(--line)}
.bar .wrap{display:flex; align-items:center; gap:14px; min-height:60px; flex-wrap:wrap}
/* На широком экране панель в одну строку: при нехватке места ужимаются подписи выписок, а не кнопки. */
@media (min-width:901px){
  .bar .wrap{flex-wrap:nowrap}
  #docChips{min-width:0; overflow:hidden; white-space:nowrap}
  .bar .client{flex:0 1 220px; min-width:120px}
}
.brand{display:inline-flex; align-items:center; gap:9px; font:700 15.5px/1 var(--sans); letter-spacing:-.02em; color:var(--ink); text-decoration:none}
.brand::before{content:""; width:26px; height:26px; background:var(--logo) center / contain no-repeat}
.client{font-size:18px; font-weight:600; border:1px solid transparent; background:transparent; padding:4px 8px; border-radius:8px; width:220px}
.client:hover{border-color:var(--line-2)}
.client:focus{border-color:var(--accent); outline:none; background:var(--surface)}
.spacer{flex:1}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line-2); background:rgba(226,236,255,.04); border-radius:11px; padding:9px 15px; font-weight:500; white-space:nowrap; text-decoration:none; color:inherit; transition:background-color .2s, border-color .2s, box-shadow .2s, filter .2s}
.btn:hover{border-color:rgba(226,236,255,.3); background:rgba(226,236,255,.08)}
.btn.primary{background:linear-gradient(180deg, #FFD27A, #F3BD58); color:#1B1305; border-color:rgba(243,189,88,.7); font-weight:600;
  box-shadow:0 1px 0 rgba(255,255,255,.45) inset, 0 10px 26px -14px rgba(243,189,88,.6)}
.btn.primary:hover{filter:brightness(1.06); border-color:#F3BD58}
.btn.small{padding:6px 11px; font-size:13px; border-radius:10px}

/* Загрузка */
.drop{position:relative; margin:9vh auto 0; max-width:680px; border:1.5px dashed rgba(226,236,255,.18); border-radius:28px; padding:52px 44px 44px; text-align:center; isolation:isolate;
  background:radial-gradient(90% 70% at 50% 0%, rgba(243,189,88,.10), transparent 70%), linear-gradient(180deg, rgba(21,32,48,.92), rgba(12,18,26,.94)); box-shadow:0 50px 120px -50px rgba(0,0,0,.95)}
.drop.over{border-color:var(--accent); background:radial-gradient(90% 90% at 50% 0%, rgba(243,189,88,.2), transparent 75%), linear-gradient(180deg, #152030, #0E141D)}
.drop-mark{width:64px; height:64px; margin:0 auto 22px; border-radius:18px; background:var(--logo) center / 42px no-repeat, #0B111A; box-shadow:0 0 0 1px var(--line-2), 0 20px 40px -20px rgba(243,189,88,.45)}
.drop h1{font-size:34px; line-height:1.1; margin:12px 0 14px; font-weight:650; letter-spacing:-.035em; text-wrap:balance}
.drop .btn.primary{padding:13px 24px; font-size:15.5px; border-radius:13px}
.drop .btn.small{padding:12px 18px; font-size:14.5px; border-radius:13px}
.drop-actions{display:flex; flex-wrap:wrap; justify-content:center; gap:8px}
.drop .eyebrow{font:600 11px/1 var(--mono); letter-spacing:.12em; color:var(--accent)}
.drop .eyebrow a.home{color:inherit; text-decoration:none}
.demo-link a,.drop .lang-link a{color:var(--accent)}
.drop p{color:var(--ink-2); margin:0 auto 24px; max-width:46ch}
.drop .hint{font-size:12.5px; color:var(--muted); margin:18px auto 0}
.drop .lang-link{margin-top:8px} .drop .lang-link a{color:inherit}
.drop .hint a[href^="mailto:"],.pw-note a[href^="mailto:"]{color:var(--accent); text-underline-offset:2px}
.progress{margin-top:20px; font-size:13.5px; color:var(--ink-2); text-align:left; display:grid; gap:6px}

/* Сводка */
.hero{display:grid; grid-template-columns:minmax(260px,1fr) 2fr; gap:20px; margin:26px 0 6px; align-items:stretch}
.eyebrow{font:600 10.5px/1.3 var(--mono); letter-spacing:.11em; text-transform:uppercase; color:var(--muted)}
.total .value{font-size:44px; font-weight:650; letter-spacing:-.04em; line-height:1.05; margin:10px 0 6px}
.total .sub{color:var(--ink-2); font-size:13.5px}
.brokers{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px}
.brokers.n4{grid-template-columns:repeat(auto-fit,minmax(max(230px,40%),1fr))}
.card{background:linear-gradient(180deg, #111926, #0D131B); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.broker{padding:14px 16px}
.broker .name{font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.broker .v{font-size:22px; font-weight:600; margin:8px 0 2px}
.broker .meta{font-size:12.5px; color:var(--muted)}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:500; padding:2px 8px; border-radius:99px; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line); white-space:nowrap}
.pill.ok{background:var(--good-soft); color:var(--good); border-color:transparent}
.pill.stale{background:var(--watch-soft); color:var(--watch); border-color:transparent}
.pill.live{background:var(--info-soft); color:var(--info); border-color:transparent}
.pill.bad{background:var(--risk-soft); color:var(--risk); border-color:transparent}

/* Разделы */
section{margin:30px 0}
.sec-h{display:flex; align-items:baseline; gap:12px; margin:0 0 12px; flex-wrap:wrap}
.sec-h h2{font-size:21px; margin:0; font-weight:650; letter-spacing:-.025em}
.sec-h .aside{color:var(--muted); font-size:13px}

/* Выводы */
.insights{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.insight{padding:16px 18px 14px}
.lvl{display:inline-block; font:600 10px/1 var(--mono); letter-spacing:.09em; text-transform:uppercase; padding:5px 7px 4px; border-radius:6px}
.lvl.high{background:var(--risk-soft); color:var(--risk)}
.lvl.watch{background:var(--watch-soft); color:var(--watch)}
.lvl.info{background:var(--info-soft); color:var(--info)}
.insight h3{font-size:15.5px; line-height:1.35; margin:10px 0 6px; font-weight:600; text-wrap:balance}
.insight p{margin:0; color:var(--ink-2)}
.insight ul{margin:4px 0 0; padding:0; list-style:none}
.insight li{padding:7px 0; border-top:1px solid var(--line)}
.insight li:first-child{border-top:0}
.insight li b{font-weight:500}
.insight li .note{display:block; color:var(--ink-2); font-size:13px}
.insight li .note.high{color:var(--risk)}
.basis{margin-top:10px; font-size:12px; color:var(--muted)}

/* Сроки */
.tl{padding:4px 0}
.tl-row{display:grid; grid-template-columns:104px 110px 1fr auto; gap:14px; align-items:center; padding:10px 18px; border-top:1px solid var(--line)}
.tl-row .pill{justify-self:end}
.tl-row:first-child{border-top:0}
.tl-date{font-weight:600}
.tl-row.past{color:var(--muted)}
.tl-row.past .tl-date{font-weight:500}
.tl-more{padding:10px 18px; border-top:1px solid var(--line)}
.tl-row > .muted:only-child{grid-column:1 / -1}   /* «Впереди сроков нет» — на всю ширину, а не в колонке даты */

/* Позиции */
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:0 0 10px}
.seg{display:inline-flex; background:var(--surface); border:1px solid var(--line-2); border-radius:9px; padding:3px; gap:2px; flex-wrap:wrap}
.seg button{border:0; background:transparent; padding:6px 11px; border-radius:6px; font-size:13px; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:rgba(243,189,88,.16); color:var(--accent); box-shadow:0 0 0 1px rgba(243,189,88,.35) inset}
.table-wrap{overflow-x:auto; border-radius:var(--radius)}
table.pos{width:100%; border-collapse:collapse; font-size:13px}
.pos th{background:var(--surface-2); text-align:right; font-weight:500; color:var(--muted); font-size:12px; padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:bottom}
.pos th.l,.pos td.l{text-align:left}
.pos td{padding:9px 10px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; vertical-align:top}
.pos tr.row{cursor:pointer}
.pos tr.row:hover td{background:var(--surface-2)}
.pos tr.grp td{background:var(--ground); font-weight:600; text-align:left; font-size:12.5px; color:var(--ink-2); padding:8px 12px}
.pos tr.foot td{font-weight:600; background:var(--surface-2)}
.pos .nm{font-weight:500; white-space:normal; min-width:190px; max-width:280px}
.code{font-family:var(--mono); font-size:11.5px; color:var(--muted); font-weight:400}
.unk{color:var(--muted); font-size:12.5px}
.up{color:var(--good)} .down{color:var(--risk)}
.sub2{display:block; font-size:11.5px; color:var(--muted); font-weight:400}
/* Пояснения под числами переносятся, числа — нет: так колонки остаются узкими,
   а «В валюте» и «В USD» помещаются в экран без горизонтальной прокрутки. */
.pos .sub2,.pos .unk{white-space:normal}
.pos td.brk{color:var(--ink-2)}
.pos td.brk{white-space:nowrap}
.pos td.brk .sub2{margin-left:0; max-width:none; white-space:nowrap}
.pos td:not(.nm):not(.l) .sub2,.pos th .sub2{max-width:128px; margin-left:auto}
.pos th:first-child,.pos td:first-child{position:sticky; left:0; z-index:1; background:var(--surface)}
.pos th:first-child,.pos tr.foot td:first-child,.pos tr.row:hover td:first-child{background:var(--surface-2)}
.pos tr.grp td:first-child{background:var(--ground)}

/* График */
.chart-card{padding:16px 18px}
.legend{display:flex; gap:18px; font-size:13px; color:var(--ink-2); align-items:center; flex-wrap:wrap; margin-bottom:8px}
.sw{display:inline-block; width:16px; height:3px; border-radius:2px; vertical-align:middle; margin-right:6px}
svg.chart{display:block; width:100%; height:auto}
select{padding:6px 10px; border-radius:8px; border:1px solid var(--line-2); background:var(--surface)}

/* Документы и недостающее */
.docs{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.doc{padding:14px 16px}
.check{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:6px 0; border-top:1px solid var(--line)}
.miss{padding:4px 16px 14px}
.miss-row{padding:10px 0; border-top:1px solid var(--line)}
.miss-row:first-child{border-top:0}
.miss-row .t{font-weight:600}
.miss-row .d{font-size:13px; color:var(--ink-2)}

/* Шторка позиции */
.scrim{position:fixed; inset:0; background:rgba(8,14,24,.36); opacity:0; pointer-events:none; transition:opacity .2s; z-index:39}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(560px,100%); background:var(--surface); box-shadow:-12px 0 40px rgba(0,0,0,.18); transform:translateX(102%); visibility:hidden; transition:transform .22s ease, visibility 0s linear .22s; z-index:40; overflow-y:auto; padding:22px 24px 40px}
/* закрытая панель не должна отбрасывать тень на край страницы и попадать в обход с клавиатуры */
.drawer.open{transform:none; visibility:visible; transition:transform .22s ease}
.drawer h3{margin:4px 0 2px; font-size:19px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:7px 16px; font-size:13.5px; margin:16px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0; text-align:right}
/* Платный отчёт: предпросмотр, заглушки, демо, согласие на cookies */
.paywall{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(230px,1fr); gap:24px; padding:24px 26px; border-color:rgba(243,189,88,.5);
  background:radial-gradient(70% 120% at 100% 0%, rgba(243,189,88,.13), transparent 60%), linear-gradient(180deg, #152030, #0E141D); box-shadow:0 0 0 6px rgba(243,189,88,.05), var(--shadow)}
.paywall h2{font-size:20px; line-height:1.3; margin:6px 0 10px; text-wrap:balance}
.pw-list{margin:0; padding-left:18px; color:var(--ink-2)}
.pw-list li{margin:4px 0}
.pw-buy{display:flex; flex-direction:column; gap:8px; justify-content:center; align-items:flex-start; border-left:1px solid var(--line); padding-left:22px}
.pw-price{font-size:48px; font-weight:650; letter-spacing:-.045em; line-height:1}
.pw-btn{padding:11px 18px; font-size:15px}
.pw-note{font-size:12.5px; max-width:34ch}
.pw-note a,.drop .eyebrow a.home{color:inherit}
.skel{height:11px; border-radius:6px; background:var(--line); margin:10px 0}
.skel.w90{width:90%} .skel.w70{width:70%} .skel.w50{width:50%}
.lockcard h3{display:none}
.linkbtn{border:0; background:none; padding:0; color:var(--accent); text-decoration:underline; font:inherit; cursor:pointer}
.tl-row.lockline{display:flex; justify-content:space-between; align-items:center; background:var(--surface-2)}
.pos tr.lockrow td{background:var(--surface-2); color:var(--ink-2); text-align:left; padding:12px 14px; white-space:normal}
.pos tr.lockrow .btn{margin-left:10px}
.lockblock{padding:18px; display:grid; gap:10px; justify-items:start}
.lockblock p{margin:0; color:var(--ink-2)}
.skel-chart{width:100%; height:150px; border-radius:10px; background:repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 38px), var(--surface-2)}
.demobar{display:flex; gap:16px; align-items:center; justify-content:space-between; padding:12px 16px; margin:18px 0 0; border-color:var(--info)}
.demo-link{font-size:13.5px; margin:16px auto 0}
.where{margin:18px auto 0; max-width:480px; text-align:left; font-size:13px; color:var(--ink-2)}
.where summary{cursor:pointer; color:var(--muted); text-align:center; list-style:none}
.where summary::-webkit-details-marker{display:none}
.where summary::after{content:" ▾"}
.where[open] summary::after{content:" ▴"}
.where ul{margin:10px 0 0; padding-left:18px; display:grid; gap:6px}
.drop-foot{text-align:center; font-size:12.5px; margin:14px auto 0; max-width:620px}
.print-lock{display:none}
.consent{position:fixed; left:16px; bottom:16px; z-index:60; width:min(360px, calc(100vw - 32px)); display:grid; gap:8px;
  padding:12px 14px 10px; border-radius:14px; font-size:12.5px; line-height:1.45;
  background:rgba(12,18,26,.9); border:1px solid var(--line-2); box-shadow:0 24px 60px -28px rgba(0,0,0,.9);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  opacity:0; transform:translateY(8px); transition:opacity .25s ease, transform .25s ease}
.consent.in{opacity:1; transform:none}
.consent p{margin:0; color:var(--ink-2)}
.consent a{color:var(--accent)}
.consent div{display:flex; gap:6px; justify-content:flex-end}
.consent button{border:0; background:none; color:var(--muted); border-radius:8px; padding:7px 9px; font:500 12.5px/1 var(--sans); cursor:pointer}
.consent button:hover{color:var(--ink)}
.consent button.primary{background:var(--accent-soft); color:var(--accent); box-shadow:inset 0 0 0 1px rgba(243,189,88,.35); padding:7px 13px}
@media (prefers-reduced-motion:reduce){ .consent{transition:none; transform:none} }
.app-foot{margin:34px 0 8px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:12.5px; text-align:center}
.app-foot a{color:var(--ink-2)}
.app-foot a:hover{color:var(--accent)}
@media (max-width:760px){
  .paywall{grid-template-columns:1fr}
  .pw-buy{border-left:0; padding-left:0; border-top:1px solid var(--line); padding-top:14px}
  .demobar{flex-direction:column; align-items:flex-start}
  .consent{left:12px; width:calc(100vw - 24px)}
}
/* Ручное сопоставление колонок */
.modal{position:fixed; inset:0; z-index:40; background:rgba(10,16,25,.55); display:flex; align-items:center; justify-content:center; padding:20px}
.mapper{width:min(1020px,100%); max-height:88vh; overflow:auto; padding:18px 20px}
.map-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px 14px; margin:14px 0 0}
.map-grid label{font-size:12px; color:var(--muted); display:grid; gap:4px}
.mapper .actions{position:sticky; bottom:0; z-index:1; background:var(--surface); border-top:1px solid var(--line); margin:14px 0 0; padding:10px 0 2px}
.map-grid select{width:100%; padding:6px 8px; border:1px solid var(--line-2); border-radius:8px; background:var(--surface); font-size:13px}
table.prev{width:100%; border-collapse:collapse; font-size:12px}
.prev td,.prev th{border:1px solid var(--line); padding:4px 7px; text-align:left; white-space:nowrap; max-width:190px; overflow:hidden; text-overflow:ellipsis}
.prev th{background:var(--surface-2); color:var(--muted); font-weight:500}
.prev tr.hdr{cursor:pointer}
.prev tr.hdr:hover td{background:var(--surface-2)}
.prev tr.hdr.on td{background:var(--accent-soft); font-weight:600}
table.mini{width:100%; border-collapse:collapse; font-size:12.5px}
.mini th,.mini td{padding:6px 6px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap}
.mini th{color:var(--muted); font-weight:500}
.mini .l{text-align:left}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:rgba(18,26,37,.96); color:var(--ink); border:1px solid var(--line-2); box-shadow:0 20px 50px -20px rgba(0,0,0,.9); padding:12px 18px; border-radius:12px; font-size:13.5px; z-index:50; max-width:calc(100vw - 32px)}
.muted{color:var(--muted)}

/* Структура портфеля */
.struct{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.sblock{padding:14px 16px}
.srow{display:grid; grid-template-columns:minmax(84px,1.6fr) minmax(32px,1.4fr) auto 36px; gap:10px; align-items:center; padding:6px 0; border-top:1px solid var(--line); font-size:13px}
.sblock .eyebrow + .srow{border-top:0; margin-top:6px}
.sbar{height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden}
.sbar i{display:block; height:100%; background:var(--series-1); border-radius:4px}
.sval{font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.spct{color:var(--muted); text-align:right; font-variant-numeric:tabular-nums}

/* Рынок и новости */
.mkt{padding:14px 16px}
.qgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(138px,1fr)); gap:10px}
.q{padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2)}
.q-l{font-size:12px; color:var(--muted); white-space:normal; text-wrap:balance}
.q-v{font-size:17px; font-weight:600; margin-top:2px; font-variant-numeric:tabular-nums}
.q-c{font-size:12.5px; font-variant-numeric:tabular-nums; min-height:18px}
.tape{margin-top:12px; border-top:1px solid var(--line); padding-top:6px}
.tape iframe{display:block; width:100%; height:46px; border:0}
.mkt .basis a,.newscol .basis a{color:var(--ink-2)}
.news{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:12px}
.newscol{padding:12px 16px 10px}
.newsh{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px}
.newsh b{font-size:15px}
.nlist{list-style:none; margin:0; padding:0}
.nlist li{padding:9px 0; border-top:1px solid var(--line)}
.nlist li:first-child{border-top:0}
.nlist a{color:var(--ink); text-decoration:none; font-weight:500; line-height:1.4}
.nlist a:hover{text-decoration:underline}
.nmeta{display:flex; gap:6px; align-items:center; font-size:12px; color:var(--muted); margin-bottom:2px; flex-wrap:wrap}
.tick{font-family:var(--mono); font-size:11px; font-weight:500; padding:1px 6px; border-radius:5px; background:var(--accent-soft); color:var(--accent)}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1px solid var(--line-2); background:var(--surface); border-radius:99px; padding:2px 9px; font-size:12px; color:var(--ink-2)}
.chip[aria-pressed="true"]{background:rgba(243,189,88,.16); color:var(--accent); border-color:rgba(243,189,88,.45)}

/* Телефон и портретный планшет: таблицу позиций читать в девять колонок невозможно,
   поэтому каждая строка становится карточкой. Главное видно сразу — бумага, площадка, стоимость и изменение;
   покупка, комиссия и сумма в валюте открываются нажатием на карточку. */
@media (max-width:820px){
  #positions{overflow-x:visible}        /* только позиции: панели сопоставления прокрутка нужна */
  .pos thead{display:none}
  .pos, .pos tbody{display:block}
  .pos tr.row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; align-items:baseline;
    border:1px solid var(--line); border-radius:10px; margin:8px 0; padding:10px 12px; background:var(--surface)}
  .pos tr.row td{display:block; border:0; padding:0; white-space:normal}
  .pos tr.row td.nm{grid-column:1; grid-row:1; max-width:none; min-width:0}
  .pos tr.row td.usd{grid-column:2; grid-row:1; text-align:right; font-weight:600; white-space:nowrap}
  .pos tr.row td.brk{grid-column:1; grid-row:2; font-size:12.5px; color:var(--muted)}
  .pos tr.row td.chg{grid-column:2; grid-row:2; text-align:right; white-space:nowrap}
  .pos tr.row td.qty{grid-column:1; grid-row:3; font-size:13px}
  .pos tr.row td.px{grid-column:2; grid-row:3; text-align:right; font-size:13px; white-space:nowrap}
  .pos tr.row td.qty::before,.pos tr.row td.px::before{content:attr(data-l) " "; color:var(--muted); font-size:12px}
  .pos tr.row td.buy,.pos tr.row td.fee,.pos tr.row td.loc{display:none}
  /* Уточнение («сейчас», «контр.») идёт в строку, но отдельным словом: базовое правило
     прижимает подписи вправо через margin-left:auto, и слова слипались. */
  .pos tr.row td:not(.nm) .sub2{display:inline; margin:0 0 0 5px; max-width:none; color:var(--muted)}
  .pos tr.row td.nm .sub2{display:block; margin:2px 0 0; max-width:none}
  .pos tr.row td.qty{text-align:left}
  .pos tr.grp,.pos tr.foot{display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    border-radius:8px; padding:8px 12px; margin-top:10px}
  .pos tr.grp td,.pos tr.foot td{display:block; border:0; padding:0; text-align:right; white-space:normal}
  .pos tr.grp td:first-child,.pos tr.foot td:first-child{text-align:left; position:static}
  .pos tr.grp td:empty,.pos tr.foot td:empty{display:none}
  .pos tr.foot{background:var(--surface-2); flex-wrap:wrap}
  .pos td.usd,.pos td.chg,.pos td.qty,.pos td.px{font-variant-numeric:tabular-nums}
}
@media (max-width:900px){
  .news{grid-template-columns:1fr}
  .struct{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .insights,.docs{grid-template-columns:1fr}
  .tl-row{grid-template-columns:92px 1fr; row-gap:4px}
  .tl-row > :nth-child(3),.tl-row .pill{grid-column:1 / -1}
  .tl-row .pill{justify-self:start}
  .client{width:160px}
  .bar .wrap{gap:8px; padding-block:8px}
  .bar .btn.small{padding:6px 9px; font-size:12.5px}
  /* На узком экране панель не липнет к верху: иначе она съедает треть экрана. */
  .bar{position:static}
  .brand,#docChips{display:none}
  .wrap{padding:0 14px}
  .total .value{font-size:32px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
@media print{
  @page{size:A4 landscape; margin:11mm}
  body.is-locked #app, body.is-locked .bar{display:none !important}
  body.is-locked .print-lock{display:block !important; padding:60px 20px; font-size:18px; text-align:center}
  /* На бумаге всегда светлая палитра, даже если у велса тёмная тема. */
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
    --ground:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F6F8; --ink:#0E1A2B; --ink-2:#35455B; --muted:#5D6A7B;
    --line:#DADFE6; --line-2:#C5CDD8; --risk:#B42318; --risk-soft:#FBEAE8; --watch:#955800; --watch-soft:#FCF0DA;
    --good:#1B7650; --good-soft:#E4F2EB; --info:#2D5985; --info-soft:#E6EEF7; --series-1:#0E1A2B; --series-2:#B0892A;
    --accent:#8A6B1E; --accent-soft:#F4EDDA; color-scheme:light;
  }
  .bar,.no-print,.drawer,.scrim,.toast{display:none !important}
  body{background:#fff}
  body::before{display:none}
  .card,.paywall{background:#fff !important; box-shadow:none !important}
  .brand::before{display:none}
  .wrap{max-width:none; padding:0}
  .card{box-shadow:none}
  .insight,.doc,.broker,.chart-card{break-inside:avoid}
  .print-head{display:block !important}
  .print-only{display:block !important}
  section{margin:14px 0}
  .hero{margin-top:6px}
  .table-wrap{overflow:visible}
  table.pos{font-size:10px}
  .pos .nm{min-width:150px; max-width:230px}
  .pos td,.pos th{padding:4px 6px}
  .pos th:first-child,.pos td:first-child{position:static}
  .pos thead{display:table-header-group}
  .pos tr{break-inside:avoid}
  .total .value{font-size:30px}
  .hero{grid-template-columns:1fr 2fr}
  .insights,.docs{grid-template-columns:1fr 1fr}
  .tl-row{grid-template-columns:104px 110px 1fr auto; padding:6px 14px}
  .tl-row > :nth-child(3),.tl-row .pill{grid-column:auto}
  .tl-row .pill{justify-self:end}
  section:has(#positions){break-before:page}
  #market{break-before:page}
  .news{grid-template-columns:1fr 1fr}
  .struct{grid-template-columns:repeat(3,minmax(0,1fr))}
  section:has(#structure){break-inside:avoid}
  .nlist li{break-inside:avoid}
  .sbar,.sbar i,.pill,.lvl,.q,.tick{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  /* Заголовок раздела не остаётся внизу страницы без содержимого. */
  .sec-h{break-after:avoid}
  section:has(#chart),section:has(#docs),#printPeriods,#printNotes{break-inside:avoid}
}
.print-head{display:none; margin:0 0 8px}
.print-only{display:none}
ul.notes{margin:0; padding-left:18px}
ul.notes li{margin:5px 0; color:var(--ink-2)}
</style>
</head>
<body>
<header class="bar" id="bar" hidden>
  <div class="wrap">
    <span class="brand">WealthLens</span>

  </div>

<input type="file" id="file" accept=".pdf,.csv,.tsv,.txt,.xlsx,.xls,application/pdf" multiple hidden>
<script>
/* Язык интерфейса: ?lang=en|ru со ссылки лендинга запоминается в браузере; по умолчанию русский.
   WL.t("русский", "English") выбирает строку; числа и даты форматирует WL.fmt (model.js). */
window.WL = window.WL || {};
WL.lang = (() => {
  const q = new URLSearchParams(location.search).get("lang");
  let l = q === "en" || q === "ru" ? q : null;
  try{ if(l) localStorage.setItem("wl_lang", l); else l = localStorage.getItem("wl_lang"); }catch(e){}
  return l === "en" ? "en" : "ru";
})();
WL.t = (ru, en) => WL.lang === "en" ? en : ru;
document.documentElement.lang = WL.lang;
</script>
<script>
/* Адрес сервера котировок и новостей. Страница, открытая с нашего сервера, ходит на тот же
   адрес. Опубликованная копия (GitHub Pages) берёт его из wealth/api.json: файл пишет
   server/publish.sh, когда поднимает туннель. Параметр ?api=… принимается только для
   туннеля Cloudflare и этого компьютера, чтобы ссылкой нельзя было подменить источник. */
window.WL = window.WL || {};
WL.apiReady = (async () => {
  const q = new URLSearchParams(location.search).get("api") || "";
  let api = /^(https:\/\/[a-z0-9-]+\.trycloudflare\.com|http:\/\/(127\.0\.0\.1|localhost)(:\d+)?)\/?$/.test(q) ? q : "";
  if(!api && !/^(127\.0\.0\.1|localhost|\[::1\])$/.test(location.hostname)){
    try{ const r = await fetch("wealth/api.json?t=" + Date.now(), {cache: "no-store"}); if(r.ok) api = (await r.json()).api || ""; }catch(e){}
  }
  return WL.API_BASE = String(api).replace(/\/+$/, "");
})();
</script>
<script>window.WL_PIXEL_ID = ""; window.WL_SUPPORT_EMAIL = "";   /* подставляет publish.sh из site/config.json; пустой пиксель не грузится */</script>
