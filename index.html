<style>
:root{
  /* Фирменная тёмная палитра wealth.euroaff.eu: чернила, золото; статусы — отдельно от цветов категорий */
  --ground:#06090E; --surface:#0E141D; --surface-2:#121A25; --ink:#EEF2F7; --ink-2:#A9B4C3; --muted:#6D7989;
  --line:rgba(226,236,255,.08); --line-2:rgba(226,236,255,.15); --accent:#F3BD58; --accent-soft:rgba(243,189,88,.12);
  --risk:#FF7B6C; --risk-soft:rgba(255,123,108,.12); --watch:#F3BD58; --watch-soft:rgba(243,189,88,.12);
  --good:#45D8B6; --good-soft:rgba(69,216,182,.12); --info:#82B5FF; --info-soft:rgba(130,181,255,.12);
  /* Категории: шесть оттенков в постоянном порядке проверены скриптом dataviz (validate_palette, тёмная поверхность #0E141D
     и белая бумага — все проверки пройдены); деньги и «прочее» — нейтральные. Рядом всегда подпись и зазор 2px. */
  --series-1:#F3BD58; --series-2:#7F8B9B; --up:#45D8B6; --dn:#FF7B6C;
  --c-cash:#5B6675; --c-stock:#c98500; --c-fund:#3987e5; --c-bond:#d55181; --c-note:#008300; --c-deriv:#8d6ad8; --c-alt:#16a0a0; --c-other:#A9B4C3;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 18px 44px -26px rgba(0,0,0,.85);
  --radius:16px;
  --sans:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --logo:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E %3Cdefs%3E %3ClinearGradient id=%22wl-lens%22 x1=%2224%22 y1=%2217%22 x2=%2240%22 y2=%2247%22 gradientUnits=%22userSpaceOnUse%22%3E %3Cstop offset=%220%22 stop-color=%22%23FFF3D1%22/%3E%3Cstop offset=%22.48%22 stop-color=%22%23F3BD58%22/%3E%3Cstop offset=%221%22 stop-color=%22%23B27A26%22/%3E %3C/linearGradient%3E %3ClinearGradient id=%22wl-ring%22 x1=%224%22 y1=%2210%22 x2=%2260%22 y2=%2254%22 gradientUnits=%22userSpaceOnUse%22%3E %3Cstop offset=%220%22 stop-color=%22%23FFE2A3%22/%3E%3Cstop offset=%221%22 stop-color=%22%23C8913A%22/%3E %3C/linearGradient%3E %3C/defs%3E %3Ccircle cx=%2223%22 cy=%2232%22 r=%2216.5%22 fill=%22none%22 stroke=%22url(%23wl-ring)%22 stroke-width=%223.2%22/%3E %3Ccircle cx=%2241%22 cy=%2232%22 r=%2216.5%22 fill=%22none%22 stroke=%22url(%23wl-ring)%22 stroke-width=%223.2%22/%3E %3Cpath d=%22M32 18.17A16.5 16.5 0 0 1 32 45.83A16.5 16.5 0 0 1 32 18.17Z%22 fill=%22url(%23wl-lens)%22/%3E %3C/svg%3E");
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground) radial-gradient(1100px 520px at 72% -160px, rgba(243,189,88,.10), transparent 70%) no-repeat; color:var(--ink); font:14.5px/1.5 var(--sans); -webkit-font-smoothing:antialiased; min-height:100vh}
body::before{content:""; position:fixed; left:0; right:0; top:0; height:720px; z-index:-1; pointer-events:none; opacity:.5;
  background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 0%, #000 10%, transparent 72%); mask-image:radial-gradient(ellipse 70% 60% at 50% 0%, #000 10%, transparent 72%)}
::selection{background:rgba(243,189,88,.35)}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
a{color:var(--accent); text-underline-offset:2px}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px}
.muted{color:var(--muted)} .small{font-size:12.5px} .fine{font-size:12.5px; color:var(--muted); margin:8px 0 0}
.eyebrow{font:600 10.5px/1.3 var(--mono); letter-spacing:.11em; text-transform:uppercase; color:var(--muted)}
.eyebrow.gold{color:var(--accent)}
h1,h2,h3{text-wrap:balance; letter-spacing:-.02em}
.card{background:linear-gradient(180deg, #111926, #0D131B); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line-2); background:rgba(226,236,255,.04); border-radius:11px; padding:9px 15px; font-weight:500; white-space:nowrap; text-decoration:none; color:inherit; transition:background-color .2s, border-color .2s, filter .2s}
.btn:hover{border-color:rgba(226,236,255,.3); background:rgba(226,236,255,.08)}
.btn.primary{background:linear-gradient(180deg, #FFD27A, #F3BD58); color:#1B1305; border-color:rgba(243,189,88,.7); font-weight:600; box-shadow:0 1px 0 rgba(255,255,255,.45) inset, 0 10px 26px -14px rgba(243,189,88,.6)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.small{padding:6px 11px; font-size:13px; border-radius:10px}
.btn.big{padding:13px 22px; font-size:15.5px; border-radius:13px}
.link{background:none; border:0; padding:0; color:var(--accent); font-weight:500; text-decoration:underline; text-underline-offset:3px; text-decoration-color:rgba(243,189,88,.4)}
.link:hover{text-decoration-color:var(--accent)}
.link.danger{color:var(--ink-2); text-decoration-color:var(--line-2)}
svg{width:14px; height:14px; flex:none}

/* Верхняя панель */
.bar{position:sticky; top:0; z-index:20; background:rgba(6,9,14,.8); -webkit-backdrop-filter:blur(16px) saturate(1.3); backdrop-filter:blur(16px) saturate(1.3); border-bottom:1px solid var(--line)}
.bar .wrap{display:flex; align-items:center; gap:10px; min-height:60px}
.brand{display:inline-flex; align-items:center; gap:9px; font:700 15.5px/1 var(--sans); letter-spacing:-.02em; color:var(--ink); text-decoration:none; flex:none}
.brand::before{content:""; width:26px; height:26px; background:var(--logo) center / contain no-repeat}
.client{font-size:17px; font-weight:600; border:1px solid transparent; background:transparent; padding:4px 8px; border-radius:8px; width:230px; min-width:80px; flex:0 1 230px; text-overflow:ellipsis}
.client:hover{border-color:var(--line-2)} .client:focus{border-color:var(--accent); outline:none; background:var(--surface)}
.spacer{flex:1}
.dl{position:relative}
.menu{position:absolute; right:0; top:calc(100% + 6px); min-width:220px; padding:6px; border-radius:12px; background:#131C28; border:1px solid var(--line-2); box-shadow:var(--shadow); z-index:30; display:grid}
.menu button{display:flex; gap:10px; align-items:center; text-align:left; background:none; border:0; padding:9px 10px; border-radius:8px}
.menu button:hover{background:rgba(226,236,255,.06)}
.menu small{display:block; color:var(--muted); font-size:12px}

/* Старт */
.start{padding:7vh 0 60px; display:grid; gap:26px; justify-items:center}
.drop{position:relative; width:100%; max-width:720px; border:1.5px dashed rgba(226,236,255,.18); border-radius:28px; padding:48px 44px 40px; text-align:center;
  background:radial-gradient(90% 70% at 50% 0%, rgba(243,189,88,.10), transparent 70%), linear-gradient(180deg, rgba(21,32,48,.92), rgba(12,18,26,.94)); box-shadow:0 50px 120px -50px rgba(0,0,0,.95)}
.drop .mark{width:62px; height:62px; margin:0 auto 20px; border-radius:18px; background:var(--logo) center / 40px no-repeat, #0B111A; box-shadow:0 0 0 1px var(--line-2), 0 20px 40px -20px rgba(243,189,88,.45)}
.drop h1{font-size:34px; line-height:1.12; margin:0 0 14px; font-weight:650; letter-spacing:-.035em}
.drop .lede{color:var(--ink-2); margin:0 auto 26px; max-width:56ch; font-size:15.5px}
.actions{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.drop .hint{font-size:12.5px; color:var(--muted); margin:16px 0 0}
.demo-link{display:inline-block; margin-top:14px; font-weight:500}
.how{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; width:100%; max-width:720px; counter-reset:s}
.how li{counter-increment:s; padding:14px 16px; border:1px solid var(--line); border-radius:14px; background:rgba(14,20,29,.6); display:grid; gap:3px}
.how li b::before{content:counter(s) "  "; font:600 11px/1 var(--mono); color:var(--accent)}
.how span{font-size:13px; color:var(--ink-2)}
.privacy{display:flex; gap:10px; align-items:flex-start; max-width:720px; margin:0; font-size:13px; color:var(--ink-2)}
.privacy svg{margin-top:3px; color:var(--good)}
body.dragging::after{content:attr(data-drop); position:fixed; inset:12px; z-index:90; border:2px dashed var(--accent); border-radius:22px; background:rgba(6,9,14,.82); display:grid; place-items:center; font:600 20px/1.3 var(--sans); color:var(--accent); pointer-events:none}

/* Отчёт */
#app.wrap{padding-bottom:70px}
.sec{margin-top:34px}
.sh{display:flex; align-items:baseline; gap:10px; margin:0 0 12px}
.sh h2{margin:0; font-size:20px; font-weight:650}
.sh .btn{margin-left:auto}
.demo-bar{margin-top:18px; padding:12px 16px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; border-color:rgba(243,189,88,.35)}
.demo-bar span{display:flex; gap:8px; align-items:center; color:var(--ink-2)} .demo-bar svg{color:var(--accent)}

/* Чтение */
.reading{margin-top:22px; padding:18px 20px}
.rh{display:flex; gap:14px; align-items:center; margin-bottom:12px}
.rh h2{margin:0; font-size:18px}
.rh p{margin:2px 0 0; font-size:13px}
.orb{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; flex:none; color:#1B1305; background:radial-gradient(circle at 35% 30%, #FFE9B5, #F3BD58 55%, #B27A26)}
.orb svg{width:16px; height:16px}
.reading .orb{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(243,189,88,.45)} 50%{box-shadow:0 0 0 10px rgba(243,189,88,0)}}
.files{list-style:none; margin:0; padding:0; display:grid}
.fl{display:grid; grid-template-columns:20px minmax(0,1.1fr) minmax(0,1.6fr) 120px 28px; gap:12px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:13.5px}
.fl .fb{grid-column:4}
.fl .fx{grid-column:5; width:26px; height:26px; border-radius:8px; border:1px solid var(--line-2); background:none; color:var(--muted); font-size:16px; line-height:1; padding:0}
.fl .fx:hover{color:var(--risk); border-color:rgba(255,123,108,.5)}
.fl:first-child{border-top:0}
.fi{display:grid; place-items:center; width:18px; height:18px; border-radius:50%}
.st-done .fi{color:var(--good); background:var(--good-soft)} .st-warn .fi,.st-error .fi{color:var(--risk); background:var(--risk-soft)} .st-skipped .fi{color:var(--muted); background:rgba(226,236,255,.06)}
.fn{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fm{color:var(--ink-2); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.st-error .fm,.st-skipped .fm{color:var(--muted)}
.fb{height:4px; border-radius:4px; background:rgba(226,236,255,.08); overflow:hidden} .fb i{display:block; height:100%; background:linear-gradient(90deg,#C9922F,var(--accent) 60%,#FFE2A3); transition:width .4s ease}
.spin{display:block; width:14px; height:14px; border-radius:50%; background:conic-gradient(var(--accent) 0 28%, rgba(243,189,88,.15) 28% 100%); animation:rot 1s linear infinite;
  -webkit-mask:radial-gradient(circle, transparent 55%, #000 57%); mask:radial-gradient(circle, transparent 55%, #000 57%)}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .spin,.reading .orb{animation:none} .skel i{animation:none} }

/* Сводка сверху */
.hero{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:18px; margin-top:22px; align-items:stretch}
.total{padding:20px 22px; display:flex; flex-direction:column}
.th{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.seg{display:inline-flex; padding:3px; border-radius:10px; border:1px solid var(--line); background:rgba(226,236,255,.03)}
.seg button{border:0; background:none; padding:4px 9px; border-radius:7px; font:500 12px/1.2 var(--mono); color:var(--muted)}
.seg button[aria-pressed="true"]{background:rgba(243,189,88,.14); color:var(--accent)}
.tv{font-size:clamp(30px, 8.6vw, 48px); font-weight:650; letter-spacing:-.045em; line-height:1.05; margin:14px 0 8px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.ts{color:var(--ink-2); font-size:13.5px}
.ts.muted{color:var(--muted); font-size:12.5px; margin-top:2px}
.cover{display:flex; gap:8px; align-items:flex-start; margin-top:10px; font-size:13px; line-height:1.45; color:var(--ink-2)}
.cover svg{flex:none; width:15px; height:15px; margin-top:2px} .cover.ok svg{color:var(--good)} .cover.warn svg{color:var(--watch)}
.cover .link{margin-left:6px; font-size:12.5px}
.mix{margin-top:auto; padding-top:20px}
.mix-bar{display:flex; gap:2px; height:10px; border-radius:5px; overflow:hidden}
.mix-bar i{flex:0 1 0; min-width:3px}
.mix-legend{display:flex; flex-wrap:wrap; gap:6px 14px; margin:12px 0 0; padding:0; list-style:none; font-size:12.5px; color:var(--ink-2)}
.mix-legend li{display:inline-flex; align-items:center; gap:6px}
.mix-legend b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
.k{width:9px; height:9px; border-radius:2px; display:inline-block; flex:none}
.c-cash{background:var(--c-cash)} .c-stock{background:var(--c-stock)} .c-fund{background:var(--c-fund)} .c-bond{background:var(--c-bond)}
.c-note{background:var(--c-note)} .c-deriv{background:var(--c-deriv)} .c-alt{background:var(--c-alt)} .c-other{background:var(--c-other)}
.where{padding:18px 20px}
.inst{list-style:none; margin:10px 0 0; padding:0; display:grid}
.inst li{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; padding:10px 0; border-top:1px solid var(--line)}
.inst li:first-child{border-top:0}
.in{display:grid; min-width:0} .in b{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap} .in span{font-size:12px}
.iv{display:flex; flex-direction:column; align-items:flex-end; gap:4px} .iv b{font-variant-numeric:tabular-nums}
.trk{grid-column:1 / -1; height:3px; border-radius:2px; background:rgba(226,236,255,.06); overflow:hidden} .trk i{display:block; height:100%; background:var(--accent); border-radius:2px}
.badge{display:inline-flex; align-items:center; gap:4px; font:500 11px/1 var(--mono); padding:3px 7px; border-radius:999px; white-space:nowrap}
.badge svg{width:11px; height:11px}
.badge.ok{color:var(--good); background:var(--good-soft)} .badge.bad{color:var(--risk); background:var(--risk-soft)} .badge.none{color:var(--muted); background:rgba(226,236,255,.05)}
.badge.part{color:var(--watch); background:var(--watch-soft)}
.paywall.checking h2{display:flex; align-items:center; gap:10px}

/* Оплата */
.paywall{margin-top:18px; padding:18px 22px; display:flex; gap:18px; align-items:center; justify-content:space-between; flex-wrap:wrap;
  border-color:rgba(243,189,88,.35); background:radial-gradient(80% 140% at 100% 0%, rgba(243,189,88,.12), transparent 60%), linear-gradient(180deg, #121B28, #0D131B)}
.paywall h2{margin:6px 0 4px; font-size:18px} .paywall p{margin:0; font-size:13.5px; max-width:62ch}
.pa{display:flex; flex-direction:column; align-items:flex-end; gap:8px}

/* Сводка */
.brief{margin-top:18px; padding:20px 22px}
.ch{display:flex; gap:12px; align-items:center; margin-bottom:10px}
.summary{font-size:16px; line-height:1.62; margin:4px 0 0; max-width:88ch; color:var(--ink)}
.ask{display:flex; gap:8px; margin-top:16px}
.ask .btn svg{width:13px; height:13px; color:var(--accent)}
.starters{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.ask input{flex:1; min-width:0; background:rgba(6,9,14,.55); border:1px solid var(--line-2); border-radius:11px; padding:10px 13px}
.ask input:focus{outline:none; border-color:var(--accent)}
.skel{display:grid; gap:8px; margin-top:8px} .skel i{display:block; height:12px; border-radius:6px; background:linear-gradient(90deg, rgba(226,236,255,.05), rgba(226,236,255,.11), rgba(226,236,255,.05)); background-size:200% 100%; animation:sh 1.4s linear infinite}
.skel.tall{height:280px; border-radius:10px; background:rgba(226,236,255,.04)}
@keyframes sh{to{background-position:-200% 0}}

/* Предупреждения */
.alerts{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}
.alerts.more,.docs.more{margin-top:12px}    /* первые две карточки — вместе с заголовком раздела (блок keep), остальные — следом той же сеткой */
.alert{padding:15px 17px 16px; border-left-width:3px}
.alert.lv-high{border-left-color:var(--risk)} .alert.lv-watch{border-left-color:var(--watch)} .alert.lv-info{border-left-color:var(--info)}
.al{display:flex; gap:8px; align-items:center}
.lvl{font:600 10px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; padding:4px 7px; border-radius:6px}
.lvl.lv-high{color:var(--risk); background:var(--risk-soft)} .lvl.lv-watch{color:var(--watch); background:var(--watch-soft)} .lvl.lv-info{color:var(--info); background:var(--info-soft)}
.by{display:inline-flex; gap:4px; align-items:center; font:500 11px/1 var(--mono); color:var(--accent)} .by svg{width:11px; height:11px}
.alert h3{margin:10px 0 6px; font-size:15.5px; line-height:1.35; font-weight:600}
.alert p{margin:0 0 6px; color:var(--ink-2); font-size:13.5px}
.lockline{display:flex; gap:6px; align-items:center}
.qlist{list-style:none; margin:0; padding:6px 18px}
.qlist li{display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line); color:var(--ink-2)} .qlist li:first-child{border-top:0}
.qlist svg{color:var(--accent); margin-top:3px; flex:none}
.qbtn{display:flex; gap:10px; width:100%; align-items:flex-start; text-align:left; background:none; border:0; padding:0; color:inherit; font:inherit}
.qbtn span{flex:1}
.qbtn em{font-style:normal; font-size:12.5px; color:var(--accent); white-space:nowrap; opacity:.75; transition:opacity .2s}
.qbtn:hover span{color:var(--ink)} .qbtn:hover em{opacity:1}
.alert.talk{cursor:pointer; transition:border-color .2s, background-color .2s}
.alert.talk:hover{border-top-color:var(--line-2); border-right-color:var(--line-2); border-bottom-color:var(--line-2)}
.aa{display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-top:10px}
.talkbtn{display:inline-flex; gap:6px; align-items:center; background:none; border:0; padding:0; color:var(--accent); font:600 13px/1.3 var(--sans)}
.talkbtn svg{width:12px; height:12px}
.alert.talk:hover .talkbtn{text-decoration:underline; text-underline-offset:3px}
.sh-hint{margin-left:auto}

/* Позиции */
.tools{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:10px}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chips button{border:1px solid var(--line); background:rgba(226,236,255,.03); border-radius:999px; padding:5px 11px; font-size:12.5px; color:var(--ink-2)}
.chips button[aria-pressed="true"]{border-color:rgba(243,189,88,.5); color:var(--accent); background:var(--accent-soft)}
.search{background:rgba(6,9,14,.55); border:1px solid var(--line-2); border-radius:10px; padding:7px 11px; width:260px; max-width:100%}
.search:focus{outline:none; border-color:var(--accent)}
.only{font-size:13px; color:var(--ink-2); margin:0 0 8px}
.tw{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--line); background:linear-gradient(180deg, #101824, #0D131B)}
table.pos{width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums}
.pos th{font:600 10.5px/1.2 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-align:right; padding:11px 12px; border-bottom:1px solid var(--line-2); white-space:nowrap}
.pos th.l{text-align:left}
.pos td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top}
.pos td.n{text-align:right; white-space:nowrap}
.pos td.strong{font-weight:600}
.pos td.w{color:var(--ink-2)}
.pos .nm{min-width:220px} .pos .nm b{font-weight:500}
.pos .sub{display:block; font-size:11.5px; color:var(--muted); margin-top:2px; font-weight:400}
.pos tr.pr{cursor:pointer} .pos tr.pr:hover td{background:rgba(226,236,255,.03)}
.pos tr.gh td{padding-top:16px; font-weight:600; color:var(--ink); border-bottom:1px solid var(--line-2); background:rgba(226,236,255,.02)}
.pos tr.gh .k{margin-right:8px}
.pos tr.lockrow td{color:var(--ink-2); font-size:13px} .pos tr.lockrow svg{margin-right:6px; vertical-align:-2px; color:var(--accent)} .pos tr.lockrow .link{margin-left:8px}
.pos tfoot td{padding:12px; font-weight:650; text-align:right} .pos tfoot td:first-child{text-align:left}
.unk{color:var(--muted); border-bottom:1px dotted var(--muted)}

.two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px}
.bars{list-style:none; margin:12px 0 0; padding:0; display:grid; gap:9px}
.bars li{display:grid; grid-template-columns:44px minmax(0,1fr) 44px 110px; gap:10px; align-items:center; font-size:13px}
.bars .bl{font:600 12px/1 var(--mono)}
.bt{height:8px; border-radius:4px; background:rgba(226,236,255,.06); overflow:hidden} .bt i{display:block; height:100%; border-radius:4px; background:var(--ink-2)}
.bars b{text-align:right; font-variant-numeric:tabular-nums} .bars .muted{text-align:right; font-variant-numeric:tabular-nums; font-size:12px}
.tl{list-style:none; margin:12px 0 0; padding:0; display:grid}
.tl li{display:grid; grid-template-columns:92px minmax(0,1fr) auto; gap:12px; padding:8px 0; border-top:1px solid var(--line); font-size:13px; align-items:start}
.tl li:first-child{border-top:0}
.td{font:500 12px/1.5 var(--mono); color:var(--ink-2)} .tn{min-width:0} .tn .sub{display:block; font-size:11.5px; color:var(--muted)} .tl b{font-variant-numeric:tabular-nums}
.tl li.blur .tn{color:var(--muted)}

/* Файлы */
.docs{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}
.doc{padding:14px 16px; display:grid; gap:8px; align-content:start}
.doc.off{opacity:.7}
.dh{display:grid; grid-template-columns:20px minmax(0,1fr) auto; gap:10px; align-items:start}
.di{color:var(--muted); margin-top:2px}
.dn{display:grid; min-width:0} .dn b{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap} .dn span{font-size:12.5px}
.dst{margin:0; font-size:13px; color:var(--ink-2)}
.checks{list-style:none; margin:0; padding:0; display:grid; gap:4px; font-size:12.5px}
.checks li{display:flex; gap:6px; align-items:flex-start} .checks svg{margin-top:2px}
.checks .ok{color:var(--ink-2)} .checks .ok svg{color:var(--good)} .checks .bad{color:var(--ink)} .checks .bad svg{color:var(--risk)}
.checks .na{color:var(--muted)} .checks .na svg{color:var(--muted)}
.dnote{display:flex; gap:8px; margin:0; font-size:13px; color:var(--ink-2)} .dnote svg{color:var(--accent); margin-top:3px}
.rnotes{margin:0; padding-left:18px; font-size:12.5px; color:var(--muted)}
.rn summary{cursor:pointer; font-size:12.5px; color:var(--muted)} .rn[open] summary{margin-bottom:4px}
.da{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:2px}
.ccy-pick{display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:10px 12px; border-radius:10px; background:var(--risk-soft); font-size:13px}
.ccy-pick span{margin-right:4px}
.empty{margin-top:22px; padding:22px}
.method{margin-top:40px; padding-top:18px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-2); max-width:110ch}
.method p{margin:0 0 6px}

/* Обсуждение: панель справа, темы, переписка, сообщения */
.chat{position:fixed; top:0; right:0; bottom:0; width:min(460px, 100vw); z-index:42; display:flex; flex-direction:column; background:#0E151F; border-left:1px solid var(--line-2);
  box-shadow:-30px 0 60px -30px rgba(0,0,0,.8); transform:translateX(102%); transition:transform .25s ease; visibility:hidden}
.chat.open{transform:none; visibility:visible}
.chat-h{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line)}
.chat-h .orb{width:32px; height:32px} .chat-h .orb svg{width:14px; height:14px}
.chat-t{flex:1; min-width:0; display:grid; gap:2px}
.chat-t b{font-size:14.5px; line-height:1.3; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.ib{flex:none; width:34px; height:34px; border-radius:9px; border:1px solid var(--line-2); background:none; font-size:20px; line-height:1; color:var(--ink-2)}
.ib:hover{color:var(--ink); border-color:rgba(226,236,255,.3)}
.credits{flex:none; font:500 11px/1.2 var(--mono); padding:5px 8px; border-radius:999px; color:var(--accent); background:var(--accent-soft); white-space:nowrap}
.credits.low{color:var(--watch)} .credits.out{color:var(--risk); background:var(--risk-soft)}
.chat-b{flex:1; overflow-y:auto; padding:16px 16px 20px; display:flex; flex-direction:column; gap:12px; overscroll-behavior:contain}
.msg{display:flex; gap:9px; align-items:flex-start}
.msg.u{justify-content:flex-end}
.av{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; color:#1B1305; background:radial-gradient(circle at 35% 30%, #FFE9B5, #F3BD58 55%, #B27A26)}
.av svg{width:12px; height:12px}
.bubble{min-width:0; max-width:calc(100% - 35px); padding:10px 13px; border-radius:4px 14px 14px 14px; background:rgba(226,236,255,.045); border:1px solid var(--line); font-size:14px; line-height:1.55}
.bubble p{margin:0 0 8px} .bubble p:last-child{margin:0}
.bubble ul,.bubble ol{margin:0 0 8px; padding-left:19px} .bubble li{margin:2px 0} .bubble ul:last-child,.bubble ol:last-child{margin-bottom:0}
.bubble b{color:var(--ink); font-weight:600}
.msg.u .bubble{max-width:85%; border-radius:14px 14px 4px 14px; background:rgba(243,189,88,.12); border-color:rgba(243,189,88,.28); white-space:pre-wrap; overflow-wrap:anywhere}
.typing{display:flex; gap:5px; align-items:center; padding:13px 14px}
.typing i{width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:.35; animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25} 40%{opacity:1}}
.ctx{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:rgba(226,236,255,.025)}
.ctx b{font-size:14px; line-height:1.35} .ctx p{margin:5px 0 0; font-size:13px; color:var(--ink-2)}
.ctx .lvl{flex:none; margin-top:1px}
.tico{flex:none; display:grid; place-items:center; width:22px; height:22px; border-radius:7px; color:var(--accent); background:var(--accent-soft)} .tico svg{width:11px; height:11px}
.sugs{display:flex; flex-wrap:wrap; gap:6px; padding-left:35px}
.sug{border:1px solid rgba(243,189,88,.35); background:rgba(243,189,88,.05); color:var(--accent); border-radius:999px; padding:6px 11px; font-size:12.5px; line-height:1.3; text-align:left; transition:background-color .2s}
.sug:hover{background:var(--accent-soft)}
.hub-h{font:600 10.5px/1.3 var(--mono); letter-spacing:.11em; text-transform:uppercase; color:var(--muted); margin:6px 0 -4px}
.topics{display:grid; gap:6px}
.topic{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; text-align:left; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:rgba(226,236,255,.03); color:var(--ink); font-size:13.5px; line-height:1.35; transition:border-color .2s, background-color .2s}
.topic:hover{border-color:var(--line-2); background:rgba(226,236,255,.06)}
.topic .tt{overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.topic .ta{color:var(--muted)} .topic:hover .ta{color:var(--accent)}
.topic .tn{font:500 11px/1 var(--mono); color:var(--good); background:var(--good-soft); border-radius:999px; padding:4px 7px}
.hub-note{margin:4px 0 0; font-size:12px; color:var(--muted)}
.chat-err{font-size:13px; color:var(--risk); padding-left:35px}
.nocred{padding:14px 15px; border-radius:14px; border:1px solid rgba(243,189,88,.35); background:radial-gradient(80% 140% at 100% 0%, rgba(243,189,88,.12), transparent 60%), rgba(226,236,255,.02)}
.nocred b{font-size:14.5px} .nocred p{margin:6px 0 0; font-size:13px; color:var(--ink-2)}
.nb-a{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.chat-f{display:flex; gap:8px; align-items:flex-end; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:#0C121B}
.chat-f textarea{flex:1; min-width:0; resize:none; min-height:44px; max-height:140px; background:rgba(6,9,14,.6); border:1px solid var(--line-2); border-radius:12px; padding:11px 13px; font:inherit; font-size:14px; line-height:1.45; color:inherit}
.chat-f textarea:focus{outline:none; border-color:var(--accent)}
.chat-f textarea:disabled{opacity:.55}
.chat-f .send{width:44px; height:44px; padding:0; font-size:18px; border-radius:12px; flex:none}
.chat-f .send:disabled{filter:grayscale(.6); opacity:.5}
.chat-fab{position:fixed; right:22px; bottom:22px; z-index:35; display:inline-flex; align-items:center; gap:9px; padding:12px 16px 12px 14px; border-radius:999px; border:1px solid rgba(243,189,88,.7);
  background:linear-gradient(180deg, #FFD27A, #F3BD58); color:#1B1305; font:600 14px/1 var(--sans); box-shadow:0 1px 0 rgba(255,255,255,.45) inset, 0 16px 36px -14px rgba(243,189,88,.7), 0 3px 10px rgba(0,0,0,.45); transition:filter .2s, transform .2s}
.chat-fab:hover{filter:brightness(1.06); transform:translateY(-1px)}
.chat-fab svg{width:15px; height:15px}
.chat-fab em{font:600 11px/1 var(--mono); font-style:normal; color:var(--accent); background:#1B1305; border-radius:999px; padding:4px 7px}
.chat-fab[hidden]{display:none}
.chat-nudge{position:fixed; right:22px; bottom:82px; z-index:35; width:min(320px, calc(100vw - 32px)); background:#131C28; border:1px solid rgba(243,189,88,.4); border-radius:16px; box-shadow:var(--shadow); animation:rise .35s ease both}
.chat-nudge .nb{display:grid; gap:5px; width:100%; text-align:left; background:none; border:0; padding:14px 34px 14px 16px; color:var(--ink)}
.chat-nudge .eyebrow{display:inline-flex; gap:5px; align-items:center} .chat-nudge .eyebrow svg{width:10px; height:10px}
.chat-nudge b{font-size:14px; line-height:1.35} .chat-nudge span{font-size:13px; color:var(--ink-2); line-height:1.4}
.chat-nudge .nx{position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:8px; border:0; background:none; color:var(--muted); font-size:17px; line-height:1}
.chat-nudge .nx:hover{color:var(--ink)}
@keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.talk-pos{margin:0 0 14px}
.talk-pos svg{width:12px; height:12px; color:var(--accent)}
@media (min-width:1240px){
  body.chat-open #app.wrap{margin-right:460px; margin-left:auto}
  body.chat-open .bar .wrap{margin-right:460px; margin-left:auto}
}
@media (prefers-reduced-motion: reduce){ .chat,.chat-nudge{transition:none; animation:none} .typing i{animation:none; opacity:.7} }

/* Карточка позиции */
.scrim{position:fixed; inset:0; background:rgba(3,5,8,.6); opacity:0; pointer-events:none; transition:opacity .2s; z-index:40}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(480px, 100vw); z-index:41; background:#0E151F; border-left:1px solid var(--line-2); box-shadow:-30px 0 60px -30px rgba(0,0,0,.8);
  transform:translateX(102%); transition:transform .25s ease; overflow-y:auto; padding:22px 22px 40px}
.drawer.open{transform:none}
.drawer .x{position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:9px; border:1px solid var(--line-2); background:none; font-size:20px; line-height:1}
.drawer h3{margin:6px 40px 14px 0; font-size:19px; line-height:1.3}
.drawer dl{display:grid; grid-template-columns:auto minmax(0,1fr); gap:7px 16px; margin:0; font-size:13.5px}
.drawer dt{color:var(--muted)} .drawer dd{margin:0; text-align:right; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.src{margin-top:20px; padding-top:16px; border-top:1px solid var(--line)}
.src p{margin:6px 0 10px; font-size:13px; color:var(--ink-2)}
.pageimg{display:block; width:100%; height:auto; border-radius:8px; border:1px solid var(--line-2); background:#fff}

/* Окна и сообщения */
.modal-wrap{position:fixed; inset:0; z-index:80; background:rgba(3,5,8,.66); display:grid; place-items:center; padding:16px}
.modal{width:min(520px, 100%); max-height:calc(100vh - 32px); overflow:auto; background:#101823; border:1px solid var(--line-2); border-radius:20px; padding:24px 24px 20px; box-shadow:0 40px 100px -30px rgba(0,0,0,.9)}
.modal h2{margin:8px 0 10px; font-size:20px; line-height:1.25}
.modal-body p{margin:0 0 10px; color:var(--ink-2)}
.modal-input{width:100%; margin:4px 0 6px; background:rgba(6,9,14,.6); border:1px solid var(--line-2); border-radius:10px; padding:10px 12px}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:16px}
.check{display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--ink-2); margin:12px 0 4px; cursor:pointer}
.check input{margin-top:3px; accent-color:var(--accent)}
#toast{position:fixed; left:50%; bottom:22px; transform:translate(-50%, 20px); opacity:0; pointer-events:none; z-index:95; max-width:min(560px, calc(100vw - 32px));
  background:#18222F; border:1px solid var(--line-2); color:var(--ink); padding:11px 16px; border-radius:12px; box-shadow:var(--shadow); font-size:13.5px; transition:opacity .2s, transform .2s}
#toast.on{opacity:1; transform:translate(-50%, 0)}
.print-head{display:none}
.print-only{display:none}

/* Рынок: оценка сейчас, изменения, бенчмарк, котировки, новости */
.up{color:var(--up)} .dn{color:var(--dn)}
.seg.val{margin:14px 0 0}
.basis{font:500 11.5px/1.4 var(--mono); color:var(--muted); margin:8px 0 0 !important}
.thsub{display:block; font:400 10px/1.2 var(--mono); letter-spacing:.04em; text-transform:none; color:var(--muted); margin-top:2px}
.pos td.mk{font-size:13px}
.pos td.mk b{font-weight:600}
.nb{color:var(--muted)}
.chips.per{margin-bottom:2px}
/* Динамика за период под итогом и раздел «История» */
.dyn{margin:14px 0 12px; padding-top:12px; border-top:1px solid var(--line)}
.dyn .chips{gap:4px} .dyn .chips button{padding:4px 8px; font-size:12px}
.dyn .dyh{margin-top:12px; flex-basis:100%} .dv b.na{color:var(--muted); font-weight:500}
.dvs{display:flex; gap:10px 26px; flex-wrap:wrap; margin-top:6px}
.dv{display:flex; flex-direction:column; gap:1px; min-width:0}
.dv .dl{font:600 10px/1.3 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.dv b{font-size:20px; font-weight:650; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.dv b.up,.dv span.up{color:var(--up)} .dv b.dn,.dv span.dn{color:var(--dn)} .dv span{font-size:12.5px}
.hchart{display:block; width:100%; height:auto; margin:2px 0 12px}
.hchart .hg{stroke:var(--line-2); stroke-width:1; stroke-dasharray:2 4}
.hchart .hv,.hchart .hx{font:500 12px var(--mono); fill:var(--muted)}
.hchart .hl,.hchart .hg{vector-effect:non-scaling-stroke} .hchart .hp{r:4.5}
.hchart.hc-narrow{display:none}
.hchart .ha{fill:var(--accent); opacity:.1} .hchart .hl{fill:none; stroke:var(--accent); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.hchart .hl.live{stroke-dasharray:4 4; opacity:.8}
.hchart .hp{fill:var(--accent); stroke:var(--surface); stroke-width:2} .hchart .hp.open{fill:var(--surface); stroke:var(--accent); stroke-width:2} .hchart .hp.live{fill:var(--up)}
.hlist{list-style:none; margin:0; padding:0; display:grid}
.hlist li{display:grid; grid-template-columns:88px minmax(0,1fr) auto auto; gap:12px; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:13px}
.hlist .hd{font:500 12px var(--mono); color:var(--ink-2)} .hlist .hn .sub{display:block; color:var(--muted); font-size:11.5px; margin-top:2px}
.hlist b{font-variant-numeric:tabular-nums; font-weight:600; text-align:right}
.chips.bench{margin:10px 0 4px}
.k.c-port{background:var(--series-1)} .k.c-bench{background:var(--series-2)}
.cmp{display:grid; gap:9px; margin-top:12px}
.cmp-h,.cmp-r{display:grid; grid-template-columns:110px minmax(0,1fr) minmax(0,1fr); gap:12px; align-items:center}
.cmp-h{font-size:12px; color:var(--ink-2)} .cmp-h span{display:flex; gap:6px; align-items:center}
.cmp-r .cl{font-size:13px; color:var(--ink-2)}
.cv{display:grid; grid-template-columns:minmax(0,1fr) 58px; gap:8px; align-items:center}
.cv .bw{height:8px; border-radius:4px; background:rgba(226,236,255,.06); overflow:hidden}
.cv .bw i{display:block; height:100%; border-radius:4px}
.cv i.port{background:var(--series-1)} .cv i.bench{background:var(--series-2)} .cv i.neg{opacity:.55}
.cv b{text-align:right; font-variant-numeric:tabular-nums; font-size:13px}
.ov{list-style:none; margin:10px 0 0; padding:0; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:6px 16px}
.ov li{display:grid; grid-template-columns:minmax(0,1fr) auto 64px; gap:8px; font-size:13px; padding:5px 0; border-bottom:1px solid var(--line)}
.ov li span{color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ov b{font-variant-numeric:tabular-nums; font-weight:600} .ov em{font-style:normal; text-align:right; font-variant-numeric:tabular-nums}
.news-card{margin-top:18px}
.news-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:18px; margin-top:8px}
.news-grid h3{font-size:14px; margin:4px 0 8px}
.news-grid ul{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.news-grid li{display:grid; gap:2px; font-size:13.5px}
.news-grid li a{color:var(--ink); text-decoration:none} .news-grid li a:hover{color:var(--accent)}
.news-grid li span{font-size:11.5px}
.nt{margin-bottom:10px} .nt > b{font:600 12px/1 var(--mono); color:var(--accent); display:block; margin-bottom:6px}

@media screen and (max-width:900px){
  .hero,.two{grid-template-columns:minmax(0,1fr)}
  .alerts,.docs{grid-template-columns:minmax(0,1fr)}
  .fl{grid-template-columns:20px minmax(0,1fr) 90px 28px} .fl .fm{grid-column:2 / -1; grid-row:2}
  .fl .fb{grid-column:3; grid-row:1} .fl .fx{grid-column:4; grid-row:1}
}
@media screen and (max-width:1020px){
  .hchart .hv,.hchart .hx{font-size:17px} .hchart .hp{r:6.5}
  .pos .mt{display:none}
  .pos .nm{min-width:160px}
  .pos th{white-space:normal}
}
@media screen and (max-width:760px){
  .wrap{padding:0 16px}
  .pos th,.pos td,.pos tfoot td{padding-left:6px; padding-right:6px}
  .pos tfoot td .sub{display:none}
  .pos td.mk .sub{display:none}                  /* на телефоне в «Изм.» — только процент; сумма изменения — в карточке позиции */
  .pos .nm,.pos .nm .sub{overflow-wrap:anywhere}  /* длинные ISIN и тикеры переносятся, а не расширяют таблицу */
  .bar .wrap{flex-wrap:wrap; padding-top:8px; padding-bottom:8px; gap:8px}
  .client{flex:1 1 140px; width:auto}
  #addBtn,#newBtn{padding:6px 9px}
  .drop{padding:34px 20px 28px; border-radius:22px} .drop h1{font-size:26px}
  .how{grid-template-columns:minmax(0,1fr)}
  /* колонки «Где», «Кол-во», «Цена», «Стоимость», «Сейчас» помечены классом mh во всех строках (у категорий, «Итого» и замка —
     пустой ячейкой той же ширины), поэтому после скрытия строки выравниваются одинаково и итоги остаются на экране */
  .pos .mh{display:none}
  .ov,.news-grid{grid-template-columns:minmax(0,1fr)}
  .cmp-h,.cmp-r{grid-template-columns:78px minmax(0,1fr) minmax(0,1fr); gap:8px}
  .pos .nm{min-width:0}
  .bars li{grid-template-columns:40px minmax(0,1fr) 40px}
  .bars li .muted{display:none}
  .search{width:100%}
  .paywall .pa{align-items:stretch; width:100%}
  .chat{width:100vw; border-left:0}
  .chat-fab{right:16px; bottom:16px; padding:12px}
  .chat-fab span{display:none}                    /* на телефоне — только значок и число тем, чтобы не закрывать таблицу */
  .chat-nudge{right:16px; bottom:72px}
  .sh-hint{display:none}
  .hchart.hc-wide{display:none} .hchart.hc-narrow{display:block} .hchart.hc-narrow .hv,.hchart.hc-narrow .hx{font-size:17px} .hchart.hc-narrow .hp{r:6.5}
  .hlist li{grid-template-columns:minmax(0,1fr) auto; gap:4px 10px} .hlist .hd{grid-column:1} .hlist .hn{grid-column:1 / -1; grid-row:2} .hlist li .badge{grid-column:1 / -1; justify-self:start}
  .dyn .chips button{white-space:nowrap}
  .starters{flex-wrap:nowrap; overflow-x:auto; margin-right:-4px; padding-bottom:2px}
  .starters .sug{white-space:nowrap}
}

@media screen and (max-width:360px){
  table.pos{font-size:12.5px}
  .pos tr.gh td:first-child,.pos .nm b{-webkit-hyphens:auto; hyphens:auto}   /* «Альтернатив-ные активы» на 320 px */
}

/* Печать: светлая бумага, всё раскрыто, без кнопок */
@media print{
  :root{--ground:#fff; --surface:#fff; --ink:#111; --ink-2:#333; --muted:#666; --line:#ddd; --line-2:#bbb; --accent:#9A6A12; --good:#0F7A5C; --risk:#B42318; --info:#1F5FBF; --watch:#9A6A12;
    --good-soft:#E7F5EF; --risk-soft:#FDECEA; --info-soft:#E8F0FC; --watch-soft:#FBF1DD; --accent-soft:#FBF1DD; color-scheme:light}
  @page{size:A4; margin:14mm 12mm}
  body{background:#fff; font-size:10pt; min-height:0} #app.wrap{padding-bottom:0}   /* без запаса под кнопку ассистента — иначе лишняя пустая страница */
  body::before{display:none}
  .bar,.no-print,.ask,.da,.demo-bar,.paywall,.drawer,.scrim,#toast,.reading,.modal-wrap,.seg,.link,.demo-link,.chat,.chat-fab,.chat-nudge,.starters,.talkbtn,.sh-hint{display:none !important}
  body.chat-open #app.wrap{margin:0 auto}
  .qbtn em{display:none}
  .print-only{display:block}
  .news-grid li a{color:#111} .cv i.port,.cv i.bench,.k.c-port,.k.c-bench{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  :root{--up:#0F7A5C; --dn:#B42318}
  .card,.tw{background:#fff !important; box-shadow:none; border-color:#ccc}
  .print-head{display:block; margin:0 0 6mm; border-bottom:2px solid #111; padding-bottom:4mm}
  .print-head .brandline{font:600 9pt/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:#9A6A12}
  .print-head h1{margin:2mm 0 1mm; font-size:20pt} .print-head p{margin:0; color:#444}
  .tv{font-size:26pt} .summary{font-size:11pt}
  .hero,.two{grid-template-columns:1fr 1fr; gap:5mm}
  /* Карточки выводов и файлов — строчными блоками по две в ряд: строчный блок печать не разрывает между страницами ни в Chrome,
     ни в Safari (break-inside у ячеек сетки Safari не соблюдает — заголовок оставался внизу страницы, текст уезжал на следующую) */
  .alerts,.docs{display:block}
  .alerts > .alert,.docs > .doc{display:inline-block; vertical-align:top; width:calc(50% - 2.2mm); margin:0 0 4mm; break-inside:avoid; page-break-inside:avoid}
  .alerts > .alert:nth-child(odd),.docs > .doc:nth-child(odd){margin-right:4mm}
  .keep{display:inline-block; width:100%; vertical-align:top}   /* заголовок раздела и первый ряд карточек — на одной странице */
  #holdings{break-before:page; page-break-before:always}
  #history .card{break-inside:avoid; page-break-inside:avoid} .hchart .ha{opacity:.12}          /* таблица позиций — с новой страницы, а не шапкой внизу предыдущей */
  .alerts.more,.docs.more{margin-top:0}
  .hero .card,.two .card,.brief,.qlist li{break-inside:avoid; page-break-inside:avoid}
  .sh,h2,h3{break-after:avoid; page-break-after:avoid}
  .sec{margin-top:7mm} .sh h2{font-size:14pt}
  /* Таблица позиций на бумаге — полная, со всеми колонками (правила узкого экрана к печати не относятся) */
  .tw{overflow:visible}
  table.pos{font-size:7.6pt} .pos th{color:#555; white-space:normal; font-size:6.6pt; letter-spacing:.04em; padding:3px 4px} .pos td{padding:3px 4px}
  .pos .nm{min-width:0} .pos .nm,.pos .nm .sub{overflow-wrap:anywhere} .pos .sub{font-size:6.6pt}
  .pos tr{break-inside:avoid; page-break-inside:avoid} .pos thead{display:table-header-group}
  .pos tfoot{display:table-row-group}          /* «Итого» — один раз в конце таблицы, а не внизу каждой страницы */
  .pos tr.gh{break-after:avoid; page-break-after:avoid}
  .pos td.mk{font-size:7.6pt} .pos td.ac{width:14%} .pos .nm{width:24%}
  .method{border-top:1px solid #bbb}
  .mix-bar i,.k,.trk i,.bt i{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  .bt i{background:#555}
}
</style>
