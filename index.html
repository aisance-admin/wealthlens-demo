<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WealthLens — Portfolio Health</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --navy:#0e1b2c; --navy2:#142539; --panel:#172c44; --line:#24405e;
    --ink:#eaf1f8; --muted:#9fb3c8; --gold:#c9a227; --gold2:#e3c25a;
    --good:#3fb98c; --watch:#e0a93b; --risk:#e0584e;
    --equity:#4f86c6; --bond:#5bb7a8; --fund:#c9a227; --note:#c97b3a;
    --deriv:#9b6fc4; --cash:#7f93a6; --alt:#e07b66;
    --radius:14px; --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 70% -10%, #1b3350 0%, var(--navy) 55%) fixed;
    color:var(--ink); font-family:"Segoe UI",Inter,system-ui,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  a{color:var(--gold2)}
  /* Подсказка в пустом поле не должна выглядеть как введённое значение —
     иначе советник примет предположение инструмента за данные из выписки. */
  input::placeholder{color:var(--muted);opacity:.55;font-style:italic}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9999;
    max-width:min(520px,92vw);background:var(--panel);border:1px solid var(--line);
    border-left:3px solid var(--good);border-radius:10px;padding:11px 15px;font-size:13px;
    color:var(--ink);box-shadow:var(--shadow);transition:opacity .35s;line-height:1.45}
  .toast.bad{border-left-color:var(--risk)}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 22px 80px}
  header.top{display:flex;align-items:center;gap:16px;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:13px}
  .logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(145deg,var(--gold),#9c7d18);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1405;font-size:20px;box-shadow:var(--shadow)}
  .brand h1{font-size:20px;margin:0;letter-spacing:.3px}
  .brand .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .seg{display:inline-flex;background:var(--navy2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--muted);padding:8px 13px;cursor:pointer;font-size:13px;font-weight:600}
  .seg button.on{background:var(--gold);color:#1a1405}
  .btn{background:var(--gold);color:#1a1405;border:0;border-radius:10px;padding:9px 15px;font-weight:700;cursor:pointer;font-size:13px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--gold)}
  .btn:disabled{opacity:.45;cursor:default}

  /* landing */
  .hero{background:linear-gradient(180deg,var(--panel),var(--navy2));border:1px solid var(--line);
    border-radius:var(--radius);padding:30px;box-shadow:var(--shadow)}
  .hero h2{margin:0 0 8px;font-size:23px}
  .hero p{color:var(--muted);margin:0 0 22px;max-width:760px;line-height:1.55}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .src{background:var(--navy);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;transition:.15s;position:relative}
  .src:hover{border-color:var(--gold);transform:translateY(-2px)}
  .src .ic{font-size:24px;margin-bottom:9px}
  .src h3{margin:0 0 6px;font-size:15px}
  .src p{font-size:12.5px;color:var(--muted);margin:0;line-height:1.45}
  .src .tag{position:absolute;top:12px;right:12px;font-size:10px;color:var(--gold2);border:1px solid var(--line);border-radius:20px;padding:2px 8px}

  /* tabs */
  nav.tabs{display:flex;gap:6px;margin:4px 0 18px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
  nav.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);
    padding:11px 15px;cursor:pointer;font-size:13.5px;font-weight:600}
  nav.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
  nav.tabs button:hover{color:var(--ink)}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card .k{color:var(--muted);font-size:12px;letter-spacing:.3px;text-transform:uppercase}
  .card .v{font-size:26px;font-weight:800;margin-top:6px}
  .card .v small{font-size:14px;font-weight:600;color:var(--muted)}
  .card .d{font-size:12px;margin-top:5px;color:var(--muted)}

  .row{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
  @media(max-width:900px){.row{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  .panel h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px}
  .panel h3 .hint{font-size:11.5px;color:var(--muted);font-weight:500}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;user-select:none}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:rgba(255,255,255,.025)}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .flag{color:var(--risk);font-weight:700}
  .legend{display:flex;flex-direction:column;gap:8px}
  .legend .li{display:flex;align-items:center;justify-content:space-between;font-size:13px}
  .legend .li .lbl{display:flex;align-items:center;gap:0}
  .bar{height:9px;border-radius:6px;background:var(--navy);overflow:hidden;margin-top:4px}
  .bar > i{display:block;height:100%}

  .gauge-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .score-sub{display:grid;grid-template-columns:1fr;gap:11px;flex:1;min-width:260px}
  .ssub{}
  .ssub .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
  .ssub .top b{font-weight:700}

  .reso{display:flex;gap:13px;padding:14px;border:1px solid var(--line);border-radius:11px;margin-bottom:11px;background:var(--navy)}
  .reso .lv{width:5px;border-radius:5px;flex:0 0 5px}
  .reso h4{margin:0 0 5px;font-size:14px}
  .reso p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
  .reso .impact{margin-top:7px;font-size:12px;color:var(--gold2);font-weight:600}
  .lvtag{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 8px;border-radius:6px;align-self:flex-start}

  .manual input,.manual select{background:var(--navy);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:8px 10px;font-size:13px;width:100%}
  .manual label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px}
  .mg{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end}
  @media(max-width:900px){.mg{grid-template-columns:repeat(2,1fr)}}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{background:var(--navy);border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer}
  .chip.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
  .muted{color:var(--muted)}
  .note-meta{font-size:12px;color:var(--muted);line-height:1.7}
  .note-meta b{color:var(--ink)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .src-indicator{font-size:12.5px;color:var(--muted)}
  .src-indicator b{color:var(--gold2)}
  .footnote{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5}
  .empty{color:var(--muted);text-align:center;padding:30px;font-size:14px}
  .kbar{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .err{color:var(--risk);font-size:12.5px;margin-top:8px}
  #settingsPanel input{background:var(--navy);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;width:100%}
  #settingsPanel label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px}
  .cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.cfg-grid{grid-template-columns:1fr}}
  #gearBtn{font-size:15px;line-height:1}

  /* ---------- Mobile ---------- */
  @media(max-width:760px){
    .wrap{padding:14px 13px 64px}
    header.top{gap:10px}
    .brand{gap:11px}
    .logo{width:36px;height:36px;font-size:17px;border-radius:9px}
    .brand h1{font-size:18px}
    .brand .sub{font-size:11px;line-height:1.35}
    .ctrls{width:100%;gap:8px}
    .seg button{padding:8px 11px}
    .btn{padding:9px 13px}
    .hero{padding:20px 16px}
    .hero h2{font-size:19px}
    .hero p{font-size:13.5px;margin-bottom:18px}
    .grid4{grid-template-columns:1fr 1fr;gap:11px}
    .src{padding:15px}
    nav.tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-width:0;max-width:100%}
    nav.tabs::-webkit-scrollbar{display:none}
    nav.tabs button{white-space:nowrap;padding:11px 13px;flex:0 0 auto}
    .toolbar{flex-direction:column;align-items:stretch;gap:10px;margin-bottom:12px;min-width:0}
    .src-indicator{order:2;line-height:2;min-width:0}
    .row>*{min-width:0}
    .cards{grid-template-columns:1fr 1fr;gap:10px}
    .card{padding:13px}
    .card .v{font-size:21px}
    .panel{padding:14px;overflow-x:auto;min-width:0}
    .panel table{min-width:460px}            /* wide tables scroll horizontally inside the panel */
    .cfg-grid{gap:12px}
  }
  @media(max-width:480px){
    .grid4{grid-template-columns:1fr}
    .mg{grid-template-columns:1fr}
    .hero h2{font-size:18px}
    .brand .sub{font-size:10.5px}
    nav.tabs button{font-size:13px;padding:10px 11px}
    .card .v{font-size:20px}
    .card .k{font-size:11px}
  }
  #reportArea{display:none}
  .acts button{background:var(--navy);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:3px 8px;cursor:pointer;font-size:12px;margin-left:4px}
  .acts button:hover{border-color:var(--gold);color:var(--ink)}
  @media print{
    @page{ size:A4; margin:14mm 12mm 16mm; }
    /* Печатная палитра. Цвета интерфейса подобраны под тёмный фон и на белой
       бумаге выглядят выцветшими; переопределяем их только для печати, чтобы
       не трогать логику — ratingColor() и цвета классов продолжают работать. */
    :root{
      --good:#2c7a5c; --watch:#a8761a; --risk:#b8433a; --muted:#8a8a8a;
      --equity:#3c6fa8; --bond:#3f9689; --fund:#a8861f; --note:#a85f22;
      --deriv:#7d54a6; --cash:#6b7f92; --alt:#c05f4a;
      --ink:#111; --line:#ddd; --gold:#c9a227; --gold2:#8a6d1f;
    }
    body{background:#fff !important}
    .wrap{display:none !important}
    #reportArea{display:block !important;color:#111;font-family:"Helvetica Neue",Arial,Helvetica,sans-serif;padding:0}
    #reportArea svg circle:last-of-type{fill:#fff}
    #reportArea .legend{display:none}

    /* Разделы не рвутся посередине, заголовки таблиц повторяются на каждой
       странице — иначе многостраничный список позиций нечитаем.              */
    .rep-sec{page-break-inside:avoid; break-inside:avoid; margin-bottom:16px}
    .rep-break{page-break-before:always; break-before:page}
    .rep thead{display:table-header-group}
    .rep tr{page-break-inside:avoid; break-inside:avoid}

    .rep-h{display:flex;justify-content:space-between;align-items:flex-start;
      border-bottom:2.5px solid #c9a227;padding-bottom:11px;margin-bottom:15px}
    .rep-title{font-size:21px;font-weight:700;letter-spacing:.2px}
    .rep-sub{color:#555;font-size:12px;margin-top:4px;line-height:1.5}
    .rep-score{font-size:36px;font-weight:800;line-height:1;text-align:right}
    .rep-score span{display:block;font-size:12px;color:#777;font-weight:400;margin-top:3px}

    .rep-kpi{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
    .rep-kpi>div{border:1px solid #dcdcdc;border-radius:7px;padding:8px 11px;min-width:96px;flex:1}
    .rep-kpi span{display:block;font-size:9.5px;color:#666;text-transform:uppercase;letter-spacing:.4px}
    .rep-kpi b{font-size:15.5px}

    .rep-cols{display:flex;gap:24px;align-items:flex-start}
    .rep-cols>div{flex:1;min-width:0}
    .rep h3{font-size:15px;margin:0 0 10px;padding-bottom:5px;border-bottom:2px solid #c9a227;color:#111}
    .rep h4{font-size:12.5px;margin:12px 0 5px;border-bottom:1px solid #e8e8e8;padding-bottom:3px;color:#333;
      text-transform:uppercase;letter-spacing:.4px}
    .rep table{width:100%;border-collapse:collapse;font-size:11px}
    .rep th{font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;color:#666;text-align:left;
      border-bottom:1px solid #ccc;padding:4px 5px 4px 0;font-weight:600}
    .rep td{padding:3.5px 5px 3.5px 0;border-bottom:1px solid #f2f2f2;vertical-align:top}
    .rep .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
    .rep .muted{color:#888}
    .rep .warn{color:#a8761a}
    .rep .bad{color:#b8433a}
    .rep .good{color:#2c7a5c}

    /* подоценки */
    .rep-sub-row{display:flex;align-items:center;gap:9px;font-size:11px;margin-bottom:5px}
    .rep-sub-row .lbl{flex:0 0 132px;color:#444}
    .rep-sub-row .track{flex:1;height:7px;background:#eee;border-radius:4px;overflow:hidden}
    .rep-sub-row .fill{display:block;height:100%}
    .rep-sub-row .val{flex:0 0 34px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

    .rep-res{padding-left:0;list-style:none;margin:0}
    .rep-res li{font-size:11px;margin-bottom:9px;line-height:1.5;padding-left:10px;border-left:3px solid #ddd}
    .rep-res li.high{border-left-color:#b8433a}
    .rep-res li.medium{border-left-color:#d9a13a}
    .rep-res li.low{border-left-color:#8bb8a3}
    .rep-res .lv{font-size:8.5px;text-transform:uppercase;letter-spacing:.5px;color:#888;margin-left:6px}
    .rep-res .imp{display:block;color:#8a6d1f;font-weight:600;margin-top:2px}

    .rep-note{font-size:10px;line-height:1.55;color:#6d6144;background:#fdfaf0;border-left:3px solid #d9c07a;
      padding:8px 11px;margin:9px 0 0;border-radius:0 4px 4px 0}
    .rep-note.alert{color:#7d3b34;background:#fdf3f2;border-left-color:#d98d84}
    .rep-note b{color:inherit}
    .rep-note ul{margin:5px 0 0;padding-left:16px}
    .rep-note li{margin-bottom:2px}

    .rep-foot{margin-top:16px;color:#999;font-size:10px;border-top:1px solid #eee;padding-top:7px;
      display:flex;justify-content:space-between}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">W</div>
      <div>
        <h1>WealthLens</h1>
        <div class="sub" id="tagline"></div>
      </div>
    </div>
    <div class="ctrls">
      <div class="seg" id="curSeg"></div>
      <div class="seg" id="langSeg">
        <button data-lang="ru">RU</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="btn ghost" id="clientsBtn" title="Clients">👥</button>
      <button class="btn ghost" id="gearBtn" title="API / data">⚙︎</button>
      <button class="btn ghost" id="resetBtn" style="display:none"></button>
    </div>
  </header>
  <input type="file" id="fileInp" accept=".csv,.xlsx,.xls,.pdf" multiple style="display:none"/>
  <main id="app"></main>
</div>
<div id="reportArea"></div>

<script>
/* ============================================================
   WealthLens — Portfolio Health Check (prototype)
   Single-file, no build step. RU/EN. Demo / CSV / XLSX / PDF / Manual.
   ============================================================ */

const FX_EMBED = { USD:1, EUR:1.08, CHF:1.12, GBP:1.27, JPY:0.0064 }; // USD per 1 unit (embedded fallback)
const FX_DATE_EMBED = "2026-06-01";
let FX = Object.assign({}, FX_EMBED); // mutated by live refresh (refreshFX)
// Дата расчёта. Была захардкожена на 2026-06-22 — все сроки до экспирации,
// остаточные сроки нот и дюрация считались от давно прошедшего дня. Полночь,
// чтобы счёт дней не плавал в зависимости от времени открытия.
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const BENCH = 0.20; // low-cost indexed benchmark, % p.a.

/* ---------- i18n ---------- */
const I18N = {
  ru:{
    tagline:"Анализ и health-check клиентского портфеля для family office",
    base:"База", lang:"Язык",
    heroTitle:"Единый рентген портфеля клиента",
    heroDesc:"Сведите портфели из разных брокеров в одну картину. Разберём каждый инструмент — структурные ноты, деривативы, фонды, облигации, — посчитаем все комиссии и зашитые издержки и выдадим резолюцию по «здоровью» портфеля с конкретными рекомендациями.",
    srcDemoT:"Демо-портфель", srcDemoD:"Готовый портфель ≈ $21 млн: 4 брокера, ноты, деривативы, фонды, альтернативы.", srcDemoTag:"быстрый старт",
    srcFileT:"Загрузить файл", srcFileD:"CSV или Excel-выгрузка позиций из брокера. Авто-распознавание колонок.", srcFileTag:"CSV / XLSX",
    srcPdfT:"PDF-выписка", srcPdfD:"Извлечение позиций из PDF-выписки брокера (эвристически).", srcPdfTag:"PDF",
    srcManT:"Ручной ввод", srcManD:"Добавьте позиции вручную — удобно для нот и внебиржевых деривативов.", srcManTag:"вручную",
    template:"Скачать шаблон CSV",
    tOverview:"Обзор", tHoldings:"Инструменты", tStruct:"Ноты и деривативы", tFees:"Комиссии", tHealth:"Здоровье",
    kAum:"Активы под анализом", kBrokers:"Брокеров", kPositions:"Позиций", kFee:"Совокупная комиссия", kDrag:"Fee-drag в год", kScore:"Health Score",
    perYear:"в год", ofAum:"от активов",
    allocClass:"Распределение по классам активов", byBroker:"По брокерам", byCcy:"Валютная экспозиция", topHold:"Крупнейшие позиции",
    instrument:"Инструмент", cls:"Класс", broker:"Брокер", ccy:"Вал.", value:"Стоимость", weight:"Доля", feeY:"Комис./год", flags:"Флаги",
    filterAll:"Все",
    structTitle:"Структурные ноты", derivTitle:"Деривативы", noNotes:"Структурных нот не обнаружено.", noDeriv:"Деривативов не обнаружено.",
    underlying:"Базовый актив", coupon:"Купон", barrier:"Барьер", barrierDist:"До барьера", maturity:"Погашение", capProt:"Защита капитала", embedded:"Зашитая стоимость",
    notional:"Ном. номинал", type:"Тип", expiry:"Экспирация", delta:"Дельта", premium:"Премия", daysLeft:"дн.",

/* ---------- broker tariffs (advisory + custody, % p.a.) ----------------
   Раньше здесь стояла таблица тарифов четырёх банков и молчаливый дефолт
   0.50/0.20 для всех остальных. Это были назначенные числа: на демо-портфеле
   они давали около двух третей fee-drag и двигали итоговый скор примерно на
   12 баллов — через границу рейтинга. Договорная сетка есть только у советника,
   поэтому она вводится руками и хранится в профиле клиента. Не введено —
   значит не посчитано, а не «примерно столько».                            */
function brokerFees(b, map){
  const f=(map||STATE.brokerFees||{})[b];
  if(!f) return null;
  // Заполнена только половина сетки — это не сетка. Раньше вторая половина
  // молча становилась 0.00% и брокер помечался «учтён»: тот же самый тихий
  // дефолт, ради устранения которого таблица тарифов и появилась.
  if(f.advisory==null || f.custody==null) return null;
  return {advisory:+f.advisory||0, custody:+f.custody||0};
}
function brokerTariffState(b, map){
  const f=(map||STATE.brokerFees||{})[b];
  const n=f?[f.advisory,f.custody].filter(v=>v!=null).length:0;
  return n===2?"full" : n===1?"partial" : "empty";
}
const TARIFF_HINT = {advisory:"0.00–1.20", custody:"0.00–0.35"};

const fxKnown = p => !!FX[p.ccy];
// Курса нет — значит сумма в базовой валюте НЕИЗВЕСТНА. Раньше здесь стояло
// `FX[p.ccy]||1`, то есть неизвестный курс молча принимался за единицу.
const toBase = p => fxKnown(p) ? p.value * FX[p.ccy] / (FX[STATE.base]||1) : 0;
function fmtMoney(v){
  const sym = {USD:"$",EUR:"€",CHF:"CHF ",GBP:"£",JPY:"¥"}[STATE.base]||"";
  const a=Math.abs(v); let s;
  if(a>=1e6) s=(v/1e6).toFixed(2)+"M";
  else if(a>=1e3) s=(v/1e3).toFixed(1)+"k";
  else s=v.toFixed(0);
  return sym+s;
}
function fmtFull(v){
  const sym = {USD:"$",EUR:"€",CHF:"CHF ",GBP:"£",JPY:"¥"}[STATE.base]||"";
  return sym+Math.round(v).toLocaleString(STATE.lang==="ru"?"ru-RU":"en-US");
}
// Форматирование не имеет права ронять интерфейс из-за данных в файле:
// «2,1» из европейской выписки приходило строкой и роняло вкладку целиком.
const pct = (v,d=1)=>{ const n=typeof v==="number"?v:parseNum(v); return (isFinite(n)?n:0).toFixed(d)+"%"; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* Дата на экране. С cellDates значение приходит объектом Date, и `String(d)`
   давал «Fri Dec 18 2026 00:00:00 GMT+0100 (Центральная Европа…)» прямо в
   таблице. Приводим к ISO-виду; нераспознанное показываем как есть. */
function fmtDate(v){
  if(v==null || v==="") return "—";
  const d=parseDate(v);
  if(d){ const p=n=>String(n).padStart(2,"0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
  return esc(String(v)).slice(0,12);
}
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function parseDate(s){
  if(s==null || s==="") return null;
  if(s instanceof Date) return isNaN(s) ? null : (s.getFullYear()>=1990 && s.getFullYear()<=2100 ? s : null);
  // Excel отдаёт дату числом-серийником (15.09.2035 -> 49568). new Date(49568)
  // молча давала 1970 год: дюрация схлопывалась в 0.5, срок ноты — тоже.
  if(typeof s==="number" || /^\d{1,6}(\.\d+)?$/.test(String(s).trim())){
    const n=+s;
    if(n>=15000 && n<=80000){                       // 1941..2119 в системе Excel
      const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000);
      return isNaN(d)?null:d;
    }
    return null;                                    // просто число — это не дата
  }
  const t=String(s).trim();
  // «31.12.2029» и «31/12/2029» Date разбирает как месяц-первым или не разбирает
  const dmy=t.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
  let d = dmy ? new Date(+dmy[3], +dmy[2]-1, +dmy[1]) : new Date(t);
  if(isNaN(d)) return null;
  const y=d.getFullYear();
  if(y<1990 || y>2100) return null;                 // вне разумного окна — не дата
  return d;
}

/* ============================================================
   ANALYSIS ENGINE
   ============================================================ */
function analyze(positions, feeMap){
  // Сетка тарифов принадлежит КЛИЕНТУ, а не приложению. В сравнении клиентов
  // analyze() вызывается для чужих профилей — без явного параметра каждый
  // считался бы по тарифам того клиента, что сейчас открыт.
  const tariffs = feeMap || STATE.brokerFees || {};
  const rows = positions.map(p=>{
    const bf = brokerFees(p.broker, tariffs);
    const baseValue = toBase(p);
    const fxOk = fxKnown(p);
    const isCash = p.cls==="cash";
    // Зашитая стоимость ноты. Движок считает её целиком (структурирование,
    // хеджирование, кредитный риск, дистрибуция) на дату выпуска — это и есть
    // ответ, а входная комиссия из файла лишь его грубая замена.
    let entryAmort = 0, embSrc = null;
    const eng = p.cls==="structured_note" ? engineFor(p) : null;
    if(eng && eng.bank_margin && eng.bank_margin.total_pct!=null){
      entryAmort = Math.max(0, eng.bank_margin.total_pct)/noteYears(p);
      embSrc = "engine";
    }else if(p.cls==="structured_note" && p.entry){
      entryAmort = p.entry/(p.tenorYears||3);
      embSrc = "input";
    }
    const advisory = (bf && !isCash) ? bf.advisory : 0;
    const custody  = bf ? bf.custody : 0;
    // Маржа движка уже включает структурную составляющую — складывать её с
    // продуктовой комиссией из файла значило бы посчитать одно и то же дважды.
    const product = (embSrc==="engine") ? 0 : (p.feeProduct||0);
    const feePct = advisory + custody + product + entryAmort;     // % p.a.
    const feeAbs = baseValue * feePct/100;
    return Object.assign({}, p, {baseValue, advisory, custody, product, entryAmort, feePct, feeAbs, isCash, embSrc, eng, tariffKnown:!!bf, fxOk});
  });

  const aum = rows.reduce((s,r)=>s+r.baseValue,0);
  rows.forEach(r=> r.weight = aum? r.baseValue/aum*100 : 0);

  // group helpers
  const groupSum = key => {
    const m={}; rows.forEach(r=>{ const k=r[key]; m[k]=(m[k]||0)+r.baseValue; }); return m;
  };
  const byClass = groupSum("cls");
  const byBroker = groupSum("broker");
  const byCcy = groupSum("ccy");
  const bySector = groupSum("sector");

  // fees
  const feeAbs = rows.reduce((s,r)=>s+r.feeAbs,0);
  const blendedFee = aum? feeAbs/aum*100 : 0;
  const dragPct = Math.max(0, blendedFee - BENCH);
  const dragAbs = aum*dragPct/100;
  // Зашитая маржа ноты — РАЗОВАЯ величина, уплаченная при покупке; она перестаёт
  // существовать в дату погашения. Разносить её по годам для сравнения с
  // регулярной комиссией можно, а умножать на десять лет — нет: раньше проекция
  // начисляла её дважды с лишним. Считаем отдельно и складываем корректно.
  const noteOneOff = rows.reduce((s,r)=>s + (r.embSrc ? r.baseValue*r.entryAmort/100*noteYears(r) : 0), 0);
  const recurringAbs = rows.reduce((s,r)=>s + r.baseValue*(r.advisory+r.custody+r.product)/100, 0);
  const proj10 = recurringAbs*10 + noteOneOff;   // разовое — один раз, а не десять
  // Брокеры портфеля и то, по каким из них тарифы заведены. Разделять важно:
  // «0.64%/год по подтверждённым данным» и «0.64%, потому что остальное принято
  // за ноль» — разные утверждения, и второе продукту говорить нельзя.
  // Позиции в валютах, курса которых нет: они не участвуют в суммах и должны
  // быть видны, иначе активы под анализом окажутся тихо занижены.
  const fxUnknown = rows.filter(r=>!r.fxOk);
  const fxUnknownCcy = [...new Set(fxUnknown.map(r=>r.ccy))];

  const brokersAll = [...new Set(rows.map(r=>r.broker).filter(Boolean))];
  const brokersMissing = brokersAll.filter(b=>!brokerFees(b, tariffs));
  const missingVal = rows.filter(r=>!r.tariffKnown).reduce((s,r)=>s+r.baseValue,0);
  const feeComplete = brokersMissing.length===0;

  const feeComponents = {
    advisory: rows.reduce((s,r)=>s+r.baseValue*r.advisory/100,0),
    custody:  rows.reduce((s,r)=>s+r.baseValue*r.custody/100,0),
    product:  rows.reduce((s,r)=>s+r.baseValue*r.product/100,0),
    entryAmort: rows.reduce((s,r)=>s+r.baseValue*r.entryAmort/100,0)
  };

  // concentration
  const sorted = [...rows].sort((a,b)=>b.baseValue-a.baseValue);
  const top1 = sorted[0]? sorted[0].weight : 0;
  const top5 = sorted.slice(0,5).reduce((s,r)=>s+r.weight,0);
  const hhi = rows.reduce((s,r)=>s+Math.pow(r.weight,2),0); // 0..10000
  // Сектор раньше сравнивался с буквальной строкой "US Tech" из демо-данных:
  // на любой реальной выписке концентрация выходила 0.0% и печаталась как
  // знание, завышая подоценку диверсификации. Считаем по нормализованному
  // ярлыку, а если сектора в файле нет вовсе — не 0, а «не оценено».
  const sectorKnown = rows.some(r=>String(r.sector||"").trim());
  const techNorm = /tech|it\b|информацион|технолог|software|semiconductor|полупровод/i;
  const techShare = sectorKnown
    ? rows.filter(r=>techNorm.test(String(r.sector||""))).reduce((s,r)=>s+r.baseValue,0)/(aum||1)*100
    : null;

  // currency
  const nonBase = Object.entries(byCcy).filter(([c])=>c!==STATE.base).map(([c,v])=>({c,pct:v/aum*100}));
  const largestFx = nonBase.sort((a,b)=>b.pct-a.pct)[0] || {c:null,pct:0};

  // liquidity
  const illiquid = rows.filter(r=>ILLIQUID.has(r.cls)).reduce((s,r)=>s+r.baseValue,0);
  const illiquidPct = aum? illiquid/aum*100 : 0;

  // cash
  const cashPct = (byClass["cash"]||0)/aum*100;

  // structured & derivatives
  const notes = rows.filter(r=>r.cls==="structured_note");
  // Ноты, которые движок ещё не оценил, но оценит: до этого момента комиссии и
  // скор неполные, и интерфейс обязан об этом сказать, а не показывать цифру.
  // «Ещё считается» — только про ноты, по которым ответа для текущих параметров
  // ЕЩЁ НЕТ. Нота, по которой пришла ошибка, уже отвечена: если считать её
  // ожидающей, базовый срез не зафиксируется никогда.
  const enginePending = !!backendBase() && !STATE.engineDown &&
    notes.some(n=>!n.eng && !noteMissing(n).length
                  && (STATE.notePrice[n._id]||{}).sig!==noteSig(n));
  const derivs = rows.filter(r=>r.cls==="derivative");
  const notionalAbs = derivs.reduce((s,r)=>{ const n=(r.notional||0)*(FX[r.ccy]||1)/(FX[STATE.base]||1); return s+n; },0);
  const leverage = aum? notionalAbs/aum : 0;

  // bonds: rough modified duration & rate sensitivity (Macaulay on a par-ish bond)
  const bonds = rows.filter(r=>r.cls==="bond");
  // Дюрация. Раньше при нераспознанных данных подставлялись купон 2.5% и срок
  // 6 лет — и результат печатался в таблице как знание. Без купона или даты
  // погашения дюрацию посчитать нельзя, и говорить об этом надо прямо.
  bonds.forEach(b=>{
    const dt=parseDate(b.maturity);
    const miss=[];
    if(!(+b.coupon>0)) miss.push("coupon");
    if(!dt) miss.push("maturity");
    if(miss.length){ b._dur=null; b._years=null; b._durMissing=miss; return; }
    const y=Math.max(0.005, +b.coupon/100);
    const n=Math.max(0.5, (dt-TODAY)/(365*86400000));
    // Приближение: бумага считается торгующейся по номиналу (доходность = купон).
    const mac=(1+y)/y*(1-1/Math.pow(1+y,n));
    b._dur=mac/(1+y); b._years=n; b._durMissing=null;
  });
  const bondVal = bonds.reduce((s,b)=>s+b.baseValue,0);
  // Средневзвешенная дюрация — только по тем облигациям, где её удалось
  // посчитать, и с явным охватом: «≈4.2 по 3 из 7 бумаг» честнее, чем «≈4.2».
  const durBonds = bonds.filter(b=>b._dur!=null);
  const durVal   = durBonds.reduce((s,b)=>s+b.baseValue,0);
  const portDuration = durVal ? durBonds.reduce((s,b)=>s+b._dur*b.baseValue,0)/durVal : null;
  const durCoverage  = bondVal ? durVal/bondVal : 0;
  const durMissing   = bonds.filter(b=>b._dur==null);

  /* ---------- sub-scores (0..100) ---------- */
  const sub = {};
  // Diversification: top1 & HHI
  sub.diversification = clamp(100 - Math.max(0,(top1-8))*4 - Math.max(0,(hhi-700))*0.03
    - (techShare!=null ? Math.max(0,(techShare-20))*1.2 : 0));
  // Cost: blended fee vs benchmark
  // Пока тарифы не заведены, издержки не оценены. Занизить скор, посчитав
  // только TER, так же неверно, как завысить: вес перераспределяется.
  sub.cost = feeComplete ? clamp(100 - Math.max(0,(blendedFee-0.30))*55) : null;
  // Currency: largest non-base FX share
  sub.currency = clamp(100 - Math.max(0,(largestFx.pct-15))*2.2);
  // Liquidity
  sub.liquidity = clamp(100 - Math.max(0,(illiquidPct-15))*2.6);
  // Product quality: expensive products + risky notes + leverage
  let pq = 100;
  notes.forEach(n=>{
    const br=barrierRisk(n);
    // Штраф — по худшему из двух сигналов. Раньше здесь стояло расстояние до
    // барьера с молчаливым дефолтом 30%; заменить его вероятностью «от выпуска»
    // было бы такой же ошибкой — нота у самого барьера перестала бы штрафоваться.
    const pProb = br.prob!=null ? (br.prob>=25?14 : br.prob>=12?8 : br.prob>=6?3 : 0) : 0;
    const pDist = br.dist!=null ? (br.dist<13?14 : br.dist<20?12 : 0) : 0;
    pq -= Math.max(pProb, pDist);
    if((n.entryAmort+n.product)>1.2) pq-=6;
  });
  rows.forEach(r=>{ if(r.product>=1.5) pq-=5; });
  if(leverage>0.25) pq-= (leverage-0.25)*40;
  sub.quality = clamp(pq);
  // Cash management: ideal 2-8%
  let cs=100; if(cashPct>8) cs-=(cashPct-8)*3.5; if(cashPct<2) cs-=(2-cashPct)*6; sub.cash=clamp(cs);

  const W = {diversification:.25, cost:.25, currency:.10, liquidity:.15, quality:.15, cash:.10};
  const scored = Object.keys(W).filter(k=>sub[k]!=null);
  const wsum = scored.reduce((s,k)=>s+W[k],0) || 1;
  const score = Math.round(scored.reduce((s,k)=>s+sub[k]*W[k]/wsum,0));

  return {
    rows, sorted, aum, byClass, byBroker, byCcy, bySector,
    feeAbs, blendedFee, dragPct, dragAbs, feeComponents, noteOneOff, recurringAbs, proj10,
    brokersAll, brokersMissing, missingVal, feeComplete, fxUnknown, fxUnknownCcy,
    top1, top5, hhi, techShare, sectorKnown, largestFx, nonBase,
    illiquid, illiquidPct, cashPct, notes, derivs, notionalAbs, leverage,
    bonds, bondVal, portDuration, durCoverage, durMissing, durBonds, enginePending,
    sub, score, W
  };
}
function clamp(v){ return Math.max(0,Math.min(100,v)); }
function rating(s){ return s>=75?"good": s>=55?"watch":"risk"; }
function ratingLabel(s){ return t(s>=75?"ratingGood": s>=55?"ratingWatch":"ratingRisk"); }
function ratingColor(s){ return s>=75?"var(--good)": s>=55?"var(--watch)":"var(--risk)"; }

/* ---------- resolutions ---------- */
function resolutions(a){
  const R=[]; const L=STATE.lang;
  const add=(level,title,body,impact)=>R.push({level,title,body,impact});

  // concentration
  if(a.top1>10){
    const top=a.sorted[0];
    add("high",
      L==="ru"?"Высокая концентрация в одной позиции":"High single-position concentration",
      L==="ru"?`«${top.name}» занимает ${pct(a.top1)} портфеля (комфортный порог ~10%). Рассмотрите частичную фиксацию или хедж.`
              :`"${top.name}" is ${pct(a.top1)} of the portfolio (comfort threshold ~10%). Consider partial trimming or a hedge.`);
  }
  if(a.techShare!=null && a.techShare>20){
    add("high",
      L==="ru"?"Секторальная концентрация: US Tech":"Sector concentration: US Tech",
      (()=>{ const nm=a.rows.filter(r=>/tech|it\b|информацион|технолог|software|semiconductor|полупровод/i.test(String(r.sector||"")))
               .sort((x,y)=>y.baseValue-x.baseValue).slice(0,5).map(r=>esc(r.name)).join(", ");
        return L==="ru"?`${pct(a.techShare)} активов в технологическом секторе${nm?` (${nm})`:""}. Высокая корреляция позиций — диверсификация по секторам недостаточна.`
                       :`${pct(a.techShare)} of assets sit in technology${nm?` (${nm})`:""}. Highly correlated names — sector diversification is thin.`; })());
  }
  // fees
  if(a.dragPct>0.3){
    const mult=(a.blendedFee/BENCH).toFixed(1);
    add(a.blendedFee>1.2?"high":"medium",
      L==="ru"?"Высокая совокупная стоимость владения":"High total cost of ownership",
      L==="ru"?`Совокупная комиссия ${pct(a.blendedFee,2)}/год — это ${mult}× от индексного бенчмарка (${pct(BENCH,2)}). Основные драйверы: консультационные сборы, активные фонды и альтернативы.`
              :`Blended fee ${pct(a.blendedFee,2)} p.a. — ${mult}× the indexed benchmark (${pct(BENCH,2)}). Main drivers: advisory fees, active funds and alternatives.`,
      L==="ru"?`Потенциальная экономия ≈ ${fmtFull(a.dragAbs)}/год при переходе части портфеля в индексные инструменты.`
              :`Potential saving ≈ ${fmtFull(a.dragAbs)}/yr by indexing part of the portfolio.`);
  }
  // expensive products
  const exp=a.rows.filter(r=>r.product>=1.5).sort((x,y)=>y.feeAbs-x.feeAbs);
  exp.slice(0,2).forEach(r=>{
    add("medium",
      L==="ru"?`Дорогой продукт: ${r.name}`:`Expensive product: ${r.name}`,
      L==="ru"?`${pct(r.product,2)}/год${r.perf?` + ${r.perf}% performance fee`:""} (≈ ${fmtFull(r.baseValue*r.product/100)}/год только по продукту). Оцените, оправдывает ли результат стоимость.`
              :`${pct(r.product,2)} p.a.${r.perf?` + ${r.perf}% performance fee`:""} (≈ ${fmtFull(r.baseValue*r.product/100)}/yr in product fees alone). Assess whether performance justifies the cost.`);
  });
  // notes
  a.notes.forEach(n=>{
    const br=barrierRisk(n), lvl=barrierLevel(br);
    if(lvl){
      add(lvl,
        L==="ru"?`Нота под риском барьера: ${n.name}`:`Barrier risk: ${n.name}`,
        [ br.dist!=null ? (L==="ru"?`Базовый актив ${n.underlying} сейчас лишь в ${pct(br.dist,0)} от защитного барьера (${n.barrier}%).`
                                   :`${n.underlying} is currently only ${pct(br.dist,0)} above the ${n.barrier}% protection barrier.`) : "",
          br.prob!=null ? (L==="ru"?`Вероятность пробоя за весь срок, посчитанная от даты выпуска, — ${pct(br.prob,1)} (Монте-Карло на указанных допущениях; это не остаточный риск на сегодня).`
                                   :`Probability of a breach over the full term, measured from issue, is ${pct(br.prob,1)} (Monte-Carlo, stated assumptions; this is not the remaining risk as of today).`) : "",
          (L==="ru"?`При пробое капитал-протекции нет — убыток повторяет падение базового актива, под риском ≈ ${fmtFull(n.baseValue)}.`
                   :`No capital protection if breached — losses track the underlying, ≈ ${fmtFull(n.baseValue)} at risk.`)
        ].filter(Boolean).join(" "));
    }
    const miss=noteMissing(n);
    if(miss.length){
      add("medium",
        L==="ru"?`Нота не оценена — не хватает данных: ${n.name}`:`Note not valued — data missing: ${n.name}`,
        L==="ru"?`В выписке нет: ${noteMissingLabel(miss)}. На ${fmtFull(n.baseValue)} нельзя посчитать ни маржу банка, ни вероятность пробоя барьера, ни справедливый купон — эти суммы не участвуют в скоре. Допишите параметры в карточке позиции.`
                :`The statement lacks: ${noteMissingLabel(miss)}. For ${fmtFull(n.baseValue)} neither issuer margin, barrier probability nor fair coupon can be computed — these are excluded from the score. Complete the note in the position card.`);
    }else if(br.src===null){
      // Ни вероятности, ни расстояния до барьера. Раньше здесь подставлялось 30%
      // и нота молча считалась безопасной.
      add("low",
        L==="ru"?`Барьерный риск не оценён: ${n.name}`:`Barrier risk not assessed: ${n.name}`,
        L==="ru"?`Параметры ноты есть, но движок оценку не вернул. Риск на ${fmtFull(n.baseValue)} сейчас не учтён в скоре.`
                :`The note's parameters are present but the engine returned no valuation. The risk on ${fmtFull(n.baseValue)} is not reflected in the score.`);
    }

    // Недоплаченный купон — главное число продукта: разница между купоном,
    // при котором нота стоила бы номинал, и тем, что дал банк.
    const f=(n.eng||{}).fair_coupon||{};
    if(f.shortfall_pp>0.25){
      const yrs=noteYears(n);
      const perYear=n.baseValue*f.shortfall_pp/100;
      // Деньгами величина ОДНА: приведённая стоимость разрыва, она же зашитая
      // маржа. Умножать недобор на срок нельзя — это предполагает, что нота
      // доживёт до погашения и выплатит каждый купон, тогда как автоколл гасит
      // её раньше и купон условный. Раньше здесь печаталось число вчетверо
      // больше маржи, и оба стояли рядом как «та же сумма».
      const pv=n.baseValue*((n.eng.bank_margin||{}).total_pct||0)/100;
      add(f.shortfall_pp>=1.5?"high":"medium",
        L==="ru"?`Купон ниже справедливого: ${n.name}`:`Coupon below fair value: ${n.name}`,
        L==="ru"?`Справедливый купон ${pct(f.fair_coupon_pct,2)} против предложенных ${pct(f.offered_coupon_pct,2)} — недобор ${f.shortfall_pp.toFixed(2)} п.п. годовых. В деньгах разрыв стоит ≈ ${fmtFull(pv)} (${pct((n.eng.bank_margin||{}).total_pct||0,2)} номинала) — это приведённая стоимость, она же зашитая маржа эмитента: одна и та же величина, показанная через купон и через сумму, а не две потери. Умножать недобор на срок нельзя: нота с автоколлом гасится раньше и купон условный. ${ENGINE_CAVEAT.ru}${noteBasis(n)==="remaining"?" "+BASIS_CAVEAT.ru:""}`
                :`Fair coupon ${pct(f.fair_coupon_pct,2)} vs ${pct(f.offered_coupon_pct,2)} offered — a shortfall of ${f.shortfall_pp.toFixed(2)} pp p.a. In money the gap is worth ≈ ${fmtFull(pv)} (${pct((n.eng.bank_margin||{}).total_pct||0,2)} of nominal) — its present value, which is the embedded issuer margin: one quantity expressed two ways, not two losses. The shortfall must not be multiplied by the tenor: an autocallable note redeems early and the coupon is conditional. ${ENGINE_CAVEAT.en}${noteBasis(n)==="remaining"?" "+BASIS_CAVEAT.en:""}`,
        L==="ru"?`≈ ${fmtFull(pv)} приведённой стоимости — предмет для разговора с эмитентом при следующем выпуске`
                :`≈ ${fmtFull(pv)} in present value — a talking point with the issuer on the next issue`);
    }

    if(n.embSrc==="engine" && n.eng.bank_margin.total_pct<=0){
      const b=n.eng.bank_margin;
      add("low",
        L==="ru"?`Нота оценена не ниже номинала: ${n.name}`:`Note priced at or above par: ${n.name}`,
        L==="ru"?`Справедливая стоимость ${pct(n.eng.valuation.fair_value_pct,2)} от номинала — при указанных допущениях эмитент не зашил маржу, а отдал ${pct(Math.abs(b.total_pct),2)}. Проверьте допущения волатильности: результат чувствителен именно к ним. ${ENGINE_CAVEAT.ru}`
                :`Fair value is ${pct(n.eng.valuation.fair_value_pct,2)} of nominal — under the stated assumptions the issuer embedded no margin but gave away ${pct(Math.abs(b.total_pct),2)}. Check the volatility assumption: the result is most sensitive to it. ${ENGINE_CAVEAT.en}`);
    }else if(n.embSrc==="engine"){
      const b=n.eng.bank_margin;
      add(b.total_pct>=3.5?"medium":"low",
        L==="ru"?`Зашитая стоимость ноты: ${n.name}`:`Embedded cost: ${n.name}`,
        L==="ru"?`Эмитент зашил ${pct(b.total_pct,2)} от номинала (${basisLabel(n)}) ≈ ${fmtFull(n.baseValue*b.total_pct/100)} — это тот же недобор купона, выраженный суммой, а не отдельная потеря. Разложение: структурирование ${pct(b.components?.structuring_fee||0,2)}, хеджирование ${pct(b.components?.hedging_cost||0,2)}, кредитный риск ${pct(b.components?.credit_risk_premium||0,2)}, дистрибуция ${pct(b.components?.distribution_fee||0,2)}. ${ENGINE_CAVEAT.ru}`
                :`The issuer embedded ${pct(b.total_pct,2)} of nominal (${basisLabel(n)}) ≈ ${fmtFull(n.baseValue*b.total_pct/100)} — the same gap as the coupon shortfall, expressed as an amount, not a separate loss. Breakdown: structuring ${pct(b.components?.structuring_fee||0,2)}, hedging ${pct(b.components?.hedging_cost||0,2)}, credit risk ${pct(b.components?.credit_risk_premium||0,2)}, distribution ${pct(b.components?.distribution_fee||0,2)}. ${ENGINE_CAVEAT.en}`);
    }else if(n.entry||n.product){
      add("low",
        L==="ru"?`Зашитая стоимость ноты: ${n.name}`:`Embedded cost: ${n.name}`,
        L==="ru"?`Входная комиссия ${pct(n.entry||0,1)} + ${pct(n.product||0,1)}/год структурной маржи — оценка по данным из файла, движок ноту не считал. Купон ${pct(n.coupon||0,1)} частично уходит на издержки эмитента.`
                :`Entry fee ${pct(n.entry||0,1)} + ${pct(n.product||0,1)} p.a. structuring margin — taken from the file, not priced by the engine. Part of the ${pct(n.coupon||0,1)} coupon funds issuer costs.`);
    }
  });
  // derivatives
  if(a.leverage>0.10){
    const lvHigh=a.leverage>0.25;
    add(lvHigh?"medium":"low",
      L==="ru"?"Контроль плеча по деривативам":"Derivative leverage check",
      L==="ru"?`Совокупный условный номинал ≈ ${fmtFull(a.notionalAbs)} = ${a.leverage.toFixed(2)}× капитала. ${lvHigh?"Высокое плечо — нужен маржинальный контроль.":"Преимущественно защитные позиции — приемлемо."}`
              :`Aggregate notional ≈ ${fmtFull(a.notionalAbs)} = ${a.leverage.toFixed(2)}× equity. ${lvHigh?"Elevated leverage — monitor margin.":"Mostly protective — acceptable."}`);
  }
  a.derivs.forEach(d=>{
    const dt=parseDate(d.expiry); if(dt){ const dl=daysBetween(TODAY,dt); if(dl<120 && dl>=0)
      add("low",
        L==="ru"?`Скоро экспирация: ${d.name}`:`Expiring soon: ${d.name}`,
        L==="ru"?`До экспирации ${dl} дн. — нужно решение: ролл, закрытие или замена хеджа.`
                :`${dl} days to expiry — decide: roll, close or replace the hedge.`);
    }
  });
  // currency
  if(a.largestFx.pct>15){
    add("medium",
      L==="ru"?"Валютный перекос":"Currency mismatch",
      L==="ru"?`${pct(a.largestFx.pct)} активов в ${a.largestFx.c} при базовой валюте ${STATE.base}. Несогласованность с базой — рассмотрите частичное хеджирование FX.`
              :`${pct(a.largestFx.pct)} of assets in ${a.largestFx.c} against ${STATE.base} base. Consider partial FX hedging.`);
  }
  // liquidity
  if(a.illiquidPct>15){
    add(a.illiquidPct>30?"high":"medium",
      L==="ru"?"Повышенная неликвидность":"Elevated illiquidity",
      L==="ru"?`${pct(a.illiquidPct)} в структурных нотах и альтернативах (hedge/PE, частично с локап-периодом). Сверьте с потребностью клиента в ликвидности и обязательствами.`
              :`${pct(a.illiquidPct)} in structured notes and alternatives (hedge/PE, partly locked-up). Reconcile with the client's liquidity needs and commitments.`);
  }
  // cash
  if(a.cashPct>8){
    add("medium",
      L==="ru"?"Избыточный кэш":"Excess cash",
      L==="ru"?`${pct(a.cashPct)} в денежных средствах (≈ ${fmtFull(a.byClass.cash||0)}). Денежный «drag» на доходность — рассмотрите размещение в money-market или короткие бонды.`
              :`${pct(a.cashPct)} in cash (≈ ${fmtFull(a.byClass.cash||0)}). Cash drag on returns — consider money-market or short bonds.`);
  } else if(a.cashPct<2){
    add("low",
      L==="ru"?"Низкий буфер ликвидности":"Thin liquidity buffer",
      L==="ru"?`Кэш ${pct(a.cashPct)} — мало для покрытия неожиданных оттоков/маржи без вынужденных продаж.`
              :`Cash at ${pct(a.cashPct)} — thin for covering unexpected outflows/margin without forced sales.`);
  }

  // bond interest-rate risk
  // Дюрация могла не посчитаться — тогда о процентном риске мы просто не знаем
  // и молчать об этом нельзя: облигации в портфеле есть, оценки риска нет.
  if(a.durMissing.length){
    const val=a.durMissing.reduce((x,b)=>x+b.baseValue,0);
    add(a.bondVal && val/a.bondVal>0.5 ? "medium" : "low",
      L==="ru"?`Дюрация не посчитана по ${a.durMissing.length} облигац${a.durMissing.length===1?"ии":"иям"}`
              :`Duration not computed for ${a.durMissing.length} bond(s)`,
      L==="ru"?`Нет купона или даты погашения у: ${a.durMissing.slice(0,4).map(b=>esc(b.name)).join(", ")}${a.durMissing.length>4?" и др.":""} (${fmtFull(val)}). Процентный риск по этим бумагам не оценён и в дюрацию портфеля не входит — допишите купон и погашение в карточке позиции.`
              :`Coupon or maturity missing for: ${a.durMissing.slice(0,4).map(b=>esc(b.name)).join(", ")}${a.durMissing.length>4?" and others":""} (${fmtFull(val)}). Rate risk on these is not assessed and is excluded from portfolio duration — add coupon and maturity in the position card.`);
  }
  if(a.aum && a.portDuration!=null && a.bondVal/a.aum>0.10 && a.portDuration>6){
    add("medium",
      L==="ru"?"Процентный риск облигаций":"Bond interest-rate risk",
      L==="ru"?`Дюрация облигационной части ≈ ${a.portDuration.toFixed(1)}${a.durCoverage<0.999?` (посчитана по ${pct(a.durCoverage*100,0)} номинала — по остальным бумагам не хватает данных)`:""}: при росте ставок на +1% эта часть портфеля подешевеет примерно на ${a.portDuration.toFixed(1)}%. Расчёт по приближению «бумага торгуется по номиналу».`
              :`Bond-sleeve duration ≈ ${a.portDuration.toFixed(1)}${a.durCoverage<0.999?` (covering ${pct(a.durCoverage*100,0)} of nominal — the rest lacks data)`:""}: a +1% rate move would cut that sleeve by about ${a.portDuration.toFixed(1)}%. Computed on a par-priced approximation.`);
  }

  const order={high:0,medium:1,low:2};
  return R.sort((x,y)=>order[x.level]-order[y.level]);
}

/* ============================================================
   SVG widgets
   ============================================================ */
function donut(segments, size=190){
  const total=segments.reduce((s,x)=>s+x.value,0)||1;
  const r=size/2-14, cx=size/2, cy=size/2, C=2*Math.PI*r; let off=0;
  const arcs=segments.map(s=>{
    const frac=s.value/total, len=C*frac;
    const el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="22"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off+=len; return el;
  }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${arcs}
    <circle cx="${cx}" cy="${cy}" r="${r-13}" fill="var(--panel)"/>
  </svg>`;
}
function gauge(score){
  const size=170,r=70,cx=size/2,cy=size/2, C=Math.PI*r; // half circle
  const frac=score/100, col=ratingColor(score);
  return `<svg width="${size}" height="${size/2+26}" viewBox="0 0 ${size} ${size/2+26}">
    <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="var(--navy)" stroke-width="16" stroke-linecap="round"/>
    <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round"
      stroke-dasharray="${C*frac} ${C}"/>
    <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="38" font-weight="800" fill="var(--ink)">${score}</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="12" fill="var(--muted)">/ 100</text>
  </svg>`;
}

   ============================================================ */
function loadCfg(){ let c={backendUrl:"",finnhubKey:""}; try{ Object.assign(c, JSON.parse(localStorage.getItem("wl_cfg")||"{}")); }catch(e){} return c; }
function saveCfg(){ try{ localStorage.setItem("wl_cfg", JSON.stringify(DATA.cfg)); }catch(e){} }

};
// Hosted backend (Deno Deploy) used by the public demo. Override via ⚙ settings.

// Effective backend: explicit ⚙ config > local one-URL server (localhost) > hosted Deno Deploy.
function backendBase(){
